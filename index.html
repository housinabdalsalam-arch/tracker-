  else html += '<span class="dot" style="background:var(--warning)"></span>Nicht verbunden — nur lokal';
  html += '</div>';
  
  html += '<div class="input-row"><label class="input-label">Token</label>';
  html += '<input type="password" class="text-input" id="ghTokenInput" value="' + escapeHtml(g.token) + '" placeholder="github_pat_..."></div>';
  
  html += '<div class="input-row"><label class="input-label">Gist-ID (für zweites Gerät)</label>';
  html += '<input type="text" class="text-input" id="ghGistInput" value="' + escapeHtml(g.gistId) + '" placeholder="Leer = neuer Gist"></div>';
  
  html += '<div style="margin-top:14px;">';
  html += '<button class="btn primary" data-action="save-gh">Token prüfen</button>';
  if (isConnected && !hasGist) html += '<button class="btn" data-action="create-gist">Gist erstellen</button>';
  if (isConnected && hasGist) html += '<button class="btn" data-action="sync-now">Sync</button>';
  if (isConnected && hasGist) html += '<button class="btn" data-action="download-now">Laden</button>';
  html += '</div></div>';
  
  html += '<div class="card"><h2 style="font-size:18px;margin:0 0 12px;">📋 Setup (10 Min)</h2>';
  html += '<div style="font-size:13px;line-height:1.6;">';
  html += '<p><strong>1.</strong> Account auf <a href="https://github.com/signup" target="_blank">github.com</a> (kostenlos).</p>';
  html += '<p style="margin-top:10px;"><strong>2.</strong> Token: <a href="https://github.com/settings/tokens?type=beta" target="_blank">github.com/settings/tokens</a></p>';
  html += '<ol>';
  html += '<li>"Generate new token" klicken</li>';
  html += '<li>Name: LifeTracker, Expiration: No expiration</li>';
  html += '<li>Repo access: Public (read-only)</li>';
  html += '<li>Account permissions → <strong>Gists: Read and write</strong></li>';
  html += '<li>Generate → Token kopieren (nur einmal sichtbar!)</li>';
  html += '</ol>';
  html += '<p style="margin-top:10px;"><strong>3.</strong> Hier einfügen → "Token prüfen" → "Gist erstellen". Fertig.</p>';
  html += '<p style="margin-top:10px;"><strong>4. iPhone:</strong> Datei öffnen → Safari → Teilen → "Zum Home-Bildschirm". Token + Gist-ID einfügen → "Laden".</p>';
  html += '</div></div>';
  
  html += '<div class="card"><h2 style="font-size:18px;margin:0 0 12px;">🗂 Daten</h2>';
  html += '<button class="btn" data-action="export-json">Export JSON</button>';
  html += '<button class="btn" data-action="import-json">Import JSON</button>';
  html += '<button class="btn danger" data-action="clear-all">⚠️ Alles löschen</button>';
  html += '<input type="file" id="importFile" accept=".json" style="display:none;">';
  html += '</div>';
  
  // === GOOGLE CALENDAR SETUP ===
  html += '<div class="card"><h2 style="font-size:18px;margin:0 0 12px;">📅 Google Calendar</h2>';
  
  if (state.gcal.connected) {
    html += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">';
    html += '<span class="gcal-status-connected">✓ Verbunden</span>';
    if (state.gcal.lastFetch) {
      const lf = new Date(state.gcal.lastFetch);
      html += '<span style="font-size:11px;color:var(--text-muted);">Letzter Abruf: ' + lf.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}) + '</span>';
    }
    html += '</div>';
    html += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">' + (state.gcal.events ? state.gcal.events.length : 0) + ' Termine in den nächsten 48h geladen</div>';
    html += '<button class="btn" data-action="gcal-refresh">🔄 Jetzt aktualisieren</button>';
    html += '<button class="btn danger" data-action="gcal-disconnect">Trennen</button>';
  } else if (state.gcal.clientId && state.gcal.apiKey) {
    html += '<div style="font-size:13px;margin-bottom:12px;">Credentials gespeichert. Klick zum Verbinden:</div>';
    html += '<button class="btn primary" data-action="gcal-connect">🔌 Mit Google verbinden</button>';
    html += '<button class="btn" data-action="gcal-edit-creds">Credentials ändern</button>';
  } else {
    // First-time setup
    html += '<details><summary style="cursor:pointer;font-weight:600;font-size:13px;">📋 Setup-Anleitung (15 Min, einmalig)</summary>';
    html += '<div class="gcal-setup-step"><strong>1.</strong> Gehe zur <a href="https://console.cloud.google.com/" target="_blank" rel="noopener">Google Cloud Console</a> und erstelle ein neues Projekt (z.B. "Lebens-Tracker")</div>';
    html += '<div class="gcal-setup-step"><strong>2.</strong> APIs & Services → Library → suche "Google Calendar API" → <strong>Enable</strong></div>';
    html += '<div class="gcal-setup-step"><strong>3.</strong> APIs & Services → OAuth consent screen → External → fülle aus (App-Name, Email) → speichern. Bei <em>Test users</em> deine eigene Gmail-Adresse hinzufügen.</div>';
    html += '<div class="gcal-setup-step"><strong>4.</strong> APIs & Services → Credentials → <strong>Create Credentials → API Key</strong>. Kopier den Key. (Optional: Edit API Key → Restrictions → Google Calendar API)</div>';
    html += '<div class="gcal-setup-step"><strong>5.</strong> Create Credentials → <strong>OAuth Client ID → Web application</strong>. Unter "Authorized JavaScript origins" füge ein: <code>https://housinabdalsalam-arch.github.io</code></div>';
    html += '<div class="gcal-setup-step"><strong>6.</strong> Kopier die Client ID. Beide Werte unten einfügen.</div>';
    html += '</details>';
    
    html += '<div class="gcal-setup">';
    html += '<label class="habit-form-label">OAuth Client ID</label>';
    html += '<input type="text" class="gcal-setup-input" id="gcalClientIdInput" placeholder="123456-abc.apps.googleusercontent.com" value="' + escapeHtml(state.gcal.clientId) + '">';
    html += '<label class="habit-form-label">API Key</label>';
    html += '<input type="text" class="gcal-setup-input" id="gcalApiKeyInput" placeholder="AIzaSy...">';
    html += '<button class="btn primary full" data-action="gcal-save-creds" style="margin-top:8px;">Credentials speichern + verbinden</button>';
    html += '</div>';
  }
  html += '</div>';
  
  return html;
}

// =============================================
// EVENTS
// =============================================
function getOrCreateWeek(wk) {
  if (!state.weeks[wk]) state.weeks[wk] = { type: 'A', days: {}, weekNote: '' };
  return state.weeks[wk];
}

function attachEvents() {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.onclick = () => {
      const newTab = b.dataset.tab;
      // Reset transient UI state on tab change
      state._editingHabit = null;
      if (state.activeTab !== newTab) {
        _vocabUI.reviewShown = false;
        _vocabUI.reviewIdx = 0;
        // Clear pending search debounce timer
        if (_vocabUI._searchTimer) {
          clearTimeout(_vocabUI._searchTimer);
          _vocabUI._searchTimer = null;
        }
      }
      state.activeTab = newTab;
      render();
    };
  });
  
  document.querySelectorAll('[data-action]').forEach(el => {
    const action = el.dataset.action;
    
    if (action === 'set-theme') el.onclick = () => {
      state.theme = el.dataset.theme;
      applyTheme();
      saveLocal();
      render();
      scheduleSync();
    };
    
    // ===== HABIT MANAGER =====
    if (action === 'edit-language') el.onclick = () => {
      const langHabit = HABITS.find(h => h.id === 'language');
      state._editingHabit = {
        id: 'language',
        label: langHabit.label,
        icon: langHabit.icon,
        color: langHabit.color,
        targetA: langHabit.targetA,
        targetB: langHabit.targetB,
      };
      render();
    };
    
    if (action === 'reset-language') el.onclick = () => {
      if (confirm('Spanisch zurücksetzen? Bisherige Tracking-Daten bleiben erhalten.')) {
        state.languageSlot = null;
        rebuildHabits();
        saveLocal(); render(); scheduleSync();
      }
    };
    
    if (action === 'add-custom-habit') el.onclick = () => {
      state._editingHabit = {
        id: 'custom_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
        label: '',
        icon: '⭐',
        cat: 'output',
        color: HABIT_COLORS[0],
        targetA: 3,
        targetB: 1,
        isNew: true,
      };
      render();
    };
    
    if (action === 'edit-custom') el.onclick = () => {
      const id = el.dataset.id;
      const h = HABITS.find(habit => habit.id === id);
      if (!h) return;
      state._editingHabit = {
        id: h.id,
        label: h.label,
        icon: h.icon,
        cat: h.cat,
        color: h.color,
        targetA: h.targetA,
        targetB: h.targetB,
      };
      render();
    };
    
    if (action === 'delete-custom') el.onclick = () => {
      const id = el.dataset.id;
      const h = HABITS.find(habit => habit.id === id);
      if (!h) return;
      const dataCount = countHabitData(id);
      let msg = 'Habit "' + h.label + '" wirklich löschen?';
      if (dataCount > 0) {
        msg += '\n\nEs gibt ' + dataCount + ' Tracking-Einträge für dieses Habit. Diese werden ebenfalls gelöscht.';
      }
      if (confirm(msg)) {
        state.customHabits = (state.customHabits || []).filter(ch => ch.id !== id);
        // Clean up tracking data from all weeks
        Object.values(state.weeks).forEach(wd => {
          if (!wd.days) return;
          Object.values(wd.days).forEach(day => {
            if (day && day[id] !== undefined) {
              delete day[id];
            }
          });
        });
        rebuildHabits();
        saveLocal(); render(); scheduleSync();
      }
    };
    
    if (action === 'select-icon') el.onclick = () => {
      if (!state._editingHabit) return;
      state._editingHabit.icon = el.dataset.icon;
      // Update UI immediately - mark selected
      document.querySelectorAll('#habitFormIcons .habit-icon-option').forEach(opt => {
        opt.classList.toggle('selected', opt.dataset.icon === el.dataset.icon);
      });
    };
    
    if (action === 'select-color') el.onclick = () => {
      if (!state._editingHabit) return;
      state._editingHabit.color = el.dataset.color;
      document.querySelectorAll('#habitFormColors .habit-color-option').forEach(opt => {
        opt.classList.toggle('selected', opt.dataset.color === el.dataset.color);
      });
    };
    
    if (action === 'save-habit-form') el.onclick = () => {
      const edit = state._editingHabit;
      if (!edit) return;
      
      const nameEl = document.getElementById('habitFormName');
      const targetAEl = document.getElementById('habitFormTargetA');
      const targetBEl = document.getElementById('habitFormTargetB');
      const catEl = document.getElementById('habitFormCat');
      
      const label = (nameEl?.value || '').trim().slice(0, 50);
      if (!label) { alert('Name darf nicht leer sein'); return; }
      
      const targetA = Math.max(0, Math.min(7, parseInt(targetAEl?.value) || 0));
      const targetB = Math.max(0, Math.min(7, parseInt(targetBEl?.value) || 0));
      
      if (targetA === 0 && targetB === 0) {
        alert('Mindestens ein Wochen-Ziel muss > 0 sein.');
        return;
      }
      
      if (edit.id === 'language') {
        // Update language slot
        state.languageSlot = {
          label, icon: edit.icon, color: edit.color, targetA, targetB,
        };
      } else {
        // Custom habit (new or edit)
        const existingCreated = (state.customHabits || []).find(ch => ch.id === edit.id)?.createdAt;
        const newCustom = {
          id: edit.id,
          label,
          icon: edit.icon,
          cat: catEl?.value || edit.cat || 'output',
          color: edit.color,
          targetA, targetB,
          createdAt: existingCreated || weekKey(startOfWeek(TODAY)),
        };
        if (edit.isNew) {
          state.customHabits = state.customHabits || [];
          state.customHabits.push(newCustom);
        } else {
          state.customHabits = (state.customHabits || []).map(ch => 
            ch.id === edit.id ? newCustom : ch
          );
        }
      }
      
      state._editingHabit = null;
      rebuildHabits();
      saveLocal(); render(); scheduleSync();
    };
    
    if (action === 'cancel-habit-form') el.onclick = () => {
      state._editingHabit = null;
      render();
    };
    
    if (action === 'goto-goals') el.onclick = () => {
      state.activeTab = 'goals';
      render();
    };
    
    if (action === 'dismiss-fresh-start') el.onclick = () => {
      const wk = el.dataset.week;
      localStorage.setItem('freshStartDismissed_' + wk, 'true');
      render();
    };
    
    if (action === 'refresh-wisdom') el.onclick = () => {
      state.wisdomOffset++;
      render();
    };
    
    if (action === 'dismiss-alert') el.onclick = () => {
      const title = el.dataset.alertTitle;
      const key = 'alertsDismissed_' + fmtDate(TODAY);
      const dismissed = JSON.parse(localStorage.getItem(key) || '[]');
      if (!dismissed.includes(title)) {
        dismissed.push(title);
        localStorage.setItem(key, JSON.stringify(dismissed));
      }
      render();
    };
    
    if (action === 'prev-week') el.onclick = () => { state.currentWeek = addDays(state.currentWeek, -7); render(); };
    if (action === 'next-week') el.onclick = () => { state.currentWeek = addDays(state.currentWeek, 7); render(); };
    if (action === 'today') el.onclick = () => { state.currentWeek = startOfWeek(TODAY); render(); };
    
    if (action === 'toggle-vacation-check') el.onclick = () => {
      const wk = weekKey(state.currentWeek);
      const wd = getOrCreateWeek(wk);
      if (!wd.days[0]) wd.days[0] = {};
      wd.days[0].vacationCheck = !wd.days[0].vacationCheck;
      saveLocal(); render(); scheduleSync();
    };
    
    if (action === 'toggle-type') el.onclick = () => {
      const wd = getOrCreateWeek(weekKey(state.currentWeek));
      // Cycle: A → B → U → A
      if (wd.type === 'A') wd.type = 'B';
      else if (wd.type === 'B') wd.type = 'U';
      else wd.type = 'A';
      saveLocal(); render(); scheduleSync();
    };
    
    if (action === 'toggle-habit' && !el.disabled) el.onclick = () => {
      const wk = weekKey(state.currentWeek);
      const wd = getOrCreateWeek(wk);
      const dayIdx = parseInt(el.dataset.day);
      const habitId = el.dataset.habit;
      if (!wd.days[dayIdx]) wd.days[dayIdx] = {};
      if (wd.days[dayIdx][habitId]) {
        // Was true, now toggle off: delete to keep data clean
        delete wd.days[dayIdx][habitId];
      } else {
        wd.days[dayIdx][habitId] = true;
      }
      saveLocal(); render(); scheduleSync();
    };
    
    if (action === 'set-mood' && !el.disabled) el.onclick = () => {
      const wk = weekKey(state.currentWeek);
      const wd = getOrCreateWeek(wk);
      const dayIdx = parseInt(el.dataset.day);
      const mood = parseInt(el.dataset.mood);
      if (!wd.days[dayIdx]) wd.days[dayIdx] = {};
      wd.days[dayIdx].mood = wd.days[dayIdx].mood === mood ? null : mood;
      saveLocal(); render(); scheduleSync();
    };
    
    if (action === 'update-note') el.oninput = (e) => {
      const wk = weekKey(state.currentWeek);
      const wd = getOrCreateWeek(wk);
      const dayIdx = parseInt(el.dataset.day);
      if (!wd.days[dayIdx]) wd.days[dayIdx] = {};
      wd.days[dayIdx].note = e.target.value;
      saveLocalDebounced(); scheduleSync();
    };
    
    if (action === 'edit-north-star') el.onclick = () => {
      const current = state.northStar || '';
      let text;
      if (!current) {
        // First time: offer both options
        const choice = prompt(
          'Wähle deinen North Star:\n\n' +
          '1 = Dr.-Ing. Abdalsalam Housin\n' +
          '2 = Senior Controls Engineer mit PhD\n' +
          '3 = Eigenen schreiben\n\n' +
          'Eingabe (1, 2 oder eigener Text):'
        );
        if (choice === null) return;
        const trimmed = choice.trim();
        if (trimmed === '1') text = 'Dr.-Ing. Abdalsalam Housin';
        else if (trimmed === '2') text = 'Senior Controls Engineer mit PhD';
        else text = trimmed;
      } else {
        text = prompt('Dein North Star — 2-3-Jahres-Ziel oder Identität:', current);
        if (text === null) return;
      }
      state.northStar = text.trim().slice(0, 500);
      saveLocal(); render(); scheduleSync();
    };
    
    if (action === 'update-reflection') el.oninput = (e) => {
      const wk = weekKey(state.currentWeek);
      const wd = getOrCreateWeek(wk);
      if (!wd.reflection) wd.reflection = { output: '', energy: '', change: '' };
      const field = el.dataset.field;
      wd.reflection[field] = e.target.value;
      saveLocalDebounced(); scheduleSync();
    };
    
    if (action === 'update-week-note') el.oninput = (e) => {
      const wk = weekKey(state.currentWeek);
      const wd = getOrCreateWeek(wk);
      wd.weekNote = e.target.value;
      saveLocalDebounced(); scheduleSync();
    };
    
    if (action === 'toggle-goal') el.onclick = () => {
      const id = el.dataset.id;
      if (!state.goals[id]) return;
      state.goals[id].done = !state.goals[id].done;
      saveLocal(); render(); scheduleSync();
    };
    
    if (action === 'edit-goal') el.onclick = () => {
      const id = el.dataset.id;
      const g = state.goals[id];
      if (!g) return;
      const text = prompt('Ziel bearbeiten:', g.title);
      if (text !== null && text.trim()) {
        g.title = text.trim().slice(0, 200);
        saveLocal(); render(); scheduleSync();
      }
    };
    
    if (action === 'delete-goal') el.onclick = () => {
      const id = el.dataset.id;
      if (confirm('Ziel löschen?')) {
        delete state.goals[id];
        saveLocal(); render(); scheduleSync();
      }
    };
    
    if (action === 'add-goal') el.onclick = () => {
      const titleEl = document.getElementById('newGoalTitle');
      const catEl = document.getElementById('newGoalCat');
      if (!titleEl || !catEl) return;
      const title = titleEl.value.trim().slice(0, 200);
      const category = catEl.value;
      if (!title) { alert('Titel eingeben'); return; }
      const id = uuid();
      state.goals[id] = {
        quarter: getQuarter(TODAY),
        title, category, done: false,
        createdAt: new Date().toISOString(),
      };
      saveLocal(); render(); scheduleSync();
    };
    
    if (action === 'add-suggested') el.onclick = () => {
      const title = el.dataset.title;
      const category = el.dataset.cat;
      const id = uuid();
      state.goals[id] = {
        quarter: getQuarter(TODAY),
        title, category, done: false,
        createdAt: new Date().toISOString(),
      };
      saveLocal(); render(); scheduleSync();
    };
    
    // ===== VOCAB HANDLERS =====
    if (action === 'vocab-set-lang') el.onclick = () => {
      // Preserve current input values across re-render
      const sourceEl = document.getElementById('vocabSource');
      const targetEl = document.getElementById('vocabTarget');
      const savedSource = sourceEl ? sourceEl.value : '';
      const savedTarget = targetEl ? targetEl.value : '';
      
      _vocabUI.activeLang = el.dataset.lang;
      // Persist last used language
      if (!state.vocab.settings) state.vocab.settings = {};
      state.vocab.settings.lastLang = el.dataset.lang;
      saveLocal();
      
      render();
      
      // Restore values after re-render
      setTimeout(() => {
        const s = document.getElementById('vocabSource');
        const t = document.getElementById('vocabTarget');
        if (s && savedSource) s.value = savedSource;
        if (t && savedTarget) t.value = savedTarget;
      }, 0);
    };
    
    if (action === 'vocab-input-enter') el.onkeydown = (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (el.dataset.submit === 'true') {
          // Trigger add
          const addBtn = document.querySelector('[data-action="vocab-add"]');
          if (addBtn) addBtn.click();
        } else if (el.dataset.next) {
          // Move to next field
          const next = document.getElementById(el.dataset.next);
          if (next) next.focus();
        }
      }
    };
    
    if (action === 'vocab-add') el.onclick = () => {
      const sourceEl = document.getElementById('vocabSource');
      const targetEl = document.getElementById('vocabTarget');
      if (!sourceEl || !targetEl) return;
      const source = sourceEl.value.trim().slice(0, 200);
      const target = targetEl.value.trim().slice(0, 200);
      if (!source || !target) {
        alert('Wort und Übersetzung müssen ausgefüllt sein.');
        return;
      }
      let result = addVocabPair(_vocabUI.activeLang, source, target);
      if (!result.added && result.reason === 'duplicate') {
        const existingTarget = result.existing ? result.existing.target : '';
        const proceed = confirm(
          'Dieses Wort gibt es schon:\n\n' +
          '"' + source + '" → "' + existingTarget + '"\n\n' +
          'Trotzdem als neue Karte hinzufügen?'
        );
        if (!proceed) {
          sourceEl.focus();
          sourceEl.select();
          return;
        }
        // Force re-add bypassing duplicate check
        result = addVocabPair(_vocabUI.activeLang, source, target, true);
      }
      if (!result.added) {
        alert('Fehler beim Hinzufügen: ' + (result.reason || 'unbekannt'));
        return;
      }
      sourceEl.value = '';
      targetEl.value = '';
      saveLocal();
      render();
      scheduleSync();
      setTimeout(() => {
        const s = document.getElementById('vocabSource');
        if (s) {
          s.focus();
          s.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 50);
    };
    
    if (action === 'vocab-filter') el.onclick = () => {
      _vocabUI.filterLang = el.dataset.lang;
      _vocabUI.listLimit = 50;  // reset pagination
      render();
    };
    
    if (action === 'vocab-search') el.oninput = (e) => {
      const val = e.target.value;
      const cursorPos = e.target.selectionStart;
      _vocabUI.searchQuery = val;
      _vocabUI.listLimit = 50;
      // Debounce render to avoid lag while typing
      clearTimeout(_vocabUI._searchTimer);
      _vocabUI._searchTimer = setTimeout(() => {
        render();
        const newSearch = document.getElementById('vocabSearch');
        if (newSearch) {
          newSearch.focus();
          try { newSearch.setSelectionRange(cursorPos, cursorPos); } catch(err) {}
        }
      }, 150);
    };
    
    if (action === 'vocab-show-more') el.onclick = () => {
      _vocabUI.listLimit = (_vocabUI.listLimit || 50) + 50;
      render();
    };
    
    // === GOOGLE CALENDAR HANDLERS ===
    if (action === 'gcal-save-creds') el.onclick = () => {
      const idEl = document.getElementById('gcalClientIdInput');
      const keyEl = document.getElementById('gcalApiKeyInput');
      if (!idEl || !keyEl) return;
      const clientId = idEl.value.trim();
      const apiKey = keyEl.value.trim();
      if (!clientId || !apiKey) {
        alert('Beide Felder müssen ausgefüllt sein.');
        return;
      }
      if (!clientId.includes('.apps.googleusercontent.com')) {
        if (!confirm('Client ID sieht ungewöhnlich aus (sollte mit .apps.googleusercontent.com enden). Trotzdem speichern?')) return;
      }
      state.gcal.clientId = clientId;
      state.gcal.apiKey = apiKey;
      saveLocal();
      
      // Initialize and trigger connect
      if (gcalIsReady()) {
        try { gapi.client.setApiKey(apiKey); } catch(e) { console.error(e); }
        gcalInitTokenClient();
        // Trigger consent popup
        gcalRequestToken(false)
          .then(() => {
            gcalStartAutoRefresh();
            render();
          })
          .catch(err => {
            alert('Verbindung fehlgeschlagen. Prüfe ob die Domain in der Google Cloud Console als "Authorized JavaScript origin" eingetragen ist.');
            console.error(err);
            render();
          });
      } else {
        alert('Google API noch nicht geladen. Versuche es in einer Sekunde nochmal.');
      }
    };
    
    if (action === 'gcal-edit-creds') el.onclick = () => {
      state.gcal.clientId = '';
      state.gcal.apiKey = '';
      saveLocal();
      render();
    };
    
    if (action === 'gcal-connect') el.onclick = () => {
      if (!gcalIsReady()) {
        alert('Google API noch nicht geladen. Bitte einen Moment warten.');
        return;
      }
      if (!state.gcal.clientId || !state.gcal.apiKey) {
        alert('Bitte erst Client ID und API Key im Sync-Tab eingeben.');
        state.activeTab = 'sync';
        render();
        return;
      }
      try { gapi.client.setApiKey(state.gcal.apiKey); } catch(e) {}
      gcalInitTokenClient();
      gcalRequestToken(false)
        .then(() => {
          gcalStartAutoRefresh();
          render();
        })
        .catch(err => {
          console.error(err);
          render();
        });
    };
    
    if (action === 'gcal-refresh') el.onclick = async () => {
      el.disabled = true;
      el.textContent = '⏳ Lädt...';
      try {
        await gcalFetchEvents();
      } catch(e) {
        console.error(e);
      } finally {
        render();
      }
    };
    
    if (action === 'gcal-disconnect') el.onclick = () => {
      if (confirm('Google Calendar trennen? (Credentials bleiben gespeichert)')) {
        gcalDisconnect();
      }
    };
    
    if (action === 'vocab-delete') el.onclick = () => {
      const id = el.dataset.id;
      if (confirm('Diese Vokabel und ihre Lernhistorie wirklich löschen?')) {
        deleteVocabPair(id);
        saveLocal();
        render();
        scheduleSync();
      }
    };
    
    if (action === 'vocab-show-answer') el.onclick = () => {
      _vocabUI.reviewShown = true;
      render();
    };
    
    if (action === 'vocab-review') el.onclick = () => {
      // Guard against double-tap on mobile
      if (_vocabUI._reviewInProgress) return;
      _vocabUI._reviewInProgress = true;
      
      const dueCards = getDueCards();
      if (dueCards.length === 0) {
        _vocabUI._reviewInProgress = false;
        return;
      }
      const card = dueCards[_vocabUI.reviewIdx];
      if (!card) {
        _vocabUI._reviewInProgress = false;
        return;
      }
      
      const quality = parseInt(el.dataset.quality);
      if (isNaN(quality) || quality < 0 || quality > 5) {
        _vocabUI._reviewInProgress = false;
        return;
      }
      reviewCard(card.id, quality);
      
      // Move to next card
      _vocabUI.reviewShown = false;
      
      const newDueCards = getDueCards();
      if (newDueCards.length === 0) {
        _vocabUI.reviewIdx = 0;
      } else if (_vocabUI.reviewIdx >= newDueCards.length) {
        _vocabUI.reviewIdx = 0;
      }
      
      saveLocal();
      render();
      scheduleSync();
      
      // Release guard after render completes
      _vocabUI._reviewInProgress = false;
    };
    
    if (action === 'save-gh') el.onclick = async () => {
      state.github.token = document.getElementById('ghTokenInput').value.trim();
      state.github.gistId = document.getElementById('ghGistInput').value.trim();
      saveLocal();
      await ghVerify();
      render();
    };
    
    if (action === 'create-gist') el.onclick = async () => { await ghCreateGist(); render(); };
    if (action === 'sync-now') el.onclick = () => ghUpload();
    if (action === 'download-now') el.onclick = async () => {
      const data = await ghDownload();
      if (data) {
        state.weeks = data.weeks || {};
        state.goals = data.goals || {};
        if (data.northStar !== undefined) state.northStar = data.northStar;
        if (data.theme !== undefined) { state.theme = data.theme; applyTheme(); }
        if (data.customHabits !== undefined) state.customHabits = data.customHabits;
        if (data.languageSlot !== undefined) state.languageSlot = data.languageSlot;
        if (data.vocab !== undefined) state.vocab = validateVocab(data.vocab);
        rebuildHabits();
        saveLocal(); render();
      }
    };
    
    if (action === 'export-json') el.onclick = () => {
      const blob = new Blob([JSON.stringify({ weeks: state.weeks, goals: state.goals, northStar: state.northStar, theme: state.theme, customHabits: state.customHabits, languageSlot: state.languageSlot }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'lifetracker-' + fmtDate(new Date()) + '.json'; a.click();
      URL.revokeObjectURL(url);
    };
    
    if (action === 'import-json') el.onclick = () => {
      const input = document.getElementById('importFile');
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (confirm('Bestehende Daten überschreiben?')) {
              state.weeks = data.weeks || {};
              state.goals = data.goals || {};
              if (data.northStar !== undefined) state.northStar = data.northStar;
        if (data.theme !== undefined) { state.theme = data.theme; applyTheme(); }
        if (data.customHabits !== undefined) state.customHabits = data.customHabits;
        if (data.languageSlot !== undefined) state.languageSlot = data.languageSlot;
        if (data.vocab !== undefined) state.vocab = validateVocab(data.vocab);
        rebuildHabits();
              saveLocal(); render();
            }
          } catch(err) { alert('Fehler: ' + err.message); }
        };
        reader.readAsText(file);
      };
      input.click();
    };
    
    if (action === 'clear-all') el.onclick = () => {
      if (confirm('Wirklich alle Daten löschen?')) {
        if (confirm('Sicher? Nicht rückgängig.')) {
          state.weeks = {}; state.goals = {};
          state.github = { token: '', gistId: '', lastSync: null, autoSync: true };
          saveLocal(); render();
        }
      }
    };
  });
}

// =============================================
// INIT
// =============================================
loadLocal();
applyTheme();
render();

if (state.github.token && state.github.gistId) {
  setSync('ok', 'Auto-Sync aktiv');
  setTimeout(async () => {
    const data = await ghDownload();
    if (data && data.savedAt) {
      const cloudTime = new Date(data.savedAt).getTime();
      const localTime = state.github.lastSync ? new Date(state.github.lastSync).getTime() : 0;
      if (cloudTime > localTime + 5000) {
        state.weeks = Object.assign({}, state.weeks, data.weeks);
        state.goals = Object.assign({}, state.goals, data.goals);
        if (data.northStar !== undefined) state.northStar = data.northStar;
        if (data.theme !== undefined) { state.theme = data.theme; applyTheme(); }
        if (data.customHabits !== undefined) state.customHabits = data.customHabits;
        if (data.languageSlot !== undefined) state.languageSlot = data.languageSlot;
        if (data.vocab !== undefined) state.vocab = validateVocab(data.vocab);
        rebuildHabits();
        saveLocal(); render();
        setSync('ok', 'Geräte synced');
      }
    }
  }, 500);
} else {
  setSync('idle', 'Lokal');
}

// Start Google Calendar auto-refresh if previously connected
// gcal init happens in gapiLoaded/gisLoaded callbacks via tryAutoConnectGcal()
// Once connected, start the periodic refresh
const _gcalStartTimer = setInterval(() => {
  if (state.gcal.connected) {
    gcalStartAutoRefresh();
    clearInterval(_gcalStartTimer);
  }
}, 2000);
// Stop polling after 30s if never connected
setTimeout(() => clearInterval(_gcalStartTimer), 30000);

// Re-render the floating widget every minute to update "in X Min" countdown
setInterval(() => {
  if (state.gcal.connected) {
    const gcalEl = document.getElementById('gcalWidget');
    if (gcalEl) gcalEl.innerHTML = renderGcalWidget();
  }
}, 60000);
</script>
</body>
</html>
