// Ensure default programs are loaded into state if missing
function ensureSportPrograms() {
  if (!state.sport) {
    state.sport = {
      programs: {},
      activeProgram: 'ppl_beginner',
      activeDay: 'push',
      sessions: {},
      currentSession: null,
      stopwatch: { running: false, startMs: 0, elapsedMs: 0 },
      deletedDefaults: [],  // IDs of default programs the user explicitly deleted
    };
  }
  if (!state.sport.programs) state.sport.programs = {};
  if (!state.sport.deletedDefaults) state.sport.deletedDefaults = [];
  // Inject defaults if not customized AND not explicitly deleted by user
  Object.keys(DEFAULT_SPORT_PROGRAMS).forEach(id => {
    if (!state.sport.programs[id] && state.sport.deletedDefaults.indexOf(id) < 0) {
      // Deep clone default to allow editing
      state.sport.programs[id] = JSON.parse(JSON.stringify(DEFAULT_SPORT_PROGRAMS[id]));
    }
  });
  if (!state.sport.sessions) state.sport.sessions = {};
  if (!state.sport.stopwatch) state.sport.stopwatch = { running: false, startMs: 0, elapsedMs: 0 };
  
  // Validate activeProgram + activeDay
  if (!state.sport.programs[state.sport.activeProgram]) {
    // Pick first available program; if none, force re-inject all defaults
    const remaining = Object.keys(state.sport.programs);
    if (remaining.length > 0) {
      state.sport.activeProgram = remaining[0];
    } else {
      // No programs left at all → ignore deletedDefaults, re-inject
      state.sport.deletedDefaults = [];
      Object.keys(DEFAULT_SPORT_PROGRAMS).forEach(id => {
        state.sport.programs[id] = JSON.parse(JSON.stringify(DEFAULT_SPORT_PROGRAMS[id]));
      });
      state.sport.activeProgram = 'ppl_beginner';
    }
  }
  const prog = state.sport.programs[state.sport.activeProgram];
  if (prog && !prog.days[state.sport.activeDay]) {
    state.sport.activeDay = Object.keys(prog.days)[0];
  }
}

// =============================================
// STOPWATCH - persistent, survives reloads
// =============================================
let _stopwatchTimer = null;

function stopwatchStart() {
  const sw = state.sport.stopwatch;
  if (sw.running) return;
  sw.running = true;
  // startMs = now - already-elapsed (continues from pause)
  sw.startMs = Date.now() - (sw.elapsedMs || 0);
  saveLocal();
  stopwatchStartTicking();
}

function stopwatchPause() {
  const sw = state.sport.stopwatch;
  if (!sw.running) return;
  sw.elapsedMs = Date.now() - sw.startMs;
  sw.running = false;
  saveLocal();
  stopwatchStopTicking();
  updateStopwatchDisplay();
}

function stopwatchReset() {
  const sw = state.sport.stopwatch;
  sw.running = false;
  sw.startMs = 0;
  sw.elapsedMs = 0;
  saveLocal();
  stopwatchStopTicking();
  updateStopwatchDisplay();
}

function stopwatchGetMs() {
  const sw = state.sport.stopwatch;
  if (sw.running) {
    const elapsed = Date.now() - sw.startMs;
    // Defend against system clock changes (NTP, manual time-travel, DST)
    // If elapsed is negative, reset to last known good elapsedMs
    return elapsed >= 0 ? elapsed : (sw.elapsedMs || 0);
  }
  return sw.elapsedMs || 0;
}

function formatStopwatch(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const cs = Math.floor((ms % 1000) / 10); // centiseconds
  if (h > 0) {
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + '.' + String(cs).padStart(2,'0');
}

function updateStopwatchDisplay() {
  const el = document.getElementById('stopwatchDisplay');
  if (el) {
    el.textContent = formatStopwatch(stopwatchGetMs());
  }
}

function stopwatchStartTicking() {
  if (_stopwatchTimer) return;
  _stopwatchTimer = setInterval(updateStopwatchDisplay, 100); // 10 FPS, smooth enough
}

function stopwatchStopTicking() {
  if (_stopwatchTimer) {
    clearInterval(_stopwatchTimer);
    _stopwatchTimer = null;
  }
}

// SESSION MANAGEMENT
// =============================================
function sportStartSession() {
  const prog = state.sport.programs[state.sport.activeProgram];
  if (!prog) return null;
  const day = prog.days[state.sport.activeDay];
  if (!day) return null;
  
  // Find previous best (max weight) for each exercise as starting suggestion
  const previousWeights = sportGetLastWeights(day.exercises.map(e => e.name));
  
  const session = {
    id: 'sess_' + (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '_' + Math.random())),
    date: todayDateStr(),
    program: state.sport.activeProgram,
    programName: prog.name,
    day: state.sport.activeDay,
    dayName: day.name,
    startedAt: new Date().toISOString(),
    endedAt: null,
    durationSec: 0,
    exercises: day.exercises.map(ex => ({
      name: ex.name,
      targetSets: ex.sets,
      targetReps: ex.reps,
      rest: ex.rest,
      note: ex.note || '',
      sets: Array.from({ length: ex.sets }, () => ({
        reps: '',
        weight: previousWeights[ex.name] || '',
        done: false,
      })),
    })),
    notes: '',
  };
  state.sport.currentSession = session;
  saveLocal();
  return session;
}

// Look up the most recent weight used per exercise name
function sportGetLastWeights(exerciseNames) {
  const result = {};
  const sessions = Object.values(state.sport.sessions || {});
  sessions.sort((a, b) => (b.startedAt || '').localeCompare(a.startedAt || ''));
  exerciseNames.forEach(name => {
    for (const sess of sessions) {
      const ex = sess.exercises.find(e => e.name === name);
      if (ex) {
        // Find heaviest weight that was actually completed
        const weights = ex.sets.filter(s => s.done && s.weight).map(s => parseFloat(s.weight)).filter(w => !isNaN(w));
        if (weights.length > 0) {
          result[name] = Math.max(...weights);
          break;
        }
      }
    }
  });
  return result;
}

function sportEndSession() {
  const sess = state.sport.currentSession;
  if (!sess) return;
  sess.endedAt = new Date().toISOString();
  // Use stopwatch elapsed as session duration if running, else compute from timestamps
  const stopwatchMs = stopwatchGetMs();
  if (stopwatchMs > 0) {
    sess.durationSec = Math.round(stopwatchMs / 1000);
  } else {
    sess.durationSec = Math.round((new Date(sess.endedAt) - new Date(sess.startedAt)) / 1000);
  }
  state.sport.sessions[sess.id] = sess;
  
  // Auto-check matching Wochen-Tab habit ONLY if at least one set was completed.
  // - Cardio program → cardio habit
  // - All other programs (PPL, GVT, custom strength) → strength habit
  const completedSets = sess.exercises.reduce((sum, ex) => sum + ex.sets.filter(s => s.done).length, 0);
  if (completedSets > 0) {
    sportAutoCheckHabit(sess);
  }
  
  state.sport.currentSession = null;
  stopwatchReset();
  saveLocal();
}

// Auto-tick the corresponding habit in Wochen-Tab for the session's date.
// Returns the habit id that was checked (or null).
function sportAutoCheckHabit(sess) {
  if (!sess || !sess.date) return null;
  const habitId = (sess.program === 'cardio') ? 'cardio' : 'strength';
  
  // Locate the week and day index
  const [y, m, d] = sess.date.split('-').map(Number);
  const sessionDate = new Date(y, m-1, d);
  sessionDate.setHours(0, 0, 0, 0);
  const wk = weekKey(startOfWeek(sessionDate));
  if (!state.weeks[wk]) state.weeks[wk] = { type: 'A', days: {}, weekNote: '' };
  const wd = state.weeks[wk];
  if (!wd.days) wd.days = {};
  
  // Day index 0=Monday, 6=Sunday (matches startOfWeek)
  const weekStart = startOfWeek(sessionDate);
  const dayIdx = Math.round((sessionDate.getTime() - weekStart.getTime()) / (24 * 3600 * 1000));
  if (dayIdx < 0 || dayIdx > 6) return null;
  
  if (!wd.days[dayIdx]) wd.days[dayIdx] = {};
  wd.days[dayIdx][habitId] = true;
  
  return habitId;
}

function sportDiscardSession() {
  state.sport.currentSession = null;
  stopwatchReset();
  saveLocal();
}

// Personal Records: max weight × reps per exercise
function sportGetPRs() {
  const prs = {}; // {exerciseName: {weight, reps, date, sessionId}}
  Object.values(state.sport.sessions || {}).forEach(sess => {
    sess.exercises.forEach(ex => {
      ex.sets.forEach(set => {
        if (!set.done) return;
        const weight = parseFloat(set.weight);
        const reps = parseInt(set.reps);
        if (isNaN(weight) || isNaN(reps) || weight <= 0 || reps <= 0) return;
        const existing = prs[ex.name];
        // Score: estimated 1RM via Epley formula (w * (1 + reps/30))
        const score = weight * (1 + reps / 30);
        const existingScore = existing ? existing.weight * (1 + existing.reps / 30) : 0;
        if (!existing || score > existingScore) {
          prs[ex.name] = { weight, reps, date: sess.date, sessionId: sess.id };
        }
      });
    });
  });
  return prs;
}

// Show a brief, non-blocking confirmation toast at the bottom of the screen
function sportShowToast(message) {
  // Remove existing toast first
  const existing = document.getElementById('sportToast');
  if (existing) existing.remove();
  
  const toast = document.createElement('div');
  toast.id = 'sportToast';
  toast.className = 'sport-toast';
  toast.textContent = message;
  document.body.appendChild(toast);
  
  // Auto-fade and remove
  setTimeout(() => {
    toast.classList.add('hide');
    setTimeout(() => { if (toast.parentNode) toast.remove(); }, 300);
  }, 2500);
}

// Get the YYYY-MM key for a date
function monthKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

// Get amount entered for a category in a given month (returns 0 if not set)
function financeGetAmount(monthKeyStr, categoryId) {
  if (!state.finance.months[monthKeyStr]) return 0;
  const v = state.finance.months[monthKeyStr][categoryId];
  return (typeof v === 'number' && isFinite(v) && v >= 0) ? v : 0;
}

// Set amount for category in month (writes 0 too, deletes if 0)
function financeSetAmount(monthKeyStr, categoryId, amount, options) {
  if (!state.finance.months[monthKeyStr]) state.finance.months[monthKeyStr] = {};
  const numAmount = parseFloat(amount);
  // Empty, invalid, or zero → delete the entry (keep map clean, prevents zeros in charts)
  // Also reject excessively large numbers (likely typo) — max 10M per category per month
  const MAX_AMOUNT = 10000000;  // 10 million
  if (isNaN(numAmount) || !isFinite(numAmount) || numAmount <= 0) {
    delete state.finance.months[monthKeyStr][categoryId];
  } else if (numAmount > MAX_AMOUNT) {
    // Cap at max instead of rejecting — preserves user intent for legitimate large amounts
    state.finance.months[monthKeyStr][categoryId] = MAX_AMOUNT;
  } else {
    state.finance.months[monthKeyStr][categoryId] = Math.round(numAmount * 100) / 100;
  }
  // Cleanup: remove month entry if no categories
  if (Object.keys(state.finance.months[monthKeyStr]).length === 0) {
    delete state.finance.months[monthKeyStr];
  }
  // Debounced save during typing, instant save on blur/commit
  if (options && options.debounced) {
    saveLocalDebounced();
  } else {
    saveLocal();
  }
}

// Aggregate income/expense totals for a month
function financeMonthTotals(monthKeyStr) {
  const monthData = state.finance.months[monthKeyStr] || {};
  let totalIncome = 0;
  let totalExpense = 0;
  Object.keys(monthData).forEach(catId => {
    const amount = monthData[catId];
    if (typeof amount !== 'number' || !isFinite(amount)) return;
    if (state.finance.categories.income[catId]) totalIncome += amount;
    else if (state.finance.categories.expense[catId]) totalExpense += amount;
  });
  const savings = totalIncome - totalExpense;
  const savingsRate = totalIncome > 0 ? (savings / totalIncome) * 100 : 0;
  return { income: totalIncome, expense: totalExpense, savings, savingsRate };
}

// Get last N months (sorted oldest → newest) where any entry exists,
// padded with empty months from earliest entry up to current month
function financeGetMonthRange(numMonths) {
  const today = new Date();
  const result = [];
  for (let i = numMonths - 1; i >= 0; i--) {
    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
    result.push(monthKey(d));
  }
  return result;
}

// Format currency
function fmtMoney(amount, currency) {
  currency = currency || (state.finance && state.finance.settings && state.finance.settings.currency) || 'CHF';
  if (typeof amount !== 'number' || !isFinite(amount)) return '–';
  const sign = amount < 0 ? '-' : '';
  const abs = Math.abs(amount);
  // Use thousands separators (Swiss style: apostrophes), 0 or 2 decimals
  const hasDecimals = (abs % 1) !== 0;
  const formatted = abs.toLocaleString('de-CH', {
    minimumFractionDigits: hasDecimals ? 2 : 0,
    maximumFractionDigits: 2,
  });
  return sign + formatted + ' ' + currency;
}

// Generate month name in German
const MONTH_NAMES_DE_FULL = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function fmtMonthLabel(monthKeyStr) {
  const [y, m] = monthKeyStr.split('-').map(Number);
  return MONTH_NAMES_DE_FULL[m - 1] + ' ' + y;
}
function fmtMonthShort(monthKeyStr) {
  const [y, m] = monthKeyStr.split('-').map(Number);
  const short = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][m - 1];
  return short + ' ' + String(y).slice(2);
}

// Export all finance data as CSV (downloadable file)
function financeExportCSV() {
  const months = Object.keys(state.finance.months).sort();
  if (months.length === 0) {
    alert('Keine Finanzdaten zum Exportieren.');
    return;
  }
  const rows = [['Monat', 'Typ', 'Kategorie', 'Betrag', 'Waehrung']];
  months.forEach(mk => {
    const monthData = state.finance.months[mk] || {};
    Object.keys(monthData).forEach(catId => {
      const amount = monthData[catId];
      if (typeof amount !== 'number' || amount === 0) return;
      let type = '';
      let catName = catId;
      if (state.finance.categories.income[catId]) {
        type = 'Einnahme';
        catName = state.finance.categories.income[catId].name;
      } else if (state.finance.categories.expense[catId]) {
        type = 'Ausgabe';
        catName = state.finance.categories.expense[catId].name;
      } else {
        type = '(unbekannt)';
      }
      rows.push([mk, type, catName, String(amount), state.finance.settings.currency || 'CHF']);
    });
  });
  const csv = rows.map(r => r.map(cell => {
    const s = String(cell);
    return /[,;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'finance-' + fmtDate(new Date()) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// Validate finance data on load (defends against corrupted Gist)
function validateFinance(raw) {
  const result = {
    months: {},
    categories: { income: {}, expense: {} },
    settings: { currency: 'CHF', syncEnabled: true },
  };
  if (!raw || typeof raw !== 'object') return result;
  
  if (raw.months && typeof raw.months === 'object') {
    Object.keys(raw.months).forEach(mk => {
      if (!/^\d{4}-\d{2}$/.test(mk)) return;
      const m = raw.months[mk];
      if (!m || typeof m !== 'object') return;
      const cleanMonth = {};
      Object.keys(m).forEach(catId => {
        const cleanId = String(catId).slice(0, 50);
        const amount = parseFloat(m[catId]);
        if (!isNaN(amount) && isFinite(amount) && amount >= 0) {
          cleanMonth[cleanId] = Math.round(amount * 100) / 100;
        }
      });
      if (Object.keys(cleanMonth).length > 0) {
        result.months[mk] = cleanMonth;
      }
    });
  }
  
  ['income', 'expense'].forEach(type => {
    if (raw.categories && raw.categories[type] && typeof raw.categories[type] === 'object') {
      Object.keys(raw.categories[type]).forEach(catId => {
        const c = raw.categories[type][catId];
        if (!c || typeof c !== 'object') return;
        const cleanId = String(catId).slice(0, 50);
        result.categories[type][cleanId] = {
          id: cleanId,
          name: String(c.name || cleanId).slice(0, 50),
          icon: String(c.icon || '📁').slice(0, 4),
          color: String(c.color || '#64748b').slice(0, 20),
        };
      });
    }
  });
  
  if (raw.settings && typeof raw.settings === 'object') {
    if (typeof raw.settings.currency === 'string') {
      result.settings.currency = raw.settings.currency.slice(0, 5);
    }
    if (typeof raw.settings.syncEnabled === 'boolean') {
      result.settings.syncEnabled = raw.settings.syncEnabled;
    }
  }
  
  return result;
}

  html += '</div>';
  if (isExcessive) {
    html += '<div style="margin-top:10px;font-size:11px;color:#ea580c;">⚠ Läuft seit über 4 Stunden — Pause vergessen?</div>';
  }
  html += '</div>';
  
  // === ACTIVE SESSION BANNER ===
  const currentSess = state.sport.currentSession;
  if (currentSess) {
    html += '<div class="sport-session-banner">';
    html += '<span>🔥 Aktive Session:</span>';
    html += '<span>' + escapeHtml(currentSess.programName) + ' · ' + escapeHtml(currentSess.dayName) + '</span>';
    html += '</div>';
  }
  
  // === PROGRAM + DAY SELECTOR (hidden during active session to avoid confusion) ===
  if (!currentSess) {
    html += '<div class="card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">';
    html += '<h2 style="font-size:14px;margin:0;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">Programm</h2>';
    html += '<button class="btn" data-action="sport-new-program" style="padding:4px 10px;font-size:11px;">+ Neues Programm</button>';
    html += '</div>';
    html += '<div class="sport-program-selector">';
    Object.values(state.sport.programs).forEach(prog => {
      const active = prog.id === state.sport.activeProgram;
      html += '<button class="sport-prog-pill' + (active ? ' active' : '') + '" data-action="sport-select-program" data-prog="' + escapeHtml(prog.id) + '">' + escapeHtml(prog.name) + '</button>';
    });
    html += '</div>';
    
    // === DAY SELECTOR ===
    const prog = state.sport.programs[state.sport.activeProgram];
    if (prog) {
      html += '<div class="sport-day-selector">';
      Object.values(prog.days).forEach(day => {
        const active = day.id === state.sport.activeDay;
        html += '<button class="sport-day-pill' + (active ? ' active' : '') + '" data-action="sport-select-day" data-day="' + escapeHtml(day.id) + '">' + escapeHtml(day.name) + '</button>';
      });
      // Add-day button (in edit mode only)
      if (_sportUI.editMode) {
        html += '<button class="sport-day-pill" data-action="sport-add-day" style="border-style:dashed;color:var(--accent);">+ Tag</button>';
      }
      html += '</div>';
      
      if (prog.description) {
        html += '<div style="font-size:11px;color:var(--text-muted);font-style:italic;margin-bottom:8px;">' + escapeHtml(prog.description) + '</div>';
      }
      
      // Program-level edit actions (only show when in edit mode AND it's a custom program)
      if (_sportUI.editMode && !DEFAULT_SPORT_PROGRAMS[prog.id]) {
        html += '<div style="display:flex;gap:6px;margin-top:6px;">';
        html += '<button class="btn" data-action="sport-rename-program" style="padding:5px 12px;font-size:11px;">✏️ Programm umbenennen</button>';
        html += '<button class="btn danger" data-action="sport-delete-program" style="padding:5px 12px;font-size:11px;">🗑 Programm löschen</button>';
        html += '</div>';
      }
    }
    html += '</div>';
  }
  
  const prog = state.sport.programs[state.sport.activeProgram];
  
  // === ACTIVE SESSION or DAY-TEMPLATE ===
  if (currentSess) {
    html += renderSportSession(currentSess);
  } else if (prog && prog.days[state.sport.activeDay]) {
    html += renderSportDayTemplate(prog.days[state.sport.activeDay]);
  }
  
  // === HISTORY ===
  html += renderSportHistory();
  
  // === PERSONAL RECORDS ===
  html += renderSportPRs();
  
  return html;
}

function renderSportDayTemplate(day) {
  let html = '<div class="card">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap;">';
  html += '<h2 style="font-size:15px;margin:0;">' + escapeHtml(day.name) + '</h2>';
  if (_sportUI.editMode) {
    html += '<div style="display:flex;gap:4px;flex-wrap:wrap;">';
    html += '<button class="btn" data-action="sport-rename-day" style="padding:5px 10px;font-size:11px;">✏️ Tag</button>';
    const prog = state.sport.programs[state.sport.activeProgram];
    const canDelete = prog && Object.keys(prog.days).length > 1;
    if (canDelete) {
      html += '<button class="btn danger" data-action="sport-delete-day" style="padding:5px 10px;font-size:11px;">🗑 Tag</button>';
    }
    html += '<button class="btn" data-action="sport-toggle-edit">✓ Fertig</button>';
    html += '</div>';
  } else if (day.exercises && day.exercises.length > 0) {
    html += '<button class="btn primary" data-action="sport-start-session">🏁 Session starten</button>';
  }
  html += '</div>';
  
  // Edit-mode banner
  if (_sportUI.editMode) {
    html += '<div style="background:rgba(234,88,12,0.08);border:1px solid rgba(234,88,12,0.25);color:#c2410c;padding:8px 12px;border-radius:8px;font-size:11px;margin-bottom:12px;">';
    html += '✏️ <strong>Editier-Modus</strong> · Übungen hinzufügen, bearbeiten, löschen oder verschieben.';
    html += '</div>';
  }
  
  // Empty state
  if (!day.exercises || day.exercises.length === 0) {
    if (_sportUI.editingExerciseIdx !== -1) {
      html += '<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">';
      html += 'Keine Übungen in diesem Tag.';

        html += '<br><span style="font-size:11px;">Klick "Programm bearbeiten" um Übungen hinzuzufügen.</span>';
      }
      html += '</div>';
    }

      // Inline-edit form for this exercise
      html += renderSportExerciseForm(ex, idx);
    } else {
      html += '<div class="sport-exercise-card">';
      html += '<div class="sport-exercise-header">';
      html += '<div class="sport-exercise-name">' + (idx+1) + '. ' + escapeHtml(ex.name) + '</div>';
      html += '<div class="sport-exercise-target">' + ex.sets + '×' + escapeHtml(String(ex.reps)) + (ex.rest ? ' · ' + escapeHtml(ex.rest) : '') + '</div>';
      html += '</div>';
      if (ex.note) {
        html += '<div class="sport-exercise-note">' + escapeHtml(ex.note) + '</div>';
      }
      
      if (_sportUI.editMode) {
        html += '<div class="sport-exercise-actions">';
        if (idx > 0) {
          html += '<button class="sport-ex-icon-btn" data-action="sport-move-exercise" data-idx="' + idx + '" data-delta="-1" title="Hoch">↑</button>';
        }
        if (idx < day.exercises.length - 1) {
          html += '<button class="sport-ex-icon-btn" data-action="sport-move-exercise" data-idx="' + idx + '" data-delta="1" title="Runter">↓</button>';
        }
        html += '<button class="sport-ex-icon-btn" data-action="sport-edit-exercise" data-idx="' + idx + '" title="Bearbeiten">✏️</button>';
        html += '<button class="sport-ex-icon-btn danger" data-action="sport-delete-exercise" data-idx="' + idx + '" title="Löschen">🗑</button>';
        html += '</div>';
      }
      html += '</div>';
    }
  });
  }
  
  // Add-new form (only in edit mode, when -1)
  if (_sportUI.editMode && _sportUI.editingExerciseIdx === -1) {
    html += renderSportExerciseForm(null, -1);
  }
  
  // Bottom actions
  html += '<div class="sport-actions">';
  if (_sportUI.editMode) {
    if (_sportUI.editingExerciseIdx === null) {
      html += '<button class="btn primary" data-action="sport-add-exercise-start">+ Übung hinzufügen</button>';
      // Only show reset for default programs
      if (DEFAULT_SPORT_PROGRAMS[state.sport.activeProgram]) {
        html += '<button class="btn" data-action="sport-reset-program">⟲ Reset auf Default</button>';
      }
    }
  } else {
    html += '<button class="btn" data-action="sport-toggle-edit">✏️ Programm bearbeiten</button>';
  }
  html += '</div>';
  html += '</div>';
  return html;
}

function renderSportSession(sess) {
  let html = '<div class="card">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">';
  html += '<h2 style="font-size:15px;margin:0;">' + escapeHtml(sess.dayName) + ' · läuft</h2>';
  const startTime = sess.startedAt ? new Date(sess.startedAt).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}) : '';
  html += '<span style="font-size:11px;color:var(--text-muted);">seit ' + startTime + '</span>';
  html += '</div>';
  
  sess.exercises.forEach((ex, exIdx) => {
    html += '<div class="sport-exercise-card">';
    html += '<div class="sport-exercise-header">';
    html += '<div class="sport-exercise-name">' + (exIdx+1) + '. ' + escapeHtml(ex.name) + '</div>';
    html += '<div class="sport-exercise-target">Ziel: ' + ex.targetSets + '×' + escapeHtml(String(ex.targetReps)) + '</div>';
    html += '</div>';
    if (ex.note) html += '<div class="sport-exercise-note">' + escapeHtml(ex.note) + '</div>';
    
    html += '<div class="sport-sets-row">';
    ex.sets.forEach((set, setIdx) => {
      const doneClass = set.done ? ' done' : '';
      // Detect if exercise is "Cardio-style" (reps unit is text like "Dauer", "Min", "Sek", "km")
      // For these, switch from number inputs to text inputs and relabel
      const repsLower = String(ex.targetReps || '').toLowerCase();
      const isCardio = /dauer|min|sek|km|m\b/.test(repsLower) || /[a-zA-Z]/.test(String(ex.targetReps || ''));
      const repsType = isCardio ? 'text' : 'number';
      const weightType = isCardio ? 'text' : 'number';
      // Cardio: reps field shows duration label, weight field shows distance label
      const repsPlaceholder = isCardio ? 'Zeit' : 'reps';
      const weightPlaceholder = isCardio ? 'Distanz' : 'kg';
      const repsInputMode = isCardio ? 'text' : 'numeric';
      const weightInputMode = isCardio ? 'text' : 'decimal';
      const sep = isCardio ? '·' : '×';
      
      html += '<div class="sport-set-chip' + doneClass + '" data-action="sport-toggle-set" data-ex="' + exIdx + '" data-set="' + setIdx + '">';
      html += '<span class="sport-set-chip-num">' + (setIdx+1) + '</span>';
      html += '<input type="' + repsType + '" inputmode="' + repsInputMode + '" placeholder="' + escapeHtml(repsPlaceholder) + '" value="' + escapeHtml(String(set.reps || '')) + '" data-field="reps" data-ex="' + exIdx + '" data-set="' + setIdx + '" data-action="sport-edit-set" onclick="event.stopPropagation()" />';
      html += '<span class="x">' + sep + '</span>';
      html += '<input type="' + weightType + '" inputmode="' + weightInputMode + '" ' + (isCardio ? '' : 'step="0.5"') + ' placeholder="' + weightPlaceholder + '" value="' + escapeHtml(String(set.weight || '')) + '" data-field="weight" data-ex="' + exIdx + '" data-set="' + setIdx + '" data-action="sport-edit-set" onclick="event.stopPropagation()" />';
      html += '</div>';
    });
    html += '</div>';
    html += '</div>';
  });
  
  // Session note
  html += '<div style="margin-top:14px;">';
  html += '<label style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;">Notiz</label>';
  html += '<textarea id="sportSessionNote" rows="2" style="width:100%;margin-top:6px;padding:8px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg);color:var(--text);font-family:inherit;font-size:12px;resize:vertical;" placeholder="Wie war die Session?" data-action="sport-update-note">' + escapeHtml(sess.notes || '') + '</textarea>';
  html += '</div>';
  
  html += '<div class="sport-actions">';
  html += '<button class="btn primary" data-action="sport-end-session">🏁 Session beenden</button>';
  html += '<button class="btn danger" data-action="sport-discard-session">✗ Verwerfen</button>';
  html += '</div>';
  html += '</div>';
  return html;
}

function renderSportHistory() {
  const sessions = Object.values(state.sport.sessions || {});
  if (sessions.length === 0) return '';
  
  // Sort newest first
  sessions.sort((a, b) => (b.startedAt || '').localeCompare(a.startedAt || ''));
  
  let html = '<div class="card">';
  html += '<h2 style="font-size:14px;margin:0 0 10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">Letzte Sessions</h2>';
  
  // Aggregate this week's cardio distance
  const todayStr = fmtDate(TODAY);
  const weekStart = startOfWeek(TODAY);
  const weekStartStr = fmtDate(weekStart);
  let thisWeekCardioKm = 0;
  let thisWeekCardioCount = 0;
  sessions.forEach(sess => {
    if (sess.program !== 'cardio') return;
    if (!sess.date || sess.date < weekStartStr || sess.date > todayStr) return;
    thisWeekCardioCount++;
    sess.exercises.forEach(ex => {
      ex.sets.forEach(s => {
        if (!s.done) return;
        // Parse km from weight or reps field
        const wMatch = String(s.weight || '').match(/(\d+(?:[.,]\d+)?)\s*km/i);
        if (wMatch) thisWeekCardioKm += parseFloat(wMatch[1].replace(',', '.'));
      });
    });
  });
  if (thisWeekCardioCount > 0) {
    html += '<div style="background:rgba(22,163,74,0.08);border:1px solid rgba(22,163,74,0.2);color:#16a34a;padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:10px;">';
    html += '🏃 Diese Woche: ' + thisWeekCardioCount + ' Cardio-Session' + (thisWeekCardioCount === 1 ? '' : 's');
    if (thisWeekCardioKm > 0) html += ' · ' + thisWeekCardioKm.toFixed(1) + ' km gesamt';
    html += '</div>';
  }
  
  sessions.slice(0, 10).forEach(sess => {
    const isCardio = sess.program === 'cardio';
    const totalSets = sess.exercises.reduce((sum, ex) => sum + ex.sets.filter(s => s.done).length, 0);
    const totalVolume = sess.exercises.reduce((sum, ex) => {
      return sum + ex.sets.filter(s => s.done).reduce((vs, s) => {
        const r = parseInt(s.reps), w = parseFloat(s.weight);
        return vs + (isNaN(r) || isNaN(w) ? 0 : r * w);
      }, 0);
    }, 0);
    const durMin = Math.round((sess.durationSec || 0) / 60);
    
    // For cardio sessions: try to extract distance/duration from the notes-like fields
    let cardioInfo = '';
    if (isCardio) {
      const set0 = sess.exercises[0] && sess.exercises[0].sets[0];
      if (set0 && set0.done) {
        const reps = String(set0.reps || '').trim();
        const weight = String(set0.weight || '').trim();
        if (reps) cardioInfo += reps;
        if (weight) cardioInfo += (cardioInfo ? ' · ' : '') + weight;
      }
    }
    
    html += '<div class="sport-history-item">';
    html += '<div class="sport-history-date">' + escapeHtml(sess.date) + ' · ' + escapeHtml(sess.dayName) + '</div>';
    html += '<div class="sport-history-meta">';
    html += escapeHtml(sess.programName);
    if (!isCardio) {
      html += ' · ' + totalSets + ' Sets';
      if (totalVolume > 0) html += ' · ' + Math.round(totalVolume) + ' kg total';
    } else if (cardioInfo) {
      html += ' · ' + escapeHtml(cardioInfo);
    }
    if (durMin > 0) html += ' · ' + durMin + ' Min';
    html += '</div>';
    if (sess.notes) html += '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;font-style:italic;">' + escapeHtml(sess.notes) + '</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderSportPRs() {
  const prs = sportGetPRs();
  const entries = Object.entries(prs);
  if (entries.length === 0) return '';
  
  // Sort by estimated 1RM descending
  entries.sort((a, b) => {
    const sa = a[1].weight * (1 + a[1].reps / 30);
    const sb = b[1].weight * (1 + b[1].reps / 30);
    return sb - sa;
  });
  
  let html = '<div class="card">';
  html += '<h2 style="font-size:14px;margin:0 0 10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">🏆 Persönliche Bestleistungen</h2>';
  entries.forEach(([name, pr]) => {
    html += '<div class="sport-pr-item">';
    html += '<span class="sport-pr-name">' + escapeHtml(name) + '</span>';
    html += '<span class="sport-pr-value">' + pr.weight + ' kg × ' + pr.reps + '</span>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// FINANCE TAB RENDERING

let _finUI = {
  viewMonth: null,
  chartTab: 'donut',
  barRange: 12,  // months to show in bar chart
};

function renderFinance() {
  ensureFinanceDefaults();
  let html = '';
  
  if (!_finUI.viewMonth) _finUI.viewMonth = currentMonthKey();
  
  // === MONTH NAVIGATION ===
  html += '<div class="card">';
  html += '<div class="fin-month-header">';
  html += '<button class="fin-month-nav-btn" data-action="fin-prev-month">‹</button>';
  html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;">';
  html += '<span class="fin-month-title">' + escapeHtml(fmtMonthLabel(_finUI.viewMonth)) + '</span>';
  if (_finUI.viewMonth !== currentMonthKey()) {
    html += '<button class="btn" data-action="fin-this-month" style="font-size:11px;padding:4px 10px;">Heute</button>';
  }
  html += '</div>';
  html += '<button class="fin-month-nav-btn" data-action="fin-next-month">›</button>';
  html += '</div>';
  
  // === KPI ROW ===
  const totals = financeMonthTotals(_finUI.viewMonth);
  const [vy, vm] = _finUI.viewMonth.split('-').map(Number);
  const prevDate = new Date(vy, vm - 2, 1);
  const prevTotals = financeMonthTotals(monthKey(prevDate));
  const incomeDelta = totals.income - prevTotals.income;
  const expenseDelta = totals.expense - prevTotals.expense;
  
  html += '<div class="fin-kpi-grid">';
  html += '<div class="fin-kpi">';
  html += '<div class="fin-kpi-label">Einnahmen</div>';
  html += '<div class="fin-kpi-value positive">' + fmtMoney(totals.income) + '</div>';
  if (prevTotals.income > 0 && incomeDelta !== 0) {
    const pct = Math.abs(Math.round((incomeDelta / prevTotals.income) * 100));
    html += '<div class="fin-kpi-sub"><span class="fin-kpi-trend ' + (incomeDelta > 0 ? 'up' : 'down') + '">' + (incomeDelta > 0 ? '▲' : '▼') + ' ' + pct + '%</span> vs Vormonat</div>';
  }
  html += '</div>';
  
  html += '<div class="fin-kpi">';
  html += '<div class="fin-kpi-label">Ausgaben</div>';
  html += '<div class="fin-kpi-value negative">' + fmtMoney(totals.expense) + '</div>';
  if (prevTotals.expense > 0 && expenseDelta !== 0) {
    const pct = Math.abs(Math.round((expenseDelta / prevTotals.expense) * 100));
    const trendClass = expenseDelta > 0 ? 'down' : 'up';
    html += '<div class="fin-kpi-sub"><span class="fin-kpi-trend ' + trendClass + '">' + (expenseDelta > 0 ? '▲' : '▼') + ' ' + pct + '%</span> vs Vormonat</div>';
  }
  html += '</div>';
  
  html += '<div class="fin-kpi">';
  html += '<div class="fin-kpi-label">Saldo (Ersparnis)</div>';
  html += '<div class="fin-kpi-value ' + (totals.savings >= 0 ? 'positive' : 'negative') + '">' + fmtMoney(totals.savings) + '</div>';
  html += '<div class="fin-kpi-sub">Einnahmen − Ausgaben</div>';
  html += '</div>';
  
  html += '<div class="fin-kpi">';
  html += '<div class="fin-kpi-label">Sparquote</div>';
  if (totals.income > 0) {
    const rate = Math.round(totals.savingsRate);
    const rateClass = rate >= 20 ? 'positive' : (rate < 0 ? 'negative' : '');
    html += '<div class="fin-kpi-value ' + rateClass + '">' + rate + '%</div>';
    let msg = '';
    if (rate >= 30) msg = 'Exzellent';
    else if (rate >= 20) msg = 'Solid';
    else if (rate >= 10) msg = 'OK';
    else if (rate >= 0) msg = 'Knapp';
    else msg = 'Defizit';
    html += '<div class="fin-kpi-sub">' + msg + '</div>';
  } else {
    html += '<div class="fin-kpi-value">–</div>';
    html += '<div class="fin-kpi-sub">Keine Einnahmen erfasst</div>';
  }
  html += '</div>';
  html += '</div>';
  html += '</div>';

  html += '<div class="fin-cat-amount-wrap">';
  html += '<input type="number" inputmode="decimal" step="1" min="0" class="fin-cat-input" placeholder="0" value="' + (amount > 0 ? amount : '') + '" data-action="fin-set-amount" data-month="' + escapeHtml(monthKeyStr) + '" data-cat="' + escapeHtml(cat.id) + '" data-type="' + escapeHtml(type) + '" />';

function renderFinanceDonut(monthKeyStr) {
  const monthData = state.finance.months[monthKeyStr] || {};
  const expenseCats = state.finance.categories.expense;
  const items = [];
  Object.keys(monthData).forEach(catId => {
    const cat = expenseCats[catId];
    if (!cat) return;
    const amount = monthData[catId];
    if (typeof amount === 'number' && amount > 0) {
      items.push({ ...cat, amount });
    }
  });
  
  if (items.length === 0) {
    return '<div class="fin-empty"><div class="fin-empty-icon">🪙</div>Noch keine Ausgaben für ' + escapeHtml(fmtMonthLabel(monthKeyStr)) + ' erfasst.<br>Trage Beträge unten ein.</div>';
  }
  
  items.sort((a, b) => b.amount - a.amount);
  const total = items.reduce((s, i) => s + i.amount, 0);
  
  const cx = 90, cy = 90, r = 75, ir = 50;
  let cumAngle = -Math.PI / 2;
  
  let svg = '<svg class="fin-donut-svg" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">';
  
  if (items.length === 1) {
    // Single segment: full donut ring
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + escapeHtml(items[0].color || '#64748b') + '"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ir + '" fill="var(--card-bg)"/>';
  } else {
    items.forEach(item => {
      const pct = item.amount / total;
      const angle = pct * Math.PI * 2;
      const a1 = cumAngle;
      const a2 = cumAngle + angle;
      cumAngle = a2;
      
      const x1o = cx + r * Math.cos(a1), y1o = cy + r * Math.sin(a1);
      const x2o = cx + r * Math.cos(a2), y2o = cy + r * Math.sin(a2);
      const x1i = cx + ir * Math.cos(a2), y1i = cy + ir * Math.sin(a2);
      const x2i = cx + ir * Math.cos(a1), y2i = cy + ir * Math.sin(a1);
      
      const largeArc = angle > Math.PI ? 1 : 0;
      const path = 'M ' + x1o + ' ' + y1o + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x2o + ' ' + y2o + ' L ' + x1i + ' ' + y1i + ' A ' + ir + ' ' + ir + ' 0 ' + largeArc + ' 0 ' + x2i + ' ' + y2i + ' Z';
      
      svg += '<path d="' + path + '" fill="' + escapeHtml(item.color || '#64748b') + '"/>';
    });
  }
  
  svg += '<text x="' + cx + '" y="' + (cy - 4) + '" class="fin-donut-center" style="font-size:11px;opacity:0.6;">Total</text>';
  svg += '<text x="' + cx + '" y="' + (cy + 14) + '" class="fin-donut-center" style="font-size:13px;font-weight:700;">' + escapeHtml(fmtMoney(total)) + '</text>';
  svg += '</svg>';
  
  let legend = '<div class="fin-donut-legend">';
  items.forEach(item => {
    const pct = (item.amount / total * 100).toFixed(1);
    legend += '<div class="fin-donut-legend-row">';
    legend += '<div class="fin-donut-legend-color" style="background:' + escapeHtml(item.color || '#64748b') + ';"></div>';
    legend += '<div class="fin-donut-legend-name">' + escapeHtml(item.icon || '') + ' ' + escapeHtml(item.name) + '</div>';
    legend += '<div class="fin-donut-legend-pct">' + pct + '%</div>';
    legend += '</div>';
  });
  legend += '</div>';
  
  return '<div class="fin-donut-wrap">' + svg + legend + '</div>';
}

function renderFinanceBars() {
  const range = _finUI.barRange || 12;
  const months = financeGetMonthRange(range);
  const data = months.map(mk => {
    const t = financeMonthTotals(mk);
    return { month: mk, income: t.income, expense: t.expense };
  });
  
  const maxVal = Math.max(1, ...data.map(d => Math.max(d.income, d.expense)));
  const hasAnyData = data.some(d => d.income > 0 || d.expense > 0);
  
  // Range pills
  let html = '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">';
  [6, 12, 24, 60].forEach(r => {
    const active = r === range;
    html += '<button class="fin-range-pill' + (active ? ' active' : '') + '" data-action="fin-set-bar-range" data-range="' + r + '">' + r + ' Mo</button>';
  });
  html += '</div>';
  
  if (!hasAnyData) {
    return html + '<div class="fin-empty"><div class="fin-empty-icon">📊</div>Noch keine Daten — trage Beträge in die Kategorien unten ein.</div>';
  }
  
  html += '<div class="fin-bar-chart">';
  data.forEach(d => {
    const incHeight = (d.income / maxVal) * 100;
    const expHeight = (d.expense / maxVal) * 100;
    html += '<div class="fin-bar-col">';
    html += '<div class="fin-bar-stack">';
    if (d.income > 0) {
      html += '<div class="fin-bar-income" style="height:' + incHeight + '%;" title="' + escapeHtml(fmtMoney(d.income)) + '"></div>';
    }
    if (d.expense > 0) {
      html += '<div class="fin-bar-expense" style="height:' + expHeight + '%;" title="' + escapeHtml(fmtMoney(d.expense)) + '"></div>';
    }
    html += '</div>';
    html += '<div class="fin-bar-label">' + escapeHtml(fmtMonthShort(d.month)) + '</div>';
    html += '</div>';
  });
  html += '</div>';
  
  html += '<div class="fin-bar-legend">';
  html += '<span><span class="fin-bar-legend-dot" style="background:#16a34a;"></span>Einnahmen</span>';
  html += '<span><span class="fin-bar-legend-dot" style="background:#dc2626;"></span>Ausgaben</span>';
  html += '</div>';
  
  return html;
}

function renderFinanceLine() {
  const range = _finUI.barRange || 12;
  const months = financeGetMonthRange(range);
  const data = months.map(mk => {
    const t = financeMonthTotals(mk);
    return { month: mk, rate: t.income > 0 ? t.savingsRate : null };
  });
  
  // Range pills (share state with bar chart)
  let pillsHtml = '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">';
  [6, 12, 24, 60].forEach(r => {
    const active = r === range;
    pillsHtml += '<button class="fin-range-pill' + (active ? ' active' : '') + '" data-action="fin-set-bar-range" data-range="' + r + '">' + r + ' Mo</button>';
  });
  pillsHtml += '</div>';
  
  const valid = data.filter(d => d.rate !== null);
  if (valid.length < 1) {
    return pillsHtml + '<div class="fin-empty"><div class="fin-empty-icon">📈</div>Mindestens ein Monat mit Einnahmen wird benötigt.</div>';
  }
  
  const allRates = valid.map(d => d.rate);
  const minRate = Math.min(0, Math.min.apply(null, allRates));
  const maxRate = Math.max(50, Math.max.apply(null, allRates));
  const yRange = maxRate - minRate || 1;
  
  // viewBox = logical drawing surface. width 100% via CSS, height also fixed via CSS.
  // Key: NO preserveAspectRatio="none" → SVG preserves circle/text shape.
  // Use a wide viewBox so labels have room horizontally.
  const w = 600, h = 240, padL = 44, padR = 14, padT = 14, padB = 36;
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;
  const stepX = innerW / Math.max(1, data.length - 1);
  
  function yFor(rate) { return padT + innerH - ((rate - minRate) / yRange) * innerH; }
  function xFor(idx) { return padL + idx * stepX; }
  
  // preserveAspectRatio="xMidYMid meet" (default) keeps the aspect ratio
  // and centers the chart in the container — no distortion of circles/text.
  let svg = '<svg class="fin-line-chart" viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';
  
  const gridLines = [0, 25, 50];
  gridLines.forEach(g => {
    if (g >= minRate && g <= maxRate) {
      const y = yFor(g);
      svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" stroke="currentColor" stroke-width="0.5" opacity="0.15"/>';
      svg += '<text x="' + (padL - 6) + '" y="' + (y + 4) + '" font-size="11" fill="currentColor" opacity="0.5" text-anchor="end">' + g + '%</text>';
    }
  });
  
  if (minRate < 0) {
    const y0 = yFor(0);
    svg += '<line x1="' + padL + '" y1="' + y0 + '" x2="' + (w - padR) + '" y2="' + y0 + '" stroke="currentColor" stroke-width="1" opacity="0.3"/>';
  }
  
  let pathD = '';
  let pointsSvg = '';
  data.forEach(function(d, i) {
    if (d.rate === null) return;
    const x = xFor(i);
    const y = yFor(d.rate);
    pathD += (pathD === '' ? 'M ' : ' L ') + x + ' ' + y;
    const dotColor = d.rate >= 20 ? '#16a34a' : (d.rate >= 0 ? '#f59e0b' : '#dc2626');
    pointsSvg += '<circle cx="' + x + '" cy="' + y + '" r="4" fill="' + dotColor + '"/>';
  });
  svg += '<path d="' + pathD + '" fill="none" stroke="var(--accent)" stroke-width="2.5"/>';
  svg += pointsSvg;
  
  data.forEach(function(d, i) {
    const showLabel = (data.length <= 6) || (i % 2 === 0) || (i === data.length - 1);
    if (!showLabel) return;
    const x = xFor(i);
    svg += '<text x="' + x + '" y="' + (h - 10) + '" font-size="11" fill="currentColor" opacity="0.6" text-anchor="middle">' + escapeHtml(fmtMonthShort(d.month)) + '</text>';
  });
  
  svg += '</svg>';
  
  return pillsHtml + '<div class="fin-line-chart-wrap">' + svg + '<div style="text-align:center;font-size:11px;color:var(--text-muted);margin-top:4px;">Sparquote pro Monat (höher = besser)</div></div>';
}

function renderCalendar() {
  let html = '';
  
  // Not connected state
  if (!state.gcal.connected) {
    html += '<div class="card" style="text-align:center;padding:32px;">';
    html += '<div style="font-size:48px;margin-bottom:12px;">🗓</div>';
    html += '<div style="font-size:15px;font-weight:600;margin-bottom:8px;">Google Calendar nicht verbunden</div>';
    html += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">Verbinde deinen Kalender im Sync-Tab, um Termine hier zu sehen.</div>';
    html += '<button class="btn primary" data-action="goto-sync">Zum Sync-Tab</button>';
    html += '</div>';
    return html;
  }
  
  // === Today's events section (at top) ===
  const todayEvents = gcalGetTodayEvents();
  const now = new Date();
  
  html += '<div class="card">';
  html += '<h2 style="font-size:16px;margin:0 0 12px;">📌 Heute · ' + fmtDateGerman(TODAY) + '</h2>';
  
  if (todayEvents.length === 0) {
    html += '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">Keine Termine heute.</div>';
  } else {
    todayEvents.forEach(ev => {
      const isAllDay = ev.allDay;
      const evStart = isAllDay ? null : new Date(ev.start);
      const evEnd = isAllDay ? null : new Date(ev.end);
      const isPast = !isAllDay && evEnd < now;
      const isCurrent = !isAllDay && evStart <= now && now < evEnd;
      
      let classes = 'cal-event-item';
      if (isCurrent) classes += ' cal-event-current';
      if (isPast) classes += ' cal-event-past';
      
      html += '<div class="' + classes + '">';
      html += '<div class="cal-event-time">';
      if (isAllDay) html += 'Ganztag';
      else html += formatEventTime(ev.start, false);
      html += '</div>';
      html += '<div class="cal-event-body">';
      html += '<div class="cal-event-title">' + escapeHtml(ev.title) + '</div>';
      const meta = [];
      if (!isAllDay) meta.push('bis ' + formatEventTime(ev.end, false));
      if (ev.calendarName) meta.push(escapeHtml(ev.calendarName));
      if (ev.location) meta.push('📍 ' + escapeHtml(ev.location));
      if (meta.length) html += '<div class="cal-event-meta">' + meta.join(' · ') + '</div>';
      html += '</div>';
      html += '</div>';
    });
  }
  html += '</div>';
  
  // === Month view ===
  const grid = buildMonthGrid(_calUI.viewYear, _calUI.viewMonth);
  
  // Check if viewed month is outside fetch window
  const today = new Date();
  const viewedMonthStart = new Date(_calUI.viewYear, _calUI.viewMonth, 1);
  const viewedMonthEnd = new Date(_calUI.viewYear, _calUI.viewMonth + 1, 0);
  const fetchMin = new Date(today.getTime() - 7 * 24 * 3600 * 1000);
  const fetchMax = new Date(today.getTime() + 60 * 24 * 3600 * 1000);
  const isOutsideFetchRange = viewedMonthEnd < fetchMin || viewedMonthStart > fetchMax;
  
  html += '<div class="card">';
  html += '<div class="cal-month-header">';
  html += '<button class="cal-nav-btn" data-action="cal-prev-month" aria-label="Vorheriger Monat">‹</button>';
  html += '<div>';
  html += '<span class="cal-month-title">' + MONTH_NAMES_DE[_calUI.viewMonth] + ' ' + _calUI.viewYear + '</span>';
  // Show "Heute" button if not viewing current month
  if (_calUI.viewYear !== TODAY.getFullYear() || _calUI.viewMonth !== TODAY.getMonth()) {
    html += '<button class="cal-today-btn" data-action="cal-today">Heute</button>';
  }
  html += '</div>';
  html += '<button class="cal-nav-btn" data-action="cal-next-month" aria-label="Nächster Monat">›</button>';
  html += '</div>';
  
  if (isOutsideFetchRange) {
    html += '<div style="background:rgba(234,88,12,0.1);color:#c2410c;padding:8px 12px;border-radius:8px;font-size:11px;margin-bottom:10px;">';
    html += 'ℹ️ Termine außerhalb des aktuellen Fetch-Bereichs (heute ±2 Monate) werden nicht angezeigt.';
    html += '</div>';
  }
  
  // Weekday headers
  html += '<div class="cal-weekdays">';
  WEEKDAY_NAMES_DE.forEach(d => {
    html += '<div class="cal-weekday">' + d + '</div>';
  });
  html += '</div>';
  
  // Grid
  html += '<div class="cal-grid">';
  grid.forEach(cell => {
    let classes = 'cal-day';
    if (!cell.isCurrentMonth) classes += ' other-month';
    if (cell.isWeekend && cell.isCurrentMonth) classes += ' weekend';
    if (cell.isToday) classes += ' today';
    if (cell.events.length > 0) classes += ' has-events';
    if (cell.date === _calUI.selectedDate) classes += ' selected';
    
    html += '<div class="' + classes + '" data-action="cal-select-day" data-date="' + cell.date + '">';
    html += '<div class="cal-day-num">' + cell.day + '</div>';
    
    if (cell.events.length > 0) {
      // Show up to 3 colored dots
      const dotCount = Math.min(cell.events.length, 3);
      html += '<div class="cal-day-events-dots">';
      for (let i = 0; i < dotCount; i++) {
        const color = cell.events[i].calendarColor || 'var(--accent)';
        html += '<div class="cal-day-dot" style="background:' + escapeHtml(color) + ';"></div>';
      }
      html += '</div>';
      if (cell.events.length > 3) {
        html += '<div class="cal-day-count">+' + (cell.events.length - 3) + '</div>';
      }
    }
    html += '</div>';
  });
  html += '</div>';
  html += '</div>';
  
  // === Selected day details (if different from today) ===
  if (_calUI.selectedDate && _calUI.selectedDate !== fmtDate(TODAY)) {
    const selectedEvents = gcalGetEventsForDate(_calUI.selectedDate);
    const [sy, sm, sd] = _calUI.selectedDate.split('-').map(Number);
    const selectedDateObj = new Date(sy, sm - 1, sd);
    
    html += '<div class="card">';
    html += '<h2 style="font-size:16px;margin:0 0 12px;">' + fmtDateGerman(selectedDateObj) + '</h2>';
    
    if (selectedEvents.length === 0) {
      html += '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">Keine Termine an diesem Tag.</div>';
    } else {
      selectedEvents.forEach(ev => {
        const isAllDay = ev.allDay;
        html += '<div class="cal-event-item">';
        html += '<div class="cal-event-time">';
        if (isAllDay) html += 'Ganztag';
        else html += formatEventTime(ev.start, false);
        html += '</div>';
        html += '<div class="cal-event-body">';
        html += '<div class="cal-event-title">' + escapeHtml(ev.title) + '</div>';
        const meta = [];
        if (!isAllDay) meta.push('bis ' + formatEventTime(ev.end, false));
        if (ev.calendarName) meta.push(escapeHtml(ev.calendarName));
        if (ev.location) meta.push('📍 ' + escapeHtml(ev.location));
        if (meta.length) html += '<div class="cal-event-meta">' + meta.join(' · ') + '</div>';
        html += '</div>';
        html += '</div>';
      });
    }
    html += '</div>';
  }
  
  // Refresh button at bottom
  html += '<div style="text-align:center;margin-top:10px;">';
  html += '<button class="btn" data-action="gcal-refresh">🔄 Termine aktualisieren</button>';
  if (state.gcal.lastFetch) {
    const lf = new Date(state.gcal.lastFetch);
    html += '<div style="font-size:10px;color:var(--text-muted);margin-top:6px;">Letzter Abruf: ' + lf.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}) + '</div>';
  }
  html += '</div>';
  
  return html;
}

function fmtDateGerman(d) {
  const days = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  return days[d.getDay()] + ', ' + d.getDate() + '. ' + MONTH_NAMES_DE[d.getMonth()] + ' ' + d.getFullYear();
}

    let classes = 'cal-event-item';
    if (isCurrent) classes += ' cal-event-current';
    if (isPast) classes += ' cal-event-past';
    
    html += '<div class="' + classes + '" style="border-left-color:' + escapeHtml(ev.calendarColor || 'var(--accent)') + ';">';
    html += '<div class="cal-event-time">';
    if (isAllDay) html += 'Ganztag';
    else html += formatEventTime(ev.start, false);
    html += '</div>';
    html += '<div class="cal-event-body">';
    html += '<div class="cal-event-title">' + escapeHtml(ev.title) + '</div>';
    const meta = [];
    if (!isAllDay) meta.push('bis ' + formatEventTime(ev.end, false));
    if (ev.location) meta.push('📍 ' + escapeHtml(ev.location));
    if (meta.length) html += '<div class="cal-event-meta">' + meta.join(' · ') + '</div>';
    html += '</div>';
    html += '</div>';
  });
  
  html += '</div>';
  return html;
}

      const q = _vocabUI.searchQuery.toLowerCase().trim();
      listCards = listCards.filter(c => 
        (c.source || '').toLowerCase().includes(q) ||
        (c.target || '').toLowerCase().includes(q)
      );
    }
    // Sort: most recent first
    listCards.sort((a, b) => (b.created || '').localeCompare(a.created || ''));
    
    // Search input (always rendered if there are cards)
    if (cards.filter(c => c.dir === 'forward').length > 5) {

      }
      html += '</div>';
    } else {
      // Pagination: show first 50, then "more" button
      const showLimit = _vocabUI.listLimit || 50;
      const visible = listCards.slice(0, showLimit);
      visible.forEach(c => {
        const L = LANGUAGES[c.lang] || { flag: '?', short: '?' };

        html += '<div class="vocab-list-flag">' + L.flag + '</div>';
        html += '<div class="vocab-list-content">';
        html += '<div class="vocab-list-source">' + escapeHtml(c.source) + '</div>';
        html += '<div class="vocab-list-target">→ ' + escapeHtml(c.target) + '</div>';
        html += '<div class="vocab-list-meta">';
        html += '<span class="vocab-status-badge vocab-status-' + status + '">' + statusLabels[status] + '</span>';
        if (c.reps > 0 && c.due) {
          html += ' · nächste Wiederholung: ' + c.due;
        }
        html += '</div>';
        html += '</div>';
        html += '<button class="habit-row-btn danger" data-action="vocab-delete" data-id="' + c.id + '" aria-label="Löschen">🗑</button>';
        html += '</div>';
      });
      if (listCards.length > showLimit) {
        const remaining = listCards.length - showLimit;
        html += '<button class="btn full" data-action="vocab-show-more" style="margin-top:10px;">+ ' + Math.min(remaining, showLimit < 1000 ? showLimit : 1000) + ' weitere · noch ' + remaining + ' insgesamt</button>';

          html += '<div style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:6px;">💡 Tipp: Suche oben nutzen statt alle laden</div>';
        }
      }
    }
    html += '</div>';
  }
  
  return html;
}

function renderVocabReview(dueCards) {
  // Bound idx to available cards
  if (_vocabUI.reviewIdx >= dueCards.length) _vocabUI.reviewIdx = 0;
  
  const card = dueCards[_vocabUI.reviewIdx];
  const L = LANGUAGES[card.lang] || { flag: '?', label: '?' };
  
  // Determine question/answer based on direction
  // forward: source (foreign) shown → answer is German target
  // backward: target (German) shown → answer is foreign source
  const isForward = card.dir === 'forward';
  const question = isForward ? card.source : card.target;
  const answer = isForward ? card.target : card.source;
  const dirLabel = isForward ? L.label + ' → Deutsch' : 'Deutsch → ' + L.label;
  
  // Compute next intervals for buttons (preview)
  const previews = {
    again: sm2(card, 1),
    hard: sm2(card, 3),
    good: sm2(card, 4),
    easy: sm2(card, 5),
  };
  
  function formatInterval(days) {
    if (days < 1) return '<1d';
    if (days === 1) return '1 Tag';
    if (days < 60) return days + 'd';
    if (days < 365) {
      const mo = Math.round(days / 30);
      return mo + (mo === 1 ? ' Monat' : ' Monate');
    }
    const y = (days / 365);
    return (y >= 10 ? Math.round(y) : y.toFixed(1)) + 'y';
  }
  
  let html = '<div class="vocab-review-card">';
  const cardStatus = getCardStatus(card);
  const statusLabelsRev = { new: 'Neu', learning: 'Lernen', review: 'Festigen', mature: 'Bekannt' };
  html += '<div class="vocab-review-progress">Wiederholung ' + (_vocabUI.reviewIdx + 1) + ' / ' + dueCards.length + '</div>';
  html += '<div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">';
  html += '<span class="vocab-review-lang">' + L.flag + ' ' + dirLabel + '</span>';
  html += '<span class="vocab-status-badge vocab-status-' + cardStatus + '">' + statusLabelsRev[cardStatus] + '</span>';
  html += '</div>';
  
  html += '<div class="vocab-review-question">' + escapeHtml(question) + '</div>';
  
  if (_vocabUI.reviewShown) {
    html += '<div class="vocab-review-answer">' + escapeHtml(answer) + '</div>';
    html += '<div class="vocab-review-buttons">';
    html += '<button class="vocab-review-btn again" data-action="vocab-review" data-quality="1">';
    html += '<span class="btn-label">❌ Nochmal</span>';
    html += '<span class="btn-next">' + formatInterval(previews.again.interval) + '</span>';
    html += '</button>';
    html += '<button class="vocab-review-btn hard" data-action="vocab-review" data-quality="3">';
    html += '<span class="btn-label">⚠️ Schwer</span>';
    html += '<span class="btn-next">' + formatInterval(previews.hard.interval) + '</span>';
    html += '</button>';
    html += '<button class="vocab-review-btn good" data-action="vocab-review" data-quality="4">';
    html += '<span class="btn-label">✅ Gut</span>';
    html += '<span class="btn-next">' + formatInterval(previews.good.interval) + '</span>';
    html += '</button>';
    html += '<button class="vocab-review-btn easy" data-action="vocab-review" data-quality="5">';
    html += '<span class="btn-label">⚡ Easy</span>';
    html += '<span class="btn-next">' + formatInterval(previews.easy.interval) + '</span>';
    html += '</button>';
    html += '</div>';
  } else {
    html += '<button class="vocab-review-show-btn" data-action="vocab-show-answer">Antwort zeigen</button>';
  }
  
  html += '</div>';
  return html;
}

  };
  
  const list = allSuggestions[quarter] || [];
  return list.filter(s => !existingTitles.some(t => t.includes(s.title.toLowerCase().slice(0, 15))));
}

function renderSync() {
  const g = state.github;
  const lastSync = g.lastSync ? new Date(g.lastSync).toLocaleString('de-CH') : 'Noch nie';
  const isConnected = !!g.token;
  const hasGist = !!g.gistId;
  
  // Calculate current storage usage
  let storageBytes = 0;
  let compressionRatio = 1;
  try {
    const uncomp = localStorage.getItem(LS_KEY) || '';
    const comp = localStorage.getItem(LS_KEY_COMPRESSED) || '';
    storageBytes = uncomp.length + (comp.length * 2); // UTF-16: 2 bytes/char
    if (comp.length > 0) {
      // Estimate ratio by comparing payload size to compressed size
      const cardCount = Object.keys(state.vocab && state.vocab.cards || {}).length;
      const estimatedRaw = (cardCount * 180) + (Object.keys(state.sport && state.sport.sessions || {}).length * 2000);
      if (estimatedRaw > 0) compressionRatio = estimatedRaw / (comp.length * 2);
    }
  } catch(e) {}
  
  const storageKB = (storageBytes / 1024).toFixed(0);
  const storageMB = (storageBytes / 1024 / 1024).toFixed(2);
  const limitMB = 5;  // conservative estimate
  const pctOfLimit = Math.min(100, (storageBytes / (limitMB * 1024 * 1024)) * 100);
  const valueColor = pctOfLimit > 80 ? '#dc2626' : (pctOfLimit > 50 ? '#f59e0b' : '#16a34a');
  
  let html = '';
  
  // Storage usage card
  html += '<div class="card">';

function getOrCreateWeek(wk) {
  if (!state.weeks[wk]) state.weeks[wk] = { type: 'A', days: {}, weekNote: '' };
  return state.weeks[wk];
}

function attachEvents() {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.onclick = () => {
      const newTab = b.dataset.tab;
      // Reset transient UI state on tab change
      state._editingHabit = null;
      if (state.activeTab !== newTab) {
        _vocabUI.reviewShown = false;
        _vocabUI.reviewIdx = 0;
        // Clear pending search debounce timer
        if (_vocabUI._searchTimer) {
          clearTimeout(_vocabUI._searchTimer);
          _vocabUI._searchTimer = null;
        }
        // Stop stopwatch ticking when leaving sport tab (state continues)
        if (state.activeTab === 'sport' && newTab !== 'sport') {
          // Check for unsaved edit-form data
          if (_sportUI.editingExerciseIdx !== null) {
            const nameEl = document.getElementById('exEditName');
            const hasInput = nameEl && nameEl.value.trim().length > 0;
            // Only warn if user entered something AND it's a new exercise (idx === -1)
            // For existing edits, just close form silently — original data is unchanged
            if (hasInput && _sportUI.editingExerciseIdx === -1) {
              if (!confirm('Ungespeicherte Übung wird verworfen. Trotzdem wechseln?')) {
                // Revert the tab click: don't change activeTab, just re-render
                return;
              }
            }
          }
          stopwatchStopTicking();
          // Reset edit mode so user doesn't return to a stale half-edited form
          _sportUI.editMode = false;
          _sportUI.editingExerciseIdx = null;
        }
      }
      state.activeTab = newTab;
      render();
      // Resume ticking if entering sport tab with running stopwatch
      if (newTab === 'sport' && state.sport && state.sport.stopwatch && state.sport.stopwatch.running) {
        stopwatchStartTicking();
      }
    };
  });
  
  document.querySelectorAll('[data-action]').forEach(el => {
    const action = el.dataset.action;
    
    if (action === 'set-theme') el.onclick = () => {
      state.theme = el.dataset.theme;
      applyTheme();
      saveLocal();
      render();
      scheduleSync();
    };

      const source = sourceEl.value.trim().slice(0, 200);
      const target = targetEl.value.trim().slice(0, 200);
      if (!source || !target) {
        alert('Wort und Übersetzung müssen ausgefüllt sein.');
        return;
      }
      let result = addVocabPair(_vocabUI.activeLang, source, target);
      if (!result.added && result.reason === 'duplicate') {
        const existingTarget = result.existing ? result.existing.target : '';
        const proceed = confirm(
          'Dieses Wort gibt es schon:\n\n' +
          '"' + source + '" → "' + existingTarget + '"\n\n' +
          'Trotzdem als neue Karte hinzufügen?'
        );
        if (!proceed) {
          sourceEl.focus();
          sourceEl.select();
          return;
        }
        // Force re-add bypassing duplicate check
        result = addVocabPair(_vocabUI.activeLang, source, target, true);

      const keyEl = document.getElementById('gcalApiKeyInput');
      if (!idEl || !keyEl) return;
      const clientId = idEl.value.trim();
      const apiKey = keyEl.value.trim();
      if (!clientId || !apiKey) {
        alert('Beide Felder müssen ausgefüllt sein.');
        return;
      }
      if (!clientId.includes('.apps.googleusercontent.com')) {
        if (!confirm('Client ID sieht ungewöhnlich aus (sollte mit .apps.googleusercontent.com enden). Trotzdem speichern?')) return;
      }
      state.gcal.clientId = clientId;
      state.gcal.apiKey = apiKey;
      saveLocal();
      
      // Initialize and trigger connect
      if (gcalIsReady()) {
        try { gapi.client.setApiKey(apiKey); } catch(e) { console.error(e); }
        gcalInitTokenClient();
        // Trigger consent popup
        gcalRequestToken(false)
          .then(() => {
            gcalStartAutoRefresh();
            render();
          })
          .catch(err => {
            alert('Verbindung fehlgeschlagen. Prüfe ob die Domain in der Google Cloud Console als "Authorized JavaScript origin" eingetragen ist.');
            console.error(err);
            render();
          });
      } else {
        alert('Google API noch nicht geladen. Versuche es in einer Sekunde nochmal.');
      }

      sportStartSession();

      // Ignore clicks on the inputs inside

      const exIdx = parseInt(el.dataset.ex);
      const setIdx = parseInt(el.dataset.set);
      const sess = state.sport.currentSession;
      if (!sess) return;
      const ex = sess.exercises[exIdx];
      const set = ex.sets[setIdx];
      set.done = !set.done;
      
      // When marking done: auto-fill reps from target if user hasn't entered one yet
      // (helpful for beginners who don't know they need to fill the chip first)
      if (set.done && (!set.reps || String(set.reps).trim() === '')) {
        const target = String(ex.targetReps || '').trim();
        // Only auto-fill if target is a single number (not "8-12" or "Dauer")
        if (/^\d+$/.test(target)) {
          set.reps = target;
        } else if (/^\d+-\d+$/.test(target)) {
          // Range like "8-12" → take the lower value as starting point
          set.reps = target.split('-')[0];
        }
      }
      
      // Also: copy weight from previous done set in same exercise as a sensible default
      if (set.done && (!set.weight || String(set.weight).trim() === '')) {
        for (let i = setIdx - 1; i >= 0; i--) {
          if (ex.sets[i].done && ex.sets[i].weight) {
            set.weight = ex.sets[i].weight;
            break;
          }

      saveLocal();
      scheduleSync();
      render();

        const sess = state.sport.currentSession;
        if (!sess) return;
        const set = sess.exercises[exIdx].sets[setIdx];

        }
        if (ghUploadInProgress) {
          setSync('error', 'Upload hängt — bitte später nochmal versuchen');
          return;
        }
      }
      // Also: warn user that download overwrites local state
      if (!confirm('Aus Gist herunterladen?\n\n⚠ Lokale Änderungen werden überschrieben, falls sie noch nicht hochgeladen wurden.\n\nFortfahren?')) return;
      const data = await ghDownload();
      if (data) {
        state.weeks = data.weeks || {};
        state.goals = data.goals || {};
        if (data.northStar !== undefined) state.northStar = data.northStar;
        if (data.theme !== undefined) { state.theme = data.theme; applyTheme(); }
        if (data.customHabits !== undefined) state.customHabits = data.customHabits;
        if (data.languageSlot !== undefined) state.languageSlot = data.languageSlot;
        if (data.vocab !== undefined) state.vocab = validateVocab(data.vocab);
        if (data.sport !== undefined) state.sport = validateSport(data.sport);
        if (data.finance !== undefined) state.finance = validateFinance(data.finance);
        if (data.gcal !== undefined && data.gcal) {
          if (data.gcal.clientId) state.gcal.clientId = String(data.gcal.clientId).slice(0, 200);
          if (data.gcal.apiKey) state.gcal.apiKey = String(data.gcal.apiKey).slice(0, 200);
        }
        rebuildHabits();
        saveLocal(); render();
      }
    };
    
    if (action === 'export-json') el.onclick = () => {
      const exportData = {
        weeks: state.weeks,
        goals: state.goals,
        northStar: state.northStar,
        theme: state.theme,
        customHabits: state.customHabits,
        languageSlot: state.languageSlot,
        vocab: state.vocab,
      sport: state.sport,
      finance: state.finance,
        gcal: {
          clientId: state.gcal.clientId,
          apiKey: state.gcal.apiKey,
        },
        exportedAt: new Date().toISOString(),
        version: 5,
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'lifetracker-' + fmtDate(new Date()) + '.json';
      a.click();
      URL.revokeObjectURL(url);
    };
    
    if (action === 'import-json') el.onclick = () => {
      const input = document.getElementById('importFile');
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (confirm('Bestehende Daten überschreiben?')) {
              state.weeks = data.weeks || {};
              state.goals = data.goals || {};
              if (data.northStar !== undefined) state.northStar = data.northStar;
        if (data.theme !== undefined) { state.theme = data.theme; applyTheme(); }
        if (data.customHabits !== undefined) state.customHabits = data.customHabits;
        if (data.languageSlot !== undefined) state.languageSlot = data.languageSlot;
        if (data.vocab !== undefined) state.vocab = validateVocab(data.vocab);
        if (data.sport !== undefined) state.sport = validateSport(data.sport);
        if (data.finance !== undefined) state.finance = validateFinance(data.finance);
        if (data.gcal !== undefined && data.gcal) {
          if (data.gcal.clientId) state.gcal.clientId = String(data.gcal.clientId).slice(0, 200);
          if (data.gcal.apiKey) state.gcal.apiKey = String(data.gcal.apiKey).slice(0, 200);
        }
        rebuildHabits();
              saveLocal(); render();
            }
          } catch(err) { alert('Fehler: ' + err.message); }
        };
        reader.readAsText(file);
      };
      input.click();
    };
    
    if (action === 'clear-all') el.onclick = () => {
      if (confirm('Wirklich ALLE Daten löschen?\n\n• Wochen-Habits\n• Ziele\n• Vokabeln\n• North Star\n• Custom Habits\n• Google Calendar Credentials\n• GitHub Sync Token')) {
        if (confirm('Sicher? Diese Aktion ist nicht rückgängig zu machen.')) {
          state.weeks = {};
          state.goals = {};
          state.github = { token: '', gistId: '', lastSync: null, autoSync: true };
          state.northStar = '';
          state.customHabits = [];
          state.languageSlot = null;
          state.vocab = { cards: {}, settings: { dailyLimit: 20, reviewLimit: 100, activeLanguages: ['en','es','ch','no'] } };
          state.gcal = { clientId: '', apiKey: '', connected: false, events: [], lastFetch: null };
          state.sport = { programs: {}, activeProgram: 'ppl_beginner', activeDay: 'push', sessions: {}, currentSession: null, stopwatch: { running: false, startMs: 0, elapsedMs: 0 } };
          state.finance = { months: {}, categories: { income: {}, expense: {} }, settings: { currency: 'CHF', syncEnabled: true } };
          if (gcalRefreshTimer) { clearInterval(gcalRefreshTimer); gcalRefreshTimer = null; }
          if (typeof stopwatchStopTicking === 'function') stopwatchStopTicking();
          try { localStorage.removeItem(LS_KEY); } catch(e) {}
          try { localStorage.removeItem(LS_KEY_COMPRESSED); } catch(e) {}
          try { localStorage.removeItem('lifeTracker_v3'); } catch(e) {}
          try { localStorage.removeItem('lifeTracker_v2'); } catch(e) {}
          saveLocal();
          render();
        }
      }
    };
  });
}

// =============================================
// INIT
// =============================================
loadLocal();
ensureSportPrograms();
ensureFinanceDefaults();
applyTheme();
render();

// Resume stopwatch ticking if it was running before reload
if (state.activeTab === 'sport' && state.sport && state.sport.stopwatch && state.sport.stopwatch.running) {
  stopwatchStartTicking();
}

// Detect if tabs overflow horizontally (show fade indicator)
function checkTabOverflow() {
  const wrap = document.getElementById('tabsWrap');
  const scroll = document.getElementById('tabsScroll');
  if (!wrap || !scroll) return;
  // Has overflow if scrollWidth > clientWidth AND not scrolled to end
  const hasOverflow = scroll.scrollWidth > scroll.clientWidth + 4 &&
    scroll.scrollLeft + scroll.clientWidth < scroll.scrollWidth - 4;
  wrap.classList.toggle('has-overflow', hasOverflow);
}
checkTabOverflow();
window.addEventListener('resize', checkTabOverflow);
const tabsScrollEl = document.getElementById('tabsScroll');
if (tabsScrollEl) tabsScrollEl.addEventListener('scroll', checkTabOverflow);

if (state.github.token && state.github.gistId) {
  setSync('ok', 'Auto-Sync aktiv');
  setTimeout(async () => {
    const data = await ghDownload();
    if (data && data.savedAt) {
      const cloudTime = new Date(data.savedAt).getTime();
      const localTime = state.github.lastSync ? new Date(state.github.lastSync).getTime() : 0;
      if (cloudTime > localTime + 5000) {
        state.weeks = Object.assign({}, state.weeks, data.weeks);
        state.goals = Object.assign({}, state.goals, data.goals);
        if (data.northStar !== undefined) state.northStar = data.northStar;
        if (data.theme !== undefined) { state.theme = data.theme; applyTheme(); }
        if (data.customHabits !== undefined) state.customHabits = data.customHabits;
        if (data.languageSlot !== undefined) state.languageSlot = data.languageSlot;
        if (data.vocab !== undefined) state.vocab = validateVocab(data.vocab);
        if (data.sport !== undefined) state.sport = validateSport(data.sport);
        if (data.finance !== undefined) state.finance = validateFinance(data.finance);
        if (data.gcal !== undefined && data.gcal) {
          if (data.gcal.clientId) state.gcal.clientId = String(data.gcal.clientId).slice(0, 200);
          if (data.gcal.apiKey) state.gcal.apiKey = String(data.gcal.apiKey).slice(0, 200);
        }
        rebuildHabits();
        saveLocal(); render();
        setSync('ok', 'Geräte synced');
      }
    }
  }, 500);
} else {
  setSync('idle', 'Lokal');
}

// Start Google Calendar auto-refresh if previously connected
// gcal init happens in gapiLoaded/gisLoaded callbacks via tryAutoConnectGcal()
// Once connected, start the periodic refresh
const _gcalStartTimer = setInterval(() => {
  if (state.gcal.connected) {
    gcalStartAutoRefresh();
    clearInterval(_gcalStartTimer);
  }
}, 2000);
// Stop polling after 30s if never connected
setTimeout(() => clearInterval(_gcalStartTimer), 30000);

// Re-render the floating widget every minute to update "in X Min" countdown
const _gcalWidgetTimer = setInterval(() => {
  if (state.gcal.connected) {
    const gcalEl = document.getElementById('gcalWidget');
    if (gcalEl) {
      gcalEl.innerHTML = renderGcalWidget();
      // Re-attach handlers for any links/buttons in widget
      attachEvents();
    }
  }
}, 60000);

// Periodic safety save: every 60s, flush any pending debounced save.
// Catches data loss when user leaves tab open and laptop sleeps without
// triggering visibilitychange or beforeunload properly.
const _heartbeatTimer = setInterval(() => {
  if (saveLocalTimer) {
    clearTimeout(saveLocalTimer);
    saveLocalTimer = null;
    try { saveLocal(); } catch(e) { console.error('Heartbeat save failed:', e); }
  }
}, 60 * 1000);

// Cleanup all intervals/timers on unload to avoid memory leak in long-running tabs
window.addEventListener('beforeunload', () => {
  try {
    clearInterval(_gcalStartTimer);
    clearInterval(_gcalWidgetTimer);
    clearInterval(_heartbeatTimer);
    if (typeof gcalRefreshTimer !== 'undefined' && gcalRefreshTimer) clearInterval(gcalRefreshTimer);
    if (typeof _stopwatchTimer !== 'undefined' && _stopwatchTimer) clearInterval(_stopwatchTimer);
    if (typeof saveLocalTimer !== 'undefined' && saveLocalTimer) clearTimeout(saveLocalTimer);
    if (typeof syncTimer !== 'undefined' && syncTimer) clearTimeout(syncTimer);
  } catch(e) {}
});
</script>
