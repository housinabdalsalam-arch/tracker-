      dictionary[dictSize++] = w + entry.charAt(0); enlargeIn--;
      w = entry;
      if (enlargeIn == 0) { enlargeIn = Math.pow(2, numBits); numBits++; }
    }
  }
  return {
    // UTF-16 safe compress to base64
    compressToBase64: function (input) {
      if (input == null) return "";
      const res = _compress(input, 6, function (a) { return keyStrUriSafe.charAt(a); });
      switch (res.length % 4) { default: case 0: return res; case 1: return res + "==="; case 2: return res + "=="; case 3: return res + "="; }
    },
    decompressFromBase64: function (input) {
      if (input == null) return "";
      if (input == "") return null;
      input = input.replace(/=+$/, '');
      return _decompress(input.length, 32, function (index) {
        return getBaseValue(keyStrUriSafe, input.charAt(index));
      });
    },
    // UTF-16 native (smaller, but only safe for localStorage, not URLs)
    compress: function (input) {
      if (input == null) return "";
      return _compress(input, 16, function (a) { return f(a); });
    },
    decompress: function (compressed) {
      if (compressed == null) return "";
      if (compressed == "") return null;
      return _decompress(compressed.length, 32768, function (index) { return compressed.charCodeAt(index); });
    },
  };
})();

function saveLocal() {
  // Strip transient indexes before serialization to prevent bloat
  // (_dupIndex contains pointers; JSON.stringify duplicates the full objects)
  let vocabToSave = state.vocab;
  if (vocabToSave && vocabToSave._dupIndex) {
    vocabToSave = Object.assign({}, vocabToSave);
    delete vocabToSave._dupIndex;
  }
  
  const payload = {
    weeks: state.weeks, goals: state.goals, github: state.github,
    northStar: state.northStar, theme: state.theme,
    customHabits: state.customHabits, languageSlot: state.languageSlot,
    vocab: vocabToSave,
    sport: state.sport,
    finance: state.finance,
    gcal: { 
      clientId: state.gcal.clientId, 
      apiKey: state.gcal.apiKey,
      connected: state.gcal.connected,
      lastFetch: state.gcal.lastFetch,
    },
  };
  const json = JSON.stringify(payload);
  
  // Skip compression for small datasets (<300 KB) — compression overhead not worth it
  const COMPRESSION_THRESHOLD = 300 * 1024;
  
  // Mark that our own storage event should be ignored by multi-tab listener
  if (typeof _ignoreNextStorageEvent !== 'undefined') {
    try { window._ignoreNextStorageEvent = true; } catch(e) {}
  }
  
  // Perf tracking: warn user if a save is taking too long
  const saveStart = Date.now();
  
  try {
    if (json.length < COMPRESSION_THRESHOLD) {
      // Fast path: uncompressed
      localStorage.setItem(LS_KEY, json);
      try { localStorage.removeItem(LS_KEY_COMPRESSED); } catch(e) {}
    } else {
      // Large data: compress
      const compressed = LZString.compress(json);
      if (compressed && compressed.length * 2 < json.length * 0.95) {
        localStorage.setItem(LS_KEY_COMPRESSED, compressed);
        try { localStorage.removeItem(LS_KEY); } catch(e) {}
      } else {
        localStorage.setItem(LS_KEY, json);
        try { localStorage.removeItem(LS_KEY_COMPRESSED); } catch(e) {}
      }
    }
    if (typeof _storageErrorShown !== 'undefined' && _storageErrorShown) {
      _storageErrorShown = false;
    }
    // Warn user about slow save (helps them notice when data is too big)
    const saveDuration = Date.now() - saveStart;
    if (saveDuration > 3000 && !window._slowSaveWarned) {
      window._slowSaveWarned = true;
      console.warn('Slow save: ' + saveDuration + 'ms.');
      // Visible non-blocking banner
      try {
        const banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(245,158,11,0.95);color:white;padding:8px 14px;border-radius:20px;font-size:11px;z-index:9999;max-width:90vw;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.2);';
        banner.textContent = '⏱ Speichern dauert ' + Math.round(saveDuration/1000) + 's · Tipp: alte Daten archivieren';
        document.body.appendChild(banner);
        setTimeout(() => { if (banner.parentNode) banner.remove(); }, 6000);
      } catch(e) {}
    }
  } catch(e) {
    if (e.name === 'QuotaExceededError' || e.code === 22) {
      // Try compression as last resort
      try {
        const compressed = LZString.compress(json);
        try { localStorage.removeItem(LS_KEY); } catch(e) {}
        localStorage.setItem(LS_KEY_COMPRESSED, compressed);
        return;
      } catch(e2) {
        console.error('Storage voll auch nach Compression.');
        if (!window._storageErrorShown) {
          window._storageErrorShown = true;
          alert('Lokaler Speicher ist voll!\n\nDeine Änderungen werden nicht mehr gespeichert.\n\nBitte:\n1. Exportiere deine Daten (Sync-Tab → Export JSON)\n2. Lösche alte Vokabeln/Sessions\n3. Oder nutze Cloud-Sync (GitHub)');
        }
      }
    } else {
      console.error('Save failed:', e);
    }
  }
}

// Debounced version for high-frequency input events
let saveLocalTimer = null;
function saveLocalDebounced() {
  clearTimeout(saveLocalTimer);
  saveLocalTimer = setTimeout(saveLocal, 500);
}

// Force-save pending changes when tab is about to close
if (typeof window !== 'undefined') {
  window.addEventListener('beforeunload', () => {
    if (saveLocalTimer) {
      clearTimeout(saveLocalTimer);
      saveLocal();
    }
  });
  // Also save when tab becomes hidden (iOS Safari closing)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && saveLocalTimer) {
      clearTimeout(saveLocalTimer);
      saveLocal();
    }
  });
  
  // Multi-tab sync: when another tab in same browser writes to localStorage,
  // reload our state. Throttled to avoid render storms when user edits rapidly.
  let _storageEventTimer = null;
  let _ignoreNextStorageEvent = false;
  window.addEventListener('storage', (e) => {
    if (e.key !== LS_KEY && e.key !== LS_KEY_COMPRESSED) return;
    if (_ignoreNextStorageEvent) {
      _ignoreNextStorageEvent = false;
      return;
    }
    // Don't react if we're currently typing in an input — would lose focus
    if (document.activeElement && 
        (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
      return;
    }
    clearTimeout(_storageEventTimer);
    _storageEventTimer = setTimeout(() => {
      try {
        loadLocal();
        render();
        // Brief visual indicator
        const banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(22,163,74,0.95);color:white;padding:6px 14px;border-radius:20px;font-size:11px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.15);';
        banner.textContent = '↻ Aktualisiert (anderer Tab)';
        document.body.appendChild(banner);
        setTimeout(() => { if (banner.parentNode) banner.remove(); }, 1500);
      } catch(err) {
        console.error('Cross-tab reload failed:', err);
      }
    }, 300);
  });
}

function loadLocal() {
  try {
    // Try compressed format first (newest)
    let raw = null;
    const compressedRaw = localStorage.getItem(LS_KEY_COMPRESSED);
    if (compressedRaw) {
      try {
        raw = LZString.decompress(compressedRaw);
        if (!raw || raw === '') raw = null;
      } catch(e) {
        console.error('Decompression failed, falling back to uncompressed:', e);
        raw = null;
      }
    }
    // Fall back to uncompressed (migration path or first install)
    if (!raw) raw = localStorage.getItem(LS_KEY);
    if (!raw) raw = localStorage.getItem('lifeTracker_v3');
    if (!raw) raw = localStorage.getItem('lifeTracker_v2');
    if (raw) {
      const d = JSON.parse(raw);
      state.weeks = d.weeks || {};
      state.northStar = d.northStar || '';
      state.theme = d.theme || 'auto';
      state.customHabits = d.customHabits || [];
      state.languageSlot = d.languageSlot || null;
      // Load vocab with validation
      if (d.vocab) {
        state.vocab = validateVocab(d.vocab);
      }
      // Load gcal (credentials + cached events)
      if (d.gcal && typeof d.gcal === 'object') {
        state.gcal.clientId = String(d.gcal.clientId || '').slice(0, 200);
        state.gcal.apiKey = String(d.gcal.apiKey || '').slice(0, 200);
        state.gcal.connected = !!d.gcal.connected;
        state.gcal.events = Array.isArray(d.gcal.events) ? d.gcal.events : [];
        state.gcal.lastFetch = d.gcal.lastFetch || null;
      }
      
      // Load sport (programs, sessions, current state, stopwatch) — validated
      if (d.sport !== undefined) {
        state.sport = validateSport(d.sport);
      }
      
      // Load finance (months, categories, settings) — validated
      if (d.finance !== undefined) {
        state.finance = validateFinance(d.finance);
      }
      
      // Migrate weekNote → reflection.output for backward compat
      Object.values(state.weeks).forEach(wd => {
        if (wd.weekNote && !wd.reflection) {
          wd.reflection = { output: wd.weekNote, energy: '', change: '' };
        }
        // Migrate habit ID: spanish → language
        if (wd.days) {
          Object.keys(wd.days).forEach(dayIdx => {
            const day = wd.days[dayIdx];
            if (day && day.spanish !== undefined) {
              day.language = day.spanish;
              delete day.spanish;
            }
          });
        }
      });
      
      // Migrate old goals format to new
      const rawGoals = d.goals || {};
      const newGoals = {};
      Object.keys(rawGoals).forEach(key => {
        const g = rawGoals[key];
        if (g.title) {
          newGoals[key] = g;
        } else if (g.text) {
          const parts = key.split('-');
          const quarter = parts.slice(0,2).join('-');
          const category = parts[2] || 'other';
          newGoals[key] = {
            quarter, category,
            title: g.text,
            done: g.done || false,
            createdAt: new Date().toISOString(),
          };
        }
      });
      state.goals = newGoals;
      state.github = Object.assign({}, state.github, d.github || {});
    }
  } catch(e) { console.error('Load failed', e); }
  rebuildHabits();
}

// =============================================
// GITHUB GIST SYNC
// =============================================
const GIST_FILENAME = 'lifetracker-data.json';
const GIST_FILENAME_VOCAB = 'lifetracker-vocab.json';
const GIST_FILENAME_SPORT = 'lifetracker-sport.json';

async function ghCall(path, options) {
  options = options || {};
  if (!state.github.token) throw new Error('Kein Token');
  const headers = {
    'Accept': 'application/vnd.github+json',
    'Authorization': 'Bearer ' + state.github.token,
    'X-GitHub-Api-Version': '2022-11-28',
  };
  if (options.headers) Object.assign(headers, options.headers);
  const fetchOpts = { method: options.method || 'GET', headers };
  if (options.body) fetchOpts.body = options.body;
  const res = await fetch('https://api.github.com' + path, fetchOpts);
  if (!res.ok) throw new Error('GitHub ' + res.status);
  return await res.json();
}

async function ghVerify() {
  setSync('warn', 'Prüfe...');
  try {
    const user = await ghCall('/user');
    setSync('ok', user.login);
    return user;
  } catch(e) {
    setSync('error', 'Token-Fehler');
    return null;
  }
}

async function ghCreateGist() {
  setSync('warn', 'Erstelle...');
  try {
    const content = JSON.stringify({
      weeks: state.weeks, goals: state.goals, northStar: state.northStar, theme: state.theme,
      customHabits: state.customHabits, languageSlot: state.languageSlot,
      gcal: { clientId: state.gcal.clientId, apiKey: state.gcal.apiKey },
      vocab: state.vocab,
      sport: state.sport,
      finance: state.finance,
      savedAt: new Date().toISOString(), version: 4,
    }, null, 2);
    const files = {};
    files[GIST_FILENAME] = { content };
    const gist = await ghCall('/gists', {
      method: 'POST',
      body: JSON.stringify({
        description: 'Life Tracker (private)',
        public: false, files,
      }),
    });
    state.github.gistId = gist.id;
    state.github.lastSync = new Date().toISOString();
    saveLocal();
    setSync('ok', 'Gist: ' + gist.id.slice(0, 8));
  } catch(e) { setSync('error', 'Fehler'); }
}

let ghUploadInProgress = false;
let ghUploadQueued = false;

async function ghUpload() {
  if (!state.github.token || !state.github.gistId) return;
  // Race-condition protection
  if (ghUploadInProgress) {
    ghUploadQueued = true;
    return;
  }
  ghUploadInProgress = true;
  setSync('warn', 'Sync...');
  try {
    // Strip transient indexes
    let vocabClean = state.vocab;
    if (vocabClean && vocabClean._dupIndex) {
      vocabClean = Object.assign({}, vocabClean);
      delete vocabClean._dupIndex;
    }
    
    // === Multi-file strategy: if total raw is >600KB, split vocab/sport into own files ===
    // Each file under 1MB limit thanks to LZ compression
    const fullPayload = {
      weeks: state.weeks, goals: state.goals, northStar: state.northStar, theme: state.theme,
      customHabits: state.customHabits, languageSlot: state.languageSlot,
      gcal: { clientId: state.gcal.clientId, apiKey: state.gcal.apiKey },
      vocab: vocabClean,
      sport: state.sport,
      finance: state.finance,
      lastBackup: state.lastBackup,
      savedAt: new Date().toISOString(), version: 6,
    };
    const fullJson = JSON.stringify(fullPayload);
    
    const files = {};
    const SPLIT_THRESHOLD = 600 * 1024;
    let totalContentSize = 0;
    let splitMode = false;
    
    function compressPayload(obj) {
      const j = JSON.stringify(obj);
      if (j.length > 500 * 1024) {
        const c = LZString.compressToBase64(j);
        return { content: JSON.stringify({ _format: 'lz-base64', _version: 6, payload: c }), compressed: true };
      }
      return { content: j, compressed: false };
    }
    
    if (fullJson.length > SPLIT_THRESHOLD) {
      // Split mode: vocab + sport into own files, rest in main
      splitMode = true;
      const mainPayload = Object.assign({}, fullPayload);
      mainPayload.vocab = undefined;
      mainPayload.sport = undefined;
      mainPayload._splitFiles = ['vocab', 'sport'];
      
      // === Vocab: if vocab alone is >600KB raw, split per language ===
      // Each language file should stay under 1MB Gist limit even at 10k words.
      let vocabSplitByLang = false;
      if (vocabClean) {
        const vocabJson = JSON.stringify(vocabClean);
        const VOCAB_LANG_SPLIT_THRESHOLD = 600 * 1024;
        
        if (vocabJson.length > VOCAB_LANG_SPLIT_THRESHOLD) {
          // Split vocab into per-language files
          vocabSplitByLang = true;
          // Settings file: contains everything except per-lang cards
          const vocabSettings = {
            settings: vocabClean.settings || {},
            _langSplit: true,
            _langs: [],
          };
          // Group cards by language
          const cardsByLang = {};
          Object.keys(vocabClean.cards || {}).forEach(cardId => {
            const c = vocabClean.cards[cardId];
            const lang = (c && c.lang) ? c.lang : 'unknown';
            if (!cardsByLang[lang]) cardsByLang[lang] = {};
            cardsByLang[lang][cardId] = c;
          });
          // Write one file per language
          Object.keys(cardsByLang).forEach(lang => {
            const langPayload = { cards: cardsByLang[lang] };
            const langCompressed = compressPayload(langPayload);
            const fname = 'lifetracker-vocab-' + lang + '.json';
            files[fname] = { content: langCompressed.content };
            totalContentSize += langCompressed.content.length;
            vocabSettings._langs.push(lang);
          });
          // Main vocab file just has settings + lang list
          const vocabSettingsCompressed = compressPayload(vocabSettings);
          files[GIST_FILENAME_VOCAB] = { content: vocabSettingsCompressed.content };
          totalContentSize += vocabSettingsCompressed.content.length;
        } else {
          // Single vocab file is fine
          const vocabCompressed = compressPayload(vocabClean);
          files[GIST_FILENAME_VOCAB] = { content: vocabCompressed.content };
          totalContentSize += vocabCompressed.content.length;
        }
      }
      
      const mainCompressed = compressPayload(mainPayload);
      files[GIST_FILENAME] = { content: mainCompressed.content };
      totalContentSize += mainCompressed.content.length;
      
      if (state.sport) {
        const sportCompressed = compressPayload(state.sport);
        files[GIST_FILENAME_SPORT] = { content: sportCompressed.content };
        totalContentSize += sportCompressed.content.length;
      }
      
      // Clean up any stale per-lang files if no longer needed
      if (!vocabSplitByLang) {
        ['en','es','ch','no','de','fr','it','pt','ru','zh','ja','ar'].forEach(lang => {
          files['lifetracker-vocab-' + lang + '.json'] = null;
        });
      }
    } else {
      // Single-file mode
      const compressed = compressPayload(fullPayload);
      files[GIST_FILENAME] = { content: compressed.content };
      totalContentSize += compressed.content.length;
      // Also clean up split-files if they exist from previous large state
      files[GIST_FILENAME_VOCAB] = null;  // null deletes the file
      files[GIST_FILENAME_SPORT] = null;
      // Clean up per-lang files too
      ['en','es','ch','no','de','fr','it','pt','ru','zh','ja','ar'].forEach(lang => {
        files['lifetracker-vocab-' + lang + '.json'] = null;
      });
    }
    
    await ghCall('/gists/' + state.github.gistId, {
      method: 'PATCH',
      body: JSON.stringify({ files }),
    });
    state.github.lastSync = new Date().toISOString();
    saveLocal();
    const fileCount = Object.keys(files).filter(k => files[k] !== null).length;
    const sizeStr = (totalContentSize / 1024).toFixed(0) + ' KB' + (splitMode ? ' (' + fileCount + ' Dateien)' : '');
    setSync('ok', 'Sync ' + new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}) + ' · ' + sizeStr);
  } catch(e) {
    setSync('error', 'Sync-Fehler');
  } finally {
    ghUploadInProgress = false;
    if (ghUploadQueued) {
      ghUploadQueued = false;
      // Run queued upload after a short delay
      setTimeout(ghUpload, 100);
    }
  }
}

async function ghDownload() {
  if (!state.github.token || !state.github.gistId) return null;
  setSync('warn', 'Lade...');
  try {
    const gist = await ghCall('/gists/' + state.github.gistId);
    
    // Helper: parse one file (with optional decompression)
    async function parseFile(fileObj) {
      if (!fileObj) return null;
      let content = fileObj.content;
      if (fileObj.truncated) {
        const r = await fetch(fileObj.raw_url);
        content = await r.text();
      }
      let parsed = JSON.parse(content);
      if (parsed && parsed._format === 'lz-base64' && typeof parsed.payload === 'string') {
        const decompressed = LZString.decompressFromBase64(parsed.payload);
        if (!decompressed) throw new Error('Decompression failed');
        parsed = JSON.parse(decompressed);
      }
      return parsed;
    }
    
    const mainFile = gist.files[GIST_FILENAME];
    if (!mainFile) throw new Error('Hauptdatei fehlt');
    let data = await parseFile(mainFile);
    
    // If main file references split files, fetch them too
    if (data && Array.isArray(data._splitFiles)) {
      const splitFiles = data._splitFiles;
      if (splitFiles.indexOf('vocab') >= 0) {
        const vocabFile = gist.files[GIST_FILENAME_VOCAB];
        if (vocabFile) {
          try {
            const vocabData = await parseFile(vocabFile);
            // Check if vocab itself is split per-language
            if (vocabData && vocabData._langSplit && Array.isArray(vocabData._langs)) {
              // Merge per-language files
              const mergedCards = {};
              for (let i = 0; i < vocabData._langs.length; i++) {
                const lang = vocabData._langs[i];
                const langFile = gist.files['lifetracker-vocab-' + lang + '.json'];
                if (!langFile) continue;
                try {
                  const langData = await parseFile(langFile);
                  if (langData && langData.cards) {
                    Object.assign(mergedCards, langData.cards);
                  }
                } catch(e) {
                  console.warn('Lang split file load failed for', lang, e);
                }
              }
              data.vocab = {
                cards: mergedCards,
                settings: vocabData.settings || {},
              };
            } else {
              data.vocab = vocabData;
            }
          } catch(e) {
            console.warn('Vocab split file load failed:', e);
          }
        }
      }
      if (splitFiles.indexOf('sport') >= 0) {
        const sportFile = gist.files[GIST_FILENAME_SPORT];
        if (sportFile) {
          try {
            data.sport = await parseFile(sportFile);
          } catch(e) {
            console.warn('Sport split file load failed:', e);
          }
        }
      }
      delete data._splitFiles;
    }
    
    setSync('ok', 'Geladen');
    return data;
  } catch(e) {
    setSync('error', 'Lade-Fehler');
    console.error('ghDownload failed:', e);
    return null;
  }
}

function setSync(type, text) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.className = 'sync-pill ' + (type === 'warn' ? 'warn' : type === 'error' ? 'error' : type === 'ok' ? 'ok' : 'idle');
  // Use textContent for the text to prevent any XSS, then prepend dot via element
  el.innerHTML = '';
  const dot = document.createElement('span');
  dot.className = 'dot';
  el.appendChild(dot);
  el.appendChild(document.createTextNode(' ' + String(text || '')));
}

let syncTimer = null;
let _isOnline = (typeof navigator !== 'undefined' && navigator.onLine !== false);
let _pendingSyncOnReconnect = false;

function scheduleSync() {
  if (!state.github.token || !state.github.gistId || !state.github.autoSync) return;
  // If offline, mark pending and don't try (would fail anyway)
  if (!_isOnline) {
    _pendingSyncOnReconnect = true;
    setSync('error', 'Offline · Sync pausiert');
    return;
  }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(ghUpload, 3000);
}

// Detect online/offline transitions
if (typeof window !== 'undefined') {
  window.addEventListener('online', () => {
    _isOnline = true;
    if (_pendingSyncOnReconnect && state.github.token && state.github.gistId) {
      _pendingSyncOnReconnect = false;
      setSync('warn', 'Online · synce...');
      setTimeout(() => ghUpload(), 500);
    }
  });
  window.addEventListener('offline', () => {
    _isOnline = false;
    setSync('error', 'Offline');
  });
}

// =============================================
// STATS - basic
// =============================================
function weekStats(wd, weekKeyStr) {
  if (!wd || !wd.days) return { score: 0, byHabit: {}, avgMood: null, isVacation: false };
  // Vacation week: no scoring
  if (wd.type === 'U') {
    return { score: null, byHabit: {}, avgMood: null, isVacation: true };
  }
  
  // Determine which habits were active in this week:
  // - Fixed and swappable habits: always active
  // - Custom habits: active if createdAt <= this week
  const activeHabits = HABITS.filter(h => {
    if (!h.custom) return true;
    if (!h.createdAt) return true; // fallback for legacy custom habits
    if (!weekKeyStr) return true; // if we don't know the week, include all
    return h.createdAt <= weekKeyStr;
  });
  
  const byHabit = {};
  let moodSum = 0, moodN = 0;
  // Initialize byHabit for ALL habits (for compatibility with code that reads them)
  HABITS.forEach(h => byHabit[h.id] = 0);
  for (let i = 0; i < 7; i++) {
    const day = getDay(wd, i);
    HABITS.forEach(h => {
      if (day[h.id]) byHabit[h.id]++;
    });
    if (day.mood) { moodSum += day.mood; moodN++; }
  }
  const type = wd.type || 'A';
  let totalProgress = 0;
  let countedHabits = 0;
  activeHabits.forEach(h => {
    const target = getTarget(h, type);
    if (target > 0) {
      totalProgress += Math.min(1.0, byHabit[h.id] / target);
      countedHabits++;
    }
  });
  const score = countedHabits > 0 ? Math.round((totalProgress / countedHabits) * 100) : 0;
  return {
    score,
    byHabit,
    avgMood: moodN > 0 ? +(moodSum/moodN).toFixed(1) : null,
    isVacation: false,
  };
}

function computeStreak(habitId) {
  let streak = 0;
  let iterations = 0;
  let week = startOfWeek(TODAY);
  let day = todayDayIdx();
  let allowMissToday = true;
  // Absolute iteration limit (2 years of days) to prevent infinite loops
  while (streak < 365 && iterations < 730) {
    iterations++;
    const wd = state.weeks[weekKey(week)];
    // U-Wochen pausieren, brechen Streak NICHT
    if (wd && wd.type === 'U') {
      day--;
      if (day < 0) { week = addDays(week, -7); day = 6; }
      continue;
    }
    if (!wd || !wd.days || !wd.days[day] || !wd.days[day][habitId]) {
      if (allowMissToday && week.getTime() === startOfWeek(TODAY).getTime() && day === todayDayIdx()) {
        allowMissToday = false;
        day--;
        if (day < 0) { week = addDays(week, -7); day = 6; }
        continue;
      }
      break;
    }
    streak++;
    allowMissToday = false;
    day--;
    if (day < 0) { week = addDays(week, -7); day = 6; }
  }
  return streak;
}

function getTrendsArray(n) {
  // FIX BUG #22: Always anchor to TODAY, not state.currentWeek
  // Otherwise insights show distorted data when user navigates past weeks
  const anchor = startOfWeek(TODAY);
  const trends = [];
  for (let i = n - 1; i >= 0; i--) {
    const ws = addDays(anchor, -i*7);
    const k = weekKey(ws);
    const wd = state.weeks[k];
    if (wd) {
      const s = weekStats(wd, k);
      trends.push({ week: k, score: s.score, type: wd.type, byHabit: s.byHabit, avgMood: s.avgMood, isVacation: s.isVacation });
    } else {
      trends.push({ week: k, score: 0, type: '?', byHabit: {}, isVacation: false });
    }
  }
  return trends;
}

function computeTrajectoryScore() {
  const trends = getTrendsArray(12).filter(t => !t.isVacation && (t.score > 0 || t.type !== '?'));
  if (trends.length < 2) return { score: 0, label: 'Zu wenig Daten', color: 'var(--text-muted)', breakdown: null };
  
  const validTrends = trends.filter(t => t.score >= 0);
  const avgScore = validTrends.reduce((s,t) => s + t.score, 0) / validTrends.length;
  const avgPts = Math.round(30 * (avgScore / 100));
  
  // Output and body progress relative to targets
  const outputH = HABITS.filter(h => h.cat === 'output');
  const bodyH = HABITS.filter(h => h.cat === 'body');
  
  let outputProgSum = 0, outputN = 0;
  let bodyProgSum = 0, bodyN = 0;
  
  validTrends.forEach(t => {
    const wd = state.weeks[t.week];
    if (!wd) return;
    const type = wd.type || 'A';
    outputH.forEach(h => {
      const target = getTarget(h, type);
      if (target > 0) {
        outputProgSum += Math.min(1.0, (t.byHabit[h.id] || 0) / target);
        outputN++;
      }
    });
    bodyH.forEach(h => {
      const target = getTarget(h, type);
      if (target > 0) {
        bodyProgSum += Math.min(1.0, (t.byHabit[h.id] || 0) / target);
        bodyN++;
      }
    });
  });
  
  const outputPct = outputN > 0 ? (outputProgSum/outputN)*100 : 0;
  const bodyPct = bodyN > 0 ? (bodyProgSum/bodyN)*100 : 0;
  const outputPts = Math.round(30 * (outputPct / 100));
  const bodyPts = Math.round(25 * (bodyPct / 100));
  
  const scores = validTrends.map(t => t.score).filter(s => s > 0);
  let stdDev = 0;
  if (scores.length >= 3) {
    const m = scores.reduce((s,v) => s+v, 0) / scores.length;
    stdDev = Math.sqrt(scores.reduce((s,v) => s + Math.pow(v-m,2), 0) / scores.length);
  }
  let consPts = 0;
  if (scores.length >= 3) {
    if (stdDev < 10) consPts = 15;
    else if (stdDev < 20) consPts = 10;
    else if (stdDev < 30) consPts = 5;
  }
  
  const total = avgPts + outputPts + bodyPts + consPts;
  
  let label, color;
  if (total >= 80) { label = 'Senior-Trajektorie'; color = '#10b981'; }
  else if (total >= 60) { label = 'Solide Trajektorie'; color = '#22c55e'; }
  else if (total >= 40) { label = 'Optimierungspotenzial'; color = '#f59e0b'; }
  else if (total >= 20) { label = 'Strukturprobleme'; color = '#ef4444'; }
  else { label = 'Notbremse - Plan überdenken'; color = '#991b1b'; }
  
  return {
    score: total, label, color,
    breakdown: { avgPts, outputPts, bodyPts, consPts, stdDev: Math.round(stdDev), avgScore: Math.round(avgScore), outputPct: Math.round(outputPct), bodyPct: Math.round(bodyPct) },
  };
}

function trajectoryArrow() {
  const trends = getTrendsArray(12).filter(t => !t.isVacation && t.score > 0);
  if (trends.length < 4) return null;
  const half = Math.floor(trends.length / 2);
  const early = trends.slice(0, half);
  const recent = trends.slice(-half);
  const earlyAvg = early.reduce((s,t) => s+t.score, 0) / early.length;
  const recentAvg = recent.reduce((s,t) => s+t.score, 0) / recent.length;
  const diff = recentAvg - earlyAvg;
  if (diff > 8) return { dir: 'up', icon: '↗', label: 'Aufsteigend', color: '#10b981', diff: Math.round(diff) };
  if (diff < -8) return { dir: 'down', icon: '↘', label: 'Fallend', color: '#ef4444', diff: Math.round(diff) };
  return { dir: 'flat', icon: '→', label: 'Stabil', color: 'var(--text-muted)', diff: Math.round(diff) };
}

function pillarBalance() {
  const trends = getTrendsArray(12).filter(t => !t.isVacation && t.score > 0);
  if (trends.length === 0) return null;
  
  const pillars = ['body', 'output', 'social'];
  const result = {};
  
  pillars.forEach(p => {
    const habits = HABITS.filter(h => h.cat === p);
    let progressSum = 0, habitWeeks = 0;
    trends.forEach(t => {
      const wd = state.weeks[t.week];
      if (!wd) return;
      const type = wd.type || 'A';
      habits.forEach(h => {
        const target = getTarget(h, type);
        if (target > 0) {
          progressSum += Math.min(1.0, (t.byHabit[h.id] || 0) / target);
          habitWeeks++;
        }
      });
    });
    result[p] = habitWeeks > 0 ? Math.round((progressSum/habitWeeks)*100) : 0;
  });
  
  return result;
}

function moodHabitCorrelation() {
  const highDays = [];
  const lowDays = [];
  
  Object.values(state.weeks).forEach(wd => {
    if (!wd.days || wd.type === 'U') return;
    for (let i = 0; i < 7; i++) {
      const day = wd.days[i];
      if (!day || !day.mood) continue;
      if (day.mood >= 4) highDays.push(day);
      if (day.mood <= 2) lowDays.push(day);
    }
  });
  
  if (highDays.length < 3 || lowDays.length < 3) {
    return { ready: false, highCount: highDays.length, lowCount: lowDays.length };
  }
  
  const correlations = HABITS.map(h => {
    const highPct = highDays.filter(d => d[h.id]).length / highDays.length;
    const lowPct = lowDays.filter(d => d[h.id]).length / lowDays.length;
    return { habit: h, highPct, lowPct, diff: highPct - lowPct };
  }).filter(c => c.diff > 0.1).sort((a,b) => b.diff - a.diff);  // only significant correlations
  
  return {
    ready: true,
    highCount: highDays.length,
    lowCount: lowDays.length,
    top: correlations.slice(0, 3),
  };
}

function abWeekComparison() {
  let aSum = 0, aCount = 0, bSum = 0, bCount = 0, uCount = 0;
  Object.entries(state.weeks).forEach(([wk, wd]) => {
    if (wd.type === 'U') { uCount++; return; }
    const s = weekStats(wd, wk);
    if (s.score === 0 || s.score === null) return;
    if (wd.type === 'A') { aSum += s.score; aCount++; }
    else if (wd.type === 'B') { bSum += s.score; bCount++; }
  });
  return {
    aAvg: aCount > 0 ? Math.round(aSum/aCount) : 0,
    bAvg: bCount > 0 ? Math.round(bSum/bCount) : 0,
    aCount, bCount, uCount,
  };
}

function leverHabits() {
  const weekEntries = Object.entries(state.weeks).filter(([wk, w]) => w.days && w.type !== 'U');
  if (weekEntries.length < 4) return null;
  
  const corr = HABITS.map(h => {
    let sumW = 0, cntW = 0, sumO = 0, cntO = 0;
    weekEntries.forEach(([wk, wd]) => {
      const s = weekStats(wd, wk);
      if (s.score === 0 || s.score === null) return;
      // Skip weeks where this habit wasn't yet active
      if (h.custom && h.createdAt && h.createdAt > wk) return;
      const target = getTarget(h, wd.type || 'A');
      const habitCount = s.byHabit[h.id] || 0;
      if (habitCount >= target) { sumW += s.score; cntW++; }
      else { sumO += s.score; cntO++; }
    });
    if (cntW === 0 || cntO === 0) return { habit: h, lift: 0 };
    return { habit: h, lift: Math.round((sumW/cntW) - (sumO/cntO)) };
  }).filter(c => c.lift > 0).sort((a,b) => b.lift - a.lift);
  
  return corr.slice(0, 3);
}

function weekdayPattern() {
  const dayScores = [0,0,0,0,0,0,0];
  const dayCounts = [0,0,0,0,0,0,0];
  
  Object.values(state.weeks).forEach(wd => {
    if (!wd.days || wd.type === 'U') return;
    for (let i = 0; i < 7; i++) {
      const day = wd.days[i];
      if (!day) continue;
      let done = 0;
      HABITS.forEach(h => { if (day[h.id]) done++; });
      dayScores[i] += (done / HABITS.length) * 100;
      dayCounts[i]++;
    }
  });
  
  const averages = dayScores.map((s, i) => dayCounts[i] > 0 ? Math.round(s/dayCounts[i]) : 0);
  if (dayCounts.every(c => c === 0)) return null;
  
  let bestIdx = -1, worstIdx = -1;
  for (let i = 0; i < 7; i++) {
    if (dayCounts[i] === 0) continue;
    if (bestIdx === -1 || averages[i] > averages[bestIdx]) bestIdx = i;
    if (worstIdx === -1 || averages[i] < averages[worstIdx]) worstIdx = i;
  }
  
  return { averages, dayCounts, bestIdx, worstIdx };
}

function burnoutRisk() {
  // Check for recent vacation (last 4 weeks)
  let recentVacation = 0;
  for (let wi = 0; wi < 4; wi++) {
    const ws = addDays(startOfWeek(TODAY), -wi * 7);
    const wd = state.weeks[weekKey(ws)];
    if (wd && wd.type === 'U') recentVacation++;
  }
  
  const trends = getTrendsArray(3).filter(t => !t.isVacation && t.score > 0);
  if (trends.length < 2) return { level: 'unknown', factors: [], recentVacation };
  
  const factors = [];
  
  // Body/output pct relative to targets (not hardcoded /7)
  let bodyProg = 0, bodyN = 0, outputProg = 0, outputN = 0;
  trends.forEach(t => {
    const wd = state.weeks[t.week];
    if (!wd) return;
    const type = wd.type || 'A';
    HABITS.filter(h => h.cat === 'body').forEach(h => {
      const target = getTarget(h, type);
      if (target > 0) {
        bodyProg += Math.min(1.0, (t.byHabit[h.id] || 0) / target);
        bodyN++;
      }
    });
    HABITS.filter(h => h.cat === 'output').forEach(h => {
      const target = getTarget(h, type);
      if (target > 0) {
        outputProg += Math.min(1.0, (t.byHabit[h.id] || 0) / target);
        outputN++;
      }
    });
  });
  const bodyPct = bodyN > 0 ? bodyProg/bodyN : 0;
  const outputPct = outputN > 0 ? outputProg/outputN : 0;
  
  if (bodyPct < 0.4 && outputPct > 0.65) {
    factors.push({ icon: '⚠️', text: 'Hohe Output-Belastung, niedrige Körper-Aktivität' });
  }
  
  let moodSum = 0, moodCount = 0;
  trends.forEach(t => {
    const wd = state.weeks[t.week];
    if (!wd || !wd.days) return;
    for (let i = 0; i < 7; i++) {
      const d = wd.days[i] || {};
      if (d.mood) { moodSum += d.mood; moodCount++; }
    }
  });
  if (moodCount >= 5) {
    const avgMood = moodSum/moodCount;
    if (avgMood < 2.5) factors.push({ icon: '😞', text: 'Stimmung im Schnitt < 2.5 / 5' });
  }
  
  let socialProg = 0, socialN = 0;
  trends.forEach(t => {
    const wd = state.weeks[t.week];
    if (!wd) return;
    const target = getTarget(HABITS.find(h => h.id === 'social'), wd.type || 'A');
    if (target > 0) {
      socialProg += Math.min(1.0, (t.byHabit['social'] || 0) / target);
      socialN++;
    }
  });
  if (socialN > 0 && socialProg / socialN < 0.3) {
    factors.push({ icon: '💛', text: 'Wenig soziale Kontakte' });
  }
  
  let sleepProg = 0, sleepN = 0;
  trends.forEach(t => {
    const wd = state.weeks[t.week];
    if (!wd) return;
    const target = getTarget(HABITS.find(h => h.id === 'sleep'), wd.type || 'A');
    if (target > 0) {
      sleepProg += Math.min(1.0, (t.byHabit['sleep'] || 0) / target);
      sleepN++;
    }
  });
  if (sleepN > 0 && sleepProg / sleepN < 0.5) {
    factors.push({ icon: '🌙', text: 'Schlafdefizit (<50% des Ziels)' });
  }
  
  let level = 'low';
  if (factors.length >= 3) level = 'high';
  else if (factors.length >= 1) level = 'medium';
  
  // Recent vacation reduces risk by one level
  if (recentVacation >= 1 && level === 'high') level = 'medium';
  else if (recentVacation >= 1 && level === 'medium') level = 'low';
  
  return { level, factors, recentVacation };
}

function getWarnings() {
  const warnings = [];
  
  // Current week is U? No warnings during vacation
  const currentWk = weekKey(state.currentWeek);
  const currentWd = state.weeks[currentWk];
  if (currentWd && currentWd.type === 'U') {
    return warnings;
  }
  
  // Was there a recent vacation? Soften warnings
  let recentVacation = false;
  for (let wi = 0; wi < 2; wi++) {
    const ws = addDays(startOfWeek(TODAY), -wi * 7);
    const wd = state.weeks[weekKey(ws)];
    if (wd && wd.type === 'U') { recentVacation = true; break; }
  }
  
  // Collect data: last 3 non-vacation weeks
  let sleepCount = 0, totalDays = 0;
  let socialCount = 0;
  let weekScores = [];
  let phdCounts = [];
  for (let wi = 0; wi < 3; wi++) {
    const ws = addDays(startOfWeek(TODAY), -wi * 7);
    const wsKey = weekKey(ws);
    const wd = state.weeks[wsKey];
    if (!wd || wd.type === 'U') { weekScores.push(null); phdCounts.push(null); continue; }
    const s = weekStats(wd, wsKey);
    weekScores.push(s.score);
    phdCounts.push({ count: s.byHabit.phd || 0, type: wd.type });
    for (let i = 0; i < 7; i++) {
      const d = getDay(wd, i);
      if (d.sleep) sleepCount++;
      if (d.social) socialCount++;
      totalDays++;
    }
  }
  
  const isViewingCurrent = currentWk === weekKey(TODAY);
  const todayI = todayDayIdx();
  
  // === ALARM 1: PhD-Stillstand (KRITISCH, prädiktiv) ===
  // Bedingung: 2 A-Wochen in Folge mit PhD < 25% des Ziels (4 × 0.25 = 1)
  const validPhd = phdCounts.filter(p => p !== null);
  if (validPhd.length >= 2) {
    const recent2 = validPhd.slice(0, 2);
    const stillstandWochen = recent2.filter(p => p.type === 'A' && p.count < 1);
    if (stillstandWochen.length >= 2) {
      warnings.push({
        icon: '🎓',
        severity: 'high',
        type: 'predictive',
        title: 'PhD-Stillstand droht',
        text: '2 A-Wochen ohne nennenswerte PhD-Arbeit. Burgos-Roadmap gefährdet.',
        action: 'Diese Woche: Mi/Do/Sa-Blöcke fix einplanen.',
      });
    }
  }
  
  // === ALARM 2: PhD-Wochenend-Rettung (präventiv) ===
  // Heute Freitag/Samstag/Sonntag, aktuelle A-Woche, PhD bis jetzt = 0
  if (isViewingCurrent && currentWd && currentWd.type === 'A' && todayI >= 4) {
    let weekPhdSoFar = 0;
    for (let i = 0; i <= todayI; i++) {
      if ((currentWd.days[i] || {}).phd) weekPhdSoFar++;
    }
    if (weekPhdSoFar === 0) {
      warnings.push({
        icon: '⏰',
        severity: 'medium',
        type: 'preventive',
        title: 'PhD-Woche fast verloren',
        text: 'Aktuelle A-Woche, bisher 0× PhD. Wochenend-Blöcke (Sa-Morgen, So-Abend) sichern.',
      });
    }
  }
  
  // === ALARM 3: Trajektorie fällt steil (prädiktiv) ===
  // Vergleiche 4-Wochen-Schnitt Wochen 1-4 vs 5-8
  const trends8 = getTrendsArray(8).filter(t => t.score > 0);
  if (trends8.length >= 6) {
    const recent4 = trends8.slice(-4);
    const earlier4 = trends8.slice(0, Math.min(4, trends8.length - 4));
    if (recent4.length >= 3 && earlier4.length >= 3) {
      const recentAvg = recent4.reduce((s,t)=>s+t.score, 0) / recent4.length;
      const earlierAvg = earlier4.reduce((s,t)=>s+t.score, 0) / earlier4.length;
      const drop = earlierAvg - recentAvg;
      if (drop > 15) {
        warnings.push({
          icon: '📉',
          severity: 'high',
          type: 'predictive',
          title: 'Trajektorie kippt',
          text: 'Letzte 4 Wochen ' + Math.round(drop) + ' Punkte unter den vorherigen 4. Plan kollabiert.',
          action: 'Insights-Tab: schau dir Hebel-Habits an.',
        });
      } else if (drop > 8) {
        warnings.push({
          icon: '⚠️',
          severity: 'medium',
          type: 'predictive',
          title: 'Trajektorie schwächt ab',
          text: '4-Wochen-Schnitt ' + Math.round(drop) + ' Punkte unter dem vorherigen. Trend beobachten.',
        });
      }
    }
  }
  
  // === ALARM 4: Aktuelle Woche driftet ab (präventiv) ===
  // Aktuelle Woche, schon Mittwoch+, Score deutlich unter 4-Wochen-Schnitt
  if (isViewingCurrent && currentWd && todayI >= 2) {
    const currentScore = weekStats(currentWd).score;
    const prevValidScores = weekScores.slice(1).filter(s => s !== null && s > 0);
    if (prevValidScores.length >= 2 && currentScore > 0) {
      const avgPrev = prevValidScores.reduce((s,v)=>s+v, 0) / prevValidScores.length;
      // Adjust for week progress: at day index 2 (Wed) we should have ~3/7 of habits done
      const expectedProgress = ((todayI + 1) / 7) * avgPrev;
      const actualProgress = currentScore;
      if (actualProgress < expectedProgress - 20) {
        warnings.push({
          icon: '🎯',
          severity: 'medium',
          type: 'preventive',
          title: 'Diese Woche driftet',
          text: 'Aktuell ' + currentScore + '% — sollte um Tag ' + (todayI+1) + ' bei ~' + Math.round(expectedProgress) + '% sein.',
        });
      }
    }
  }
  
  // === ALARM 5: Schlaf-Frühwarnung (prädiktiv) ===
  // Letzte 5 Tage: weniger als 60% Schlaf
  let last5SleepCount = 0, last5Total = 0;
  let d = todayI, week = startOfWeek(TODAY);
  for (let i = 0; i < 5; i++) {
    const wd = state.weeks[weekKey(week)];
    if (wd && wd.days) {
      const day = wd.days[d];
      if (day) {
        last5Total++;
        if (day.sleep) last5SleepCount++;
      }
    }
    d--;
    if (d < 0) { week = addDays(week, -7); d = 6; }
  }
  if (last5Total >= 4 && last5SleepCount / last5Total < 0.4) {
    warnings.push({
      icon: '🌙',
      severity: 'high',
      type: 'predictive',
      title: 'Schlaf-Routine bricht',
      text: 'Nur ' + last5SleepCount + '/' + last5Total + ' der letzten Tage vor 23h ins Bett. Schlafentzug akkumuliert.',
      action: 'Heute Abend bewusst um 22:30 Bildschirm aus.',
    });
  } else if (totalDays >= 14 && sleepCount / totalDays < 0.5) {
    // Reaktiv: längerfristiges Defizit
    warnings.push({
      icon: '🌙',
      severity: 'medium',
      type: 'reactive',
      title: 'Schlafdefizit über 2 Wochen',
      text: Math.round((sleepCount/totalDays)*100) + '% Schlaf-Quote — chronisch zu niedrig.',
    });
  }
  
  // === ALARM 6: B-Wochen-Häufung (präventiv) ===
  // 3+ B-Wochen in Folge
  let consecBWeeks = 0;
  for (let wi = 0; wi < 5; wi++) {
    const ws = addDays(startOfWeek(TODAY), -wi * 7);
    const wd = state.weeks[weekKey(ws)];
    if (wd && wd.type === 'B') consecBWeeks++;
    else break;
  }
  if (consecBWeeks >= 3) {
    warnings.push({
      icon: '✈️',
      severity: 'medium',
      type: 'preventive',
      title: 'Lange IBN-Phase (' + consecBWeeks + ' Wochen)',
      text: 'Recovery nach Rückkehr planen: 1 Woche Sport-fokussiert, PhD-Block am ersten Wochenende.',
    });
  }
  
  // === ALARM 7: Chronisch niedrige Performance (reaktiv, behalten) ===
  const validScores = weekScores.filter(s => s !== null);
  if (validScores.length >= 3 && validScores.every(s => s < 50)) {
    warnings.push({
      icon: '🚨',
      severity: 'high',
      type: 'reactive',
      title: '3 Wochen unter 50%',
      text: 'Strukturproblem. Habits-Auswahl überdenken, eventuell zu viele Habits gleichzeitig.',
      action: 'Insights-Tab → Hebel-Habits → Fokus auf Top 3.',
    });
  }
  
  // Sortiere nach severity: high → medium → info
  const sevOrder = { high: 0, medium: 1, info: 2 };
  
  // If recent vacation, downgrade all severities by one (Recovery context)
  if (recentVacation) {
    warnings.forEach(w => {
      if (w.severity === 'high') w.severity = 'medium';
      else if (w.severity === 'medium') w.severity = 'info';
    });
  }
  
  warnings.sort((a,b) => (sevOrder[a.severity] || 2) - (sevOrder[b.severity] || 2));
  
  return warnings;
}

// Vibration on iPhone (works in Safari when added to home screen)
let lastVibrationTime = 0;
function maybeVibrate(severity) {
  if (!('vibrate' in navigator)) return;
  // Throttle: only vibrate once per 5 minutes for same severity
  const now = Date.now();
  if (now - lastVibrationTime < 5 * 60 * 1000) return;
  lastVibrationTime = now;
  try {
    if (severity === 'high') navigator.vibrate([200, 100, 200]);
    else if (severity === 'medium') navigator.vibrate(100);
  } catch(e) {}
}

// =============================================
// RENDER
// =============================================
let _lastRenderTab = null;
// Error boundary: tracks the last successful render so we can recover
let _lastGoodTab = 'week';
let _renderErrorCount = 0;

function render() {
  try {
    _renderInner();
    // Success: remember last good tab and reset error counter
    _lastGoodTab = state.activeTab;
    _renderErrorCount = 0;
  } catch(err) {
    _renderErrorCount++;
    console.error('Render error:', err);
    
    const root = document.getElementById('tabContent');
    if (!root) return; // can't even recover
    
    // Try to recover: switch back to a known-good tab on first error
    if (_renderErrorCount === 1 && state.activeTab !== _lastGoodTab && _lastGoodTab !== state.activeTab) {
      try {
        state.activeTab = _lastGoodTab;
        _renderInner();
        // Recovery worked: notify user gently
        const banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;top:8px;right:8px;background:#fef3c7;border:1px solid #f59e0b;color:#92400e;padding:8px 12px;border-radius:8px;font-size:11px;z-index:9999;max-width:280px;';
        banner.textContent = '⚠ Tab konnte nicht geladen werden, zurück zu "' + _lastGoodTab + '"';
        document.body.appendChild(banner);
        setTimeout(() => { if (banner.parentNode) banner.remove(); }, 4000);
        return;
      } catch(err2) {
        console.error('Recovery render also failed:', err2);
      }
    }
    
    // Last-resort: render a recovery UI in the tab content
    root.innerHTML = '<div class="card" style="background:rgba(220,38,38,0.05);border:1px solid rgba(220,38,38,0.3);">' +
      '<h2 style="font-size:16px;margin:0 0 8px;color:#dc2626;">⚠ Fehler beim Rendern</h2>' +
      '<p style="font-size:12px;color:var(--text-muted);margin:0 0 12px;">Ein Tab konnte nicht angezeigt werden. Deine Daten sind sicher gespeichert.</p>' +
      '<div style="font-family:monospace;font-size:10px;background:rgba(0,0,0,0.05);padding:8px;border-radius:6px;color:var(--text-muted);margin-bottom:12px;word-break:break-all;">' +
      escapeHtml(String(err && err.message || 'Unknown error').slice(0, 200)) + '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button class="btn" data-action="recovery-reload">App neu laden</button>' +
      '<button class="btn" data-action="recovery-week">Zur Wochen-Übersicht</button>' +
      '<button class="btn" data-action="recovery-export">Daten als JSON exportieren</button>' +
      '</div></div>';
    // Wire up recovery buttons directly (don't go through attachEvents which might also crash)
    const reloadBtn = root.querySelector('[data-action="recovery-reload"]');
    if (reloadBtn) reloadBtn.onclick = () => window.location.reload();
    const weekBtn = root.querySelector('[data-action="recovery-week"]');
    if (weekBtn) weekBtn.onclick = () => { state.activeTab = 'week'; render(); };
    const exportBtn = root.querySelector('[data-action="recovery-export"]');
    if (exportBtn) exportBtn.onclick = () => {
      try {
        const exportData = {
          weeks: state.weeks, goals: state.goals, vocab: state.vocab,
          sport: state.sport, finance: state.finance,
          customHabits: state.customHabits, northStar: state.northStar,
          exportedAt: new Date().toISOString(), recoveryExport: true,
        };
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'lifetracker-recovery-' + (new Date().toISOString().slice(0,10)) + '.json';
        a.click();
        URL.revokeObjectURL(url);
      } catch(e) {
        alert('Export fehlgeschlagen: ' + e.message);
      }
    };
  }
}

function _renderInner() {
  // Preserve scroll position only if staying on same tab
  const stayingOnSameTab = _lastRenderTab === state.activeTab;
  const scrollY = stayingOnSameTab ? (window.scrollY || document.documentElement.scrollTop || 0) : 0;
  
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === state.activeTab);
  });
  // Render calendar widget at top (visible on every tab)
  const gcalEl = document.getElementById('gcalWidget');
  if (gcalEl) gcalEl.innerHTML = renderGcalWidget();
  
  const root = document.getElementById('tabContent');
  if (state.activeTab === 'week') root.innerHTML = renderWeek();
  if (state.activeTab === 'calendar') root.innerHTML = renderCalendar();
  if (state.activeTab === 'sport') root.innerHTML = renderSport();
  if (state.activeTab === 'insights') root.innerHTML = renderInsights();
  if (state.activeTab === 'vocab') root.innerHTML = renderVocab();
  if (state.activeTab === 'goals') root.innerHTML = renderGoals();
  if (state.activeTab === 'finance') root.innerHTML = renderFinance();
  if (state.activeTab === 'sync') root.innerHTML = renderSync();
  attachEvents();
  _lastRenderTab = state.activeTab;
  
  // Restore scroll position (next tick to allow layout to complete)
  if (stayingOnSameTab && scrollY > 0) {
    requestAnimationFrame(() => {
      window.scrollTo(0, scrollY);
    });
  } else if (!stayingOnSameTab) {
    // Tab change: scroll to top
    window.scrollTo(0, 0);
  }
}

function renderGcalWidget() {
  // Don't show widget if user hasn't even setup credentials yet
  if (!state.gcal.clientId || !state.gcal.apiKey) {
    return '';  // hidden entirely
  }
  
  if (!state.gcal.connected) {
    return '<div class="gcal-widget-empty">📅 Google Calendar nicht verbunden. <a data-action="gcal-connect" style="cursor:pointer;">Verbinden</a></div>';
  }
  
  const current = gcalGetCurrentEvent();
  const next = gcalGetNextEvent();
  
  if (current) {
    const isAllDay = current.allDay;
    return '<div class="gcal-widget gcal-widget-current">' +
      '<div class="gcal-widget-icon">🔴</div>' +
      '<div class="gcal-widget-content">' +
        '<div class="gcal-widget-label">' + (isAllDay ? 'Heute ganztägig' : 'Jetzt läuft') + '</div>' +
        '<div class="gcal-widget-title">' + escapeHtml(current.title) + '</div>' +
        (isAllDay ? '' : '<div class="gcal-widget-time">bis ' + formatEventTime(current.end, false) + '</div>') +
      '</div>' +
    '</div>';
  }
  
  if (next) {
    const isAllDay = next.allDay;
    let until, timeDisplay;
    if (isAllDay) {
      // Next all-day event
      const evStart = new Date(next.start + 'T00:00:00');
      const daysDiff = Math.round((evStart - new Date(new Date().toDateString())) / (24 * 3600 * 1000));
      if (daysDiff === 1) until = 'morgen';
      else if (daysDiff === 2) until = 'übermorgen';
      else until = 'in ' + daysDiff + ' Tagen';
      timeDisplay = 'Ganztägig' + (next.calendarName ? ' · ' + escapeHtml(next.calendarName) : '');
    } else {
      until = formatTimeUntil(next.start);
      timeDisplay = formatEventTime(next.start, false) + (next.calendarName ? ' · ' + escapeHtml(next.calendarName) : '');
    }
    return '<div class="gcal-widget">' +
      '<div class="gcal-widget-icon">📅</div>' +
      '<div class="gcal-widget-content">' +
        '<div class="gcal-widget-label">Nächster Termin · ' + until + '</div>' +
        '<div class="gcal-widget-title">' + escapeHtml(next.title) + '</div>' +
        '<div class="gcal-widget-time">' + timeDisplay + '</div>' +
      '</div>' +
    '</div>';
  }
  
  // Connected, but no events in 48h
  return '<div class="gcal-widget">' +
    '<div class="gcal-widget-icon">✨</div>' +
    '<div class="gcal-widget-content">' +
      '<div class="gcal-widget-label">Kalender</div>' +
      '<div class="gcal-widget-title">Keine Termine in den nächsten 48h</div>' +
    '</div>' +
  '</div>';
}

  html += '<div class="reflection-field-label"><span class="reflection-field-icon">🎯</span>Konkrete Änderung</div>';
  html += '<textarea class="reflection-field-input" data-action="update-reflection" data-field="change" placeholder="Was änderst du nächste Woche konkret?">' + escapeHtml(ref.change || '') + '</textarea>';
  html += '</div>';
  html += '</div>';
  html += '</div>';
  
  html += '<div class="card">';
  html += '<div class="daily-card-title">📈 Fortschritt diese Woche (' + (wd.type === 'B' ? 'B-Wochen-Ziele' : 'A-Wochen-Ziele') + ')</div>';
  HABITS.forEach(h => {
    const c = stats.byHabit[h.id] || 0;
    const target = getTarget(h, wd.type || 'A');
    const pct = target > 0 ? Math.min(100, (c/target)*100) : 0;
    html += '<div class="progress-row">';
    html += '<div class="progress-head"><span>' + h.icon + ' ' + h.label + '</span><span style="font-weight:600;">' + c + ' / ' + target + '</span></div>';
    html += '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;background:' + h.color + ';"></div></div>';
    html += '</div>';
  });
  html += '</div>';
  
  return html;
}

function renderCalendarHeatmap() {
  let html = '<div class="card">';
  html += '<div class="daily-card-title">📅 84-Tage-Aktivität</div>';
  html += '<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">Jeder Tag = 1 Quadrat. Farbintensität = Anteil erfüllter Habits.</div>';
  
  html += '<div class="calendar-heatmap-wrap">';
  html += '<div class="heatmap-day-labels">';
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d => {
    html += '<div class="heatmap-day-label">' + d + '</div>';
  });
  html += '</div>';
  
  html += '<div class="heatmap-grid">';
  
  // FIX BUG #22b: Anchor to TODAY's week, not state.currentWeek
  const heatmapAnchor = startOfWeek(TODAY);
  
  // Build matrix: rows = days of week (Mo-So), columns = weeks
  for (let dayIdx = 0; dayIdx < 7; dayIdx++) {
    html += '<div class="heatmap-row">';
    for (let weekIdx = 11; weekIdx >= 0; weekIdx--) {
      const weekStart = addDays(heatmapAnchor, -weekIdx * 7);
      const date = addDays(weekStart, dayIdx);
      const wd = state.weeks[weekKey(weekStart)];
      const isFuture = date.getTime() > TODAY.getTime();
      
      let style = '';
      let cls = 'heatmap-cell';
      let title = date.toLocaleDateString('de-CH', { day: '2-digit', month: 'short' });
      
      if (isFuture) {
        style = 'opacity:0.3;';
        title += ': (zukünftig)';
      } else if (wd && wd.type === 'U') {
        cls += ' vacation';
        title += ': Urlaub';
      } else if (wd && wd.days) {
        const day = wd.days[dayIdx] || {};
        let done = 0;
        HABITS.forEach(h => { if (day[h.id]) done++; });
        const score = done / HABITS.length;
        if (score > 0) {
          const opacity = 0.25 + score * 0.75;
          style = 'background:#10b981;opacity:' + opacity.toFixed(2) + ';';
          title += ': ' + done + '/' + HABITS.length + ' Habits';
        } else {
          title += ': 0 Habits';
        }
      } else {
        title += ': (keine Daten)';
      }
      
      html += '<div class="' + cls + '" style="' + style + '" title="' + title + '"></div>';
    }
    html += '</div>';
  }
  
  html += '</div></div>';
  
  // Legend
  html += '<div class="heatmap-legend">';
  html += '<span>weniger</span>';
  html += '<div class="heatmap-legend-cell" style="background:var(--bg);"></div>';
  html += '<div class="heatmap-legend-cell" style="background:#10b981;opacity:0.3;"></div>';
  html += '<div class="heatmap-legend-cell" style="background:#10b981;opacity:0.6;"></div>';
  html += '<div class="heatmap-legend-cell" style="background:#10b981;opacity:1;"></div>';
  html += '<span>mehr</span>';
  html += '<div class="heatmap-legend-cell" style="background:#5eead4;margin-left:8px;"></div>';
  html += '<span>Urlaub</span>';
  html += '</div>';
  
  html += '<div class="science-note"><span class="science-note-icon">🔬</span>Don\'t break the chain (Seinfeld-Methode): Visuelle Kontinuität ist Motivator #1 in der Habit-Forschung.</div>';
  html += '</div>';
  
  return html;
}

function renderRadarChart() {
  const pillars = pillarBalance();
  if (!pillars) return '';
  
  let html = '<div class="card">';
  html += '<div class="daily-card-title">⚖️ Säulen-Balance · Radar</div>';
  
  const cx = 140, cy = 140, r = 90;
  const pillarLabels = { body: 'Körper', output: 'Output', social: 'Beziehungen' };
  const pillarColors = { body: '#0ea5e9', output: '#f59e0b', social: '#ec4899' };
  
  const angles = [-Math.PI/2, Math.PI/6, 5*Math.PI/6];
  const pillarOrder = ['body', 'output', 'social'];
  
  const pt = (angle, dist) => ({
    x: cx + Math.cos(angle) * dist,
    y: cy + Math.sin(angle) * dist,
  });
  
  html += '<div class="radar-chart-wrap">';
  html += '<svg class="radar-chart-svg" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">';
  
  [0.25, 0.5, 0.75, 1.0].forEach(ratio => {
    const points = angles.map(a => {
      const p = pt(a, r * ratio);
      return p.x.toFixed(1) + ',' + p.y.toFixed(1);
    }).join(' ');
    html += '<polygon points="' + points + '" fill="none" class="chart-grid" stroke-width="1"/>';
  });
  
  angles.forEach(a => {
    const p = pt(a, r);
    html += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '" class="chart-grid" stroke-width="1"/>';
  });
  
  const idealPoints = angles.map(a => {
    const p = pt(a, r * 0.8);
    return p.x.toFixed(1) + ',' + p.y.toFixed(1);
  }).join(' ');
  html += '<polygon points="' + idealPoints + '" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>';
  
  const dataPoints = angles.map((a, i) => {
    const value = pillars[pillarOrder[i]] / 100;
    const p = pt(a, r * Math.max(0.02, value));
    return p.x.toFixed(1) + ',' + p.y.toFixed(1);
  }).join(' ');
  html += '<polygon points="' + dataPoints + '" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="2"/>';
  
  angles.forEach((a, i) => {
    const value = pillars[pillarOrder[i]] / 100;
    const p = pt(a, r * Math.max(0.02, value));
    html += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4" fill="#2563eb"/>';
  });
  
  angles.forEach((a, i) => {
    const p = pt(a, r + 22);
    const pid = pillarOrder[i];
    const label = pillarLabels[pid];
    const val = pillars[pid];
    html += '<text x="' + p.x.toFixed(1) + '" y="' + p.y.toFixed(1) + '" text-anchor="middle" font-size="13" font-weight="700" fill="' + pillarColors[pid] + '">' + label + '</text>';
    html += '<text x="' + p.x.toFixed(1) + '" y="' + (p.y + 16).toFixed(1) + '" text-anchor="middle" font-size="11" class="chart-label">' + val + '%</text>';
  });
  
  html += '</svg></div>';
  
  const vals = Object.values(pillars);
  const maxV = Math.max(...vals), minV = Math.min(...vals);
  if (maxV - minV > 30) {
    html += '<div style="font-size:12px;color:var(--warning);text-align:center;margin-top:8px;">⚠️ Ungleichgewicht: ' + (maxV-minV) + ' Punkte Differenz</div>';
  }
  html += '<div style="font-size:11px;text-align:center;color:var(--text-muted);margin-top:4px;">Gestrichelte Linie = 80% Ideal-Zone</div>';
  html += '<div class="science-note"><span class="science-note-icon">🔬</span>Self-Determination Theory (Deci & Ryan, 1985): Balance zwischen Autonomie, Kompetenz, Verbundenheit ist Voraussetzung für intrinsische Motivation.</div>';
  html += '</div>';
  
  return html;
}

function renderMoodLineChart() {
  // FIX BUG #14: Always use TODAY as anchor, not state.currentWeek
  const todayWeek = startOfWeek(TODAY);
  const trends = [];
  for (let i = 11; i >= 0; i--) {
    const ws = addDays(todayWeek, -i*7);
    const k = weekKey(ws);
    const wd = state.weeks[k];
    if (wd) {
      const s = weekStats(wd, k);
      // FIX BUG #9: Even in U-weeks, mood can be captured
      let mood = s.avgMood;
      if (wd.type === 'U' && wd.days) {
        let moodSum = 0, moodN = 0;
        for (let d = 0; d < 7; d++) {
          const day = wd.days[d] || {};
          if (day.mood) { moodSum += day.mood; moodN++; }
        }
        if (moodN > 0) mood = +(moodSum/moodN).toFixed(1);
      }
      trends.push({ week: k, mood, isVacation: wd.type === 'U', date: ws });
    } else {
      trends.push({ week: k, mood: null, isVacation: false, date: ws });
    }
  }
  
  const moodPoints = trends.map((t, i) => ({ ...t, x: i })).filter(d => d.mood !== null);
  
  // FIX BUG #15: Show informative empty state instead of nothing
  if (moodPoints.length < 2) {
    let html = '<div class="card">';
    html += '<div class="daily-card-title">😊 Stimmungsverlauf · 12 Wochen</div>';
    html += '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:12px;">';
    html += '<div style="font-size:32px;opacity:0.4;margin-bottom:8px;">📊</div>';
    if (moodPoints.length === 0) {
      html += 'Noch keine Mood-Daten gesammelt.<br>Trage täglich deine Stimmung ein.';
    } else {
      html += 'Mindestens 2 Wochen mit Mood-Daten nötig.<br>Bisher: 1 Woche';
    }
    html += '</div></div>';
    return html;
  }
  
  let html = '<div class="card">';
  html += '<div class="daily-card-title">😊 Stimmungsverlauf · 12 Wochen</div>';
  
  // FIX BUG #1, #16: Use viewBox that matches aspect ratio of CSS dimensions
  // SVG 600x180 — wider for better label spacing, CSS scales it down responsively
  const w = 600, h = 180;
  const padding = { left: 36, right: 20, top: 16, bottom: 32 };
  const innerW = w - padding.left - padding.right;
  const innerH = h - padding.top - padding.bottom;
  
  const xScale = i => padding.left + (i / 11) * innerW;
  const yScale = m => padding.top + ((5 - m) / 4) * innerH;
  
  html += '<div class="mood-line-wrap">';
  // FIX BUG #1: NO preserveAspectRatio="none" — keep aspect ratio
  html += '<svg class="mood-line-svg" viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';
  
  // Vacation rects FIRST (background)
  trends.forEach((t, idx) => {
    if (t.isVacation) {
      const x = xScale(idx);
      html += '<rect x="' + (x - 8) + '" y="' + padding.top + '" width="16" height="' + innerH + '" fill="#5eead4" opacity="0.18" rx="2"/>';
    }
  });
  
  // FIX BUG #20: Use CSS variables for grid colors via attribute classes
  // Grid lines with theme-aware colors
  [1, 2, 3, 4, 5].forEach(m => {
    const y = yScale(m);
    html += '<line x1="' + padding.left + '" y1="' + y + '" x2="' + (w - padding.right) + '" y2="' + y + '" class="chart-grid" stroke-width="1" stroke-dasharray="2,3"/>';
    html += '<text x="' + (padding.left - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" class="chart-label">' + m + '</text>';
  });
  
  // FIX BUG #2: Draw separate line segments for consecutive points, gap for missing data
  // Only connect points that are at consecutive weeks OR within 2 weeks of each other
  let segments = [];
  let currentSegment = [];
  
  moodPoints.forEach((p, i) => {
    if (i === 0) {
      currentSegment.push(p);
    } else {
      const prevX = moodPoints[i-1].x;
      const gap = p.x - prevX;
      if (gap <= 2) {
        // Connect if gap is 1 or 2 weeks
        currentSegment.push(p);
      } else {
        // Big gap: save current segment, start new one
        if (currentSegment.length > 0) segments.push(currentSegment);
        currentSegment = [p];
      }
    }
  });
  if (currentSegment.length > 0) segments.push(currentSegment);
  
  // Draw each segment
  segments.forEach(seg => {
    if (seg.length === 1) {
      // Single point: just a marker, no line
      return;
    }
    const pathParts = seg.map((p, i) => {
      const x = xScale(p.x);
      const y = yScale(p.mood);
      return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
    });
    html += '<path d="' + pathParts.join(' ') + '" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  });
  
  // Data points (drawn on top of lines)
  moodPoints.forEach(p => {
    const x = xScale(p.x);
    const y = yScale(p.mood);
    const moodIdx = Math.max(0, Math.min(4, Math.round(p.mood) - 1));
    const color = MOOD_COLORS[moodIdx];
    html += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5" fill="' + color + '" class="chart-point-stroke" stroke-width="2"/>';
  });
  
  // FIX BUG #11: X-axis labels — show first, middle, last for clarity
  const labelIndices = [0, 4, 8, 11];
  labelIndices.forEach(i => {
    if (i >= trends.length) return;
    const x = xScale(i);
    const wkDate = trends[i].date;
    let anchor = 'middle';
    let textX = x;
    if (i === 0) { anchor = 'start'; textX = x - 2; }
    if (i === 11) { anchor = 'end'; textX = x + 2; }
    html += '<text x="' + textX + '" y="' + (h - 8) + '" text-anchor="' + anchor + '" font-size="11" class="chart-label">' + wkDate.toLocaleDateString('de-CH',{day:'2-digit',month:'short'}) + '</text>';
  });
  
  html += '</svg>';
  html += '</div>';
  
  // Stats below chart
  const moodAvg = moodPoints.reduce((s,p) => s + p.mood, 0) / moodPoints.length;
  const moodMin = Math.min(...moodPoints.map(p => p.mood));
  const moodMax = Math.max(...moodPoints.map(p => p.mood));
  html += '<div style="display:flex;justify-content:space-around;font-size:11px;color:var(--text-muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">';
  html += '<div>ø <strong style="color:var(--text);">' + moodAvg.toFixed(1) + '</strong></div>';
  html += '<div>min <strong style="color:var(--text);">' + moodMin.toFixed(1) + '</strong></div>';
  html += '<div>max <strong style="color:var(--text);">' + moodMax.toFixed(1) + '</strong></div>';
  html += '<div>Wochen <strong style="color:var(--text);">' + moodPoints.length + '/12</strong></div>';
  html += '</div>';
  
  html += '<div class="science-note"><span class="science-note-icon">🔬</span>Affective Forecasting (Wilson & Gilbert): Wir überschätzen Stimmungsschwankungen — Daten zeigen die Realität.</div>';
  html += '</div>';
  
  return html;
}

      const pctHigh = Math.round(c.highPct * 100);

      html += '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;">';
      html += '<span>' + c.habit.icon + ' ' + c.habit.label + '</span>';

      html += '<div style="flex:' + (100-pctHigh) + ';"></div>';
      html += '</div></div>';
    });
  } else {
    html += '<div style="font-size:12px;color:var(--text-muted);">Sammle mindestens 3 Hoch- und 3 Niedrig-Mood-Tage. Aktuell: ' + mood.highCount + ' hoch, ' + mood.lowCount + ' niedrig.</div>';
  }
  html += '<div class="science-note"><span class="science-note-icon">🔬</span>Mere-measurement effect: Allein das Tracken einer Aktivität verändert das Verhalten — sogar ohne explizite Intervention (Morwitz & Fitzsimons).</div>';
  html += '</div>';
  
  // A vs B Wochen
  html += '<div class="card">';
  html += '<div class="daily-card-title">🏠 ✈️ A vs B Wochen</div>';
  if (ab.aCount + ab.bCount >= 2) {
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">';
    html += '<div style="text-align:center;padding:12px;background:var(--bg);border-radius:10px;">';
    html += '<div style="font-size:11px;color:var(--text-muted);">🏠 A-WOCHEN</div>';
    html += '<div style="font-size:24px;font-weight:700;color:#10b981;margin:4px 0;">' + ab.aAvg + '%</div>';
    html += '<div style="font-size:11px;color:var(--text-muted);">' + ab.aCount + ' getrackt</div>';
    html += '</div>';
    html += '<div style="text-align:center;padding:12px;background:var(--bg);border-radius:10px;">';
    html += '<div style="font-size:11px;color:var(--text-muted);">✈️ B-WOCHEN</div>';
    html += '<div style="font-size:24px;font-weight:700;color:#f59e0b;margin:4px 0;">' + ab.bAvg + '%</div>';
    html += '<div style="font-size:11px;color:var(--text-muted);">' + ab.bCount + ' getrackt</div>';
    html += '</div>';
    html += '</div>';
    if (ab.uCount > 0) {
      html += '<div style="text-align:center;margin-top:10px;padding:8px;background:var(--bg);border-radius:8px;">';
      html += '<span style="font-size:11px;color:var(--text-muted);">🌴 ' + ab.uCount + ' Urlaubs-Woche' + (ab.uCount === 1 ? '' : 'n') + ' (Recovery — nicht im Score)</span>';
      html += '</div>';
    }
    const diff = ab.aAvg - ab.bAvg;
    if (Math.abs(diff) > 15) {
      html += '<div style="margin-top:10px;font-size:11px;color:var(--text-muted);">Realismus-Check: ' + diff + '% Differenz - das ist normal für IBN-Wochen</div>';
    }
  } else {
    html += '<div style="font-size:12px;color:var(--text-muted);">Sammle Daten in beiden Wochen-Typen</div>';
  }
  html += '<div class="science-note"><span class="science-note-icon">🔬</span>Kontext-Adaptierung (Wood & Neal): Habits sind kontext-abhängig. Zwei Ziele für zwei Realitäten ist wissenschaftlich solider als ein starres Standard-Ziel.</div>';
  html += '</div>';
  
  // Weekday pattern
  if (weekday) {
    html += '<div class="card">';
    html += '<div class="daily-card-title">📅 Wochentag-Muster</div>';
    html += '<div class="weekday-bars-wrap">';
    weekday.averages.forEach((avg, i) => {
      const cls = i === weekday.bestIdx ? 'best' : (i === weekday.worstIdx ? 'worst' : '');
      html += '<div class="weekday-bar-col">';
      html += '<div class="weekday-pct">' + (avg > 0 ? avg + '%' : '') + '</div>';
      html += '<div class="weekday-bar ' + cls + '" style="height:' + Math.max(3, avg) + '%;"></div>';
      html += '<div class="weekday-label-bottom">' + DAY_LABELS[i] + '</div>';
      html += '</div>';
    });
    html += '</div>';
    if (weekday.bestIdx >= 0 && weekday.worstIdx >= 0 && weekday.bestIdx !== weekday.worstIdx) {
      html += '<div style="font-size:11px;color:var(--text-muted);margin-top:8px;">';
      html += 'Stärkster Tag: <strong style="color:#10b981;">' + DAY_LABELS[weekday.bestIdx] + ' (' + weekday.averages[weekday.bestIdx] + '%)</strong> · ';
      html += 'Schwächster: <strong style="color:#ef4444;">' + DAY_LABELS[weekday.worstIdx] + ' (' + weekday.averages[weekday.worstIdx] + '%)</strong>';
      html += '</div>';
    }
    html += '<div class="science-note"><span class="science-note-icon">🔬</span>Implementation Intentions (Gollwitzer): Wenn du weißt <em>wann</em> du scheiterst, kannst du gezielt If-Then-Pläne setzen für genau diesen Tag.</div>';
    html += '</div>';
  }
  
  // Burnout Risk
  html += '<div class="card risk-card">';
  html += '<div class="daily-card-title">🚨 Burnout-Risiko</div>';
  if (risk.level === 'unknown') {
    html += '<div style="font-size:12px;color:var(--text-muted);">Sammle 2+ Wochen Daten</div>';
  } else {
    const riskIcons = { low: '✓', medium: '⚠️', high: '🚨' };
    const riskLabels = { low: 'Niedrig - alles im Lot', medium: 'Mittel - Warnzeichen', high: 'Hoch - Notbremse erwägen' };
    html += '<div class="risk-level-display">';
    html += '<div class="risk-indicator ' + risk.level + '">' + riskIcons[risk.level] + '</div>';
    html += '<div><div class="risk-text">' + riskLabels[risk.level] + '</div>';
    html += '<div style="font-size:11px;color:var(--text-muted);">Basis: letzte 3 Wochen';
    if (risk.recentVacation > 0) html += ' · 🌴 Recovery aktiv';
    html += '</div></div>';
    html += '</div>';
    if (risk.factors.length > 0) {
      html += '<div style="margin-top:12px;">';
      risk.factors.forEach(f => {
        html += '<div class="risk-factor">' + f.icon + ' ' + f.text + '</div>';
      });
      html += '</div>';
    }
    if (risk.recentVacation > 0 && risk.level !== 'high') {
      html += '<div style="margin-top:10px;padding:8px 10px;background:#ccfbf1;color:#134e4a;border-radius:6px;font-size:11px;">';
      html += '🌴 Kürzlicher Urlaub reduziert dein Risiko-Level um eine Stufe.';
      html += '</div>';
    }
  }
  html += '<div class="science-note"><span class="science-note-icon">🔬</span>Recovery Science (Stulberg & Magness): Stress + Rest = Growth. Stress allein = Burnout. Urlaub ist nicht Faulheit, sondern Periodisierung.</div>';
  html += '</div>';
  
  // 12-week trend bars
  html += '<div class="card">';
  html += '<div class="daily-card-title">📊 12-Wochen-Trend</div>';
  html += '<div class="trend-bars">';
  trends.forEach(t => {
    if (t.isVacation) {
      html += '<div class="trend-bar-col">';
      html += '<div class="trend-bar-pct">🌴</div>';
      html += '<div class="trend-bar" style="height:100%;background:#5eead4;"></div>';
      html += '<div class="trend-bar-type" style="color:#0d9488;">U</div>';
      html += '</div>';
      return;
    }
    const safeScore = t.score || 0;
    const cls = safeScore >= 70 ? 'high' : safeScore >= 50 ? 'mid' : safeScore > 0 ? 'low' : 'none';
    html += '<div class="trend-bar-col">';
    html += '<div class="trend-bar-pct">' + (safeScore > 0 ? safeScore : '') + '</div>';
    html += '<div class="trend-bar ' + cls + '" style="height:' + Math.max(2, safeScore) + '%;"></div>';
    html += '<div class="trend-bar-type ' + (t.type === 'A' ? 'A' : t.type === 'B' ? 'B' : '') + '">' + (t.type !== '?' ? t.type : '') + '</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="legend">';
  html += '<span><span class="legend-dot" style="background:var(--success)"></span>≥70%</span>';
  html += '<span><span class="legend-dot" style="background:var(--warning)"></span>50-69%</span>';
  html += '<span><span class="legend-dot" style="background:#f87171"></span>&lt;50%</span>';
  html += '<span><span class="legend-dot" style="background:#5eead4"></span>Urlaub</span>';
  html += '</div>';
  html += '<div class="science-note"><span class="science-note-icon">🔬</span>Goal Gradient Effect (Hull, 1932): Sichtbare Distanz zum Ziel motiviert exponentiell.</div>';
  html += '</div>';
  
  // Per-category heatmap
  ['body', 'output', 'social'].forEach(catId => {
    const cat = CATEGORIES[catId];
    const catHabits = HABITS.filter(h => h.cat === catId);
    html += '<div class="card">';
    html += '<div class="daily-card-title">' + cat.icon + ' ' + cat.label + ' · Heatmap 12W</div>';
    catHabits.forEach(h => {
      // Use target-based progress per week
      let progressSum = 0, weeksCount = 0;
      trends.forEach(w => {
        const wd = state.weeks[w.week];
        if (!wd) return;
        const target = getTarget(h, wd.type || 'A');
        if (target > 0) {
          progressSum += Math.min(1.0, (w.byHabit[h.id] || 0) / target);
          weeksCount++;
        }
      });
      const pct = weeksCount > 0 ? Math.round((progressSum/weeksCount)*100) : 0;
      html += '<div style="margin-bottom:8px;">';
      html += '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;">';
      html += '<span>' + h.icon + ' ' + h.label + '</span>';
      html += '<span style="font-weight:700;">' + pct + '%</span>';
      html += '</div>';
      html += '<div style="display:flex;gap:2px;height:16px;">';
      trends.forEach(w => {
        const c = w.byHabit[h.id] || 0;
        const wd = state.weeks[w.week];
        const target = wd ? getTarget(h, wd.type || 'A') : 7;
        const ratio = target > 0 ? c / target : 0;
        const op = ratio >= 0.9 ? '1' : ratio >= 0.5 ? '0.65' : ratio > 0 ? '0.3' : '0';
        const bg = c >= 1 ? h.color : 'var(--bg)';
        html += '<div style="flex:1;border-radius:2px;background:' + bg + ';opacity:' + (c >= 1 ? op : '1') + ';" title="' + w.week + ': ' + c + '/' + target + '"></div>';
      });
      html += '</div></div>';
    });
    html += '</div>';
  });
  
  return html;
}
