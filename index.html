<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<meta name="theme-color" content="#0a0f1c" media="(prefers-color-scheme: dark)">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- Icon: North Star Compass -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="mask-icon" href="icon.svg" color="#fbbf24">
<link rel="manifest" href="manifest.json">

<title>Lebens-Tracker</title>
<style>
:root {
  /* LIGHT THEME - "Studierzimmer" - warm, fokussiert, professionell */
  --bg: #fafaf9;
  --card-bg: #ffffff;
  --text: #1c1917;
  --text-muted: #78716c;
  --border: #e7e5e4;
  --border-strong: #d6d3d1;
  
  /* Akzentfarben - psychologisch optimiert */
  --accent: #2563eb;        /* Tiefes Blau: Konzentration, Vertrauen */
  --accent-strong: #1e3a8a; /* Marineblau: Tiefe, Seriosität */
  --success: #059669;       /* Smaragdgrün: Wachstum */
  --success-light: #10b981;
  --warning: #d97706;       /* Bernstein: Aufmerksamkeit ohne Stress */
  --warning-light: #f59e0b;
  --danger: #9f1239;        /* Burgund: Klare Warnung, nicht aggressiv */
  --danger-light: #dc2626;
  --recovery: #14b8a6;      /* Teal: Erholung, Frische */
  --recovery-light: #5eead4;
  --gold: #b45309;          /* Bernstein-Gold für North Star */
  --gold-light: #fcd34d;
}

[data-theme="dark"] {
  /* DARK THEME - "Konzentration" - tief, ruhig, energiesparend */
  --bg: #0a0f1c;
  --card-bg: #141b2d;
  --text: #f5f5f4;
  --text-muted: #a8a29e;
  --border: #292524;
  --border-strong: #44403c;
  
  /* Akzentfarben - heller für dunklen Hintergrund */
  --accent: #3b82f6;
  --accent-strong: #60a5fa;
  --success: #10b981;
  --success-light: #34d399;
  --warning: #f59e0b;
  --warning-light: #fbbf24;
  --danger: #ef4444;
  --danger-light: #f87171;
  --recovery: #2dd4bf;
  --recovery-light: #5eead4;
  --gold: #fbbf24;
  --gold-light: #fde68a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;  /* Modern: dynamic viewport, avoids iOS bar issues */
  padding-bottom: env(safe-area-inset-bottom);
  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  line-height: 1.5;
}
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px;
}
/* Responsive padding for small screens */
@media (max-width: 380px) {
  .container { padding: 12px; }
}
/* Slightly wider on larger screens for better use of space */
@media (min-width: 1200px) {
  .container { max-width: 1180px; padding: 24px; }
}

.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.sync-pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 4px 10px; border-radius: 999px;
  background: var(--card-bg); color: var(--text-muted);
  border: 1px solid var(--border);
}
.sync-pill.ok { color: var(--success); }
.sync-pill.warn { color: var(--warning); }
.sync-pill.error { color: var(--danger); }
.sync-pill .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.sync-pill.ok .dot { background: var(--success); }
.sync-pill.warn .dot { background: var(--warning); }
.sync-pill.error .dot { background: var(--danger); }
.sync-pill.idle .dot { background: var(--text-muted); }

.settings-btn {
  background: var(--card-bg);
  border: 1px solid var(--border);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  touch-action: manipulation;
  flex-shrink: 0;
  transition: transform 0.15s, background 0.15s;
}
.settings-btn:hover {
  background: var(--bg);
  transform: rotate(30deg);
}
.settings-btn:active {
  transform: rotate(60deg) scale(0.95);
}
@media (max-width: 480px) {
  .settings-btn {
    width: 32px;
    height: 32px;
    font-size: 14px;
  }
}

.tabs-wrap {
  position: relative;
  margin-bottom: 16px;
}
.tabs-wrap::after {
  content: '';
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 24px;
  background: linear-gradient(to right, transparent, var(--bg) 80%);
  pointer-events: none;
  border-radius: 0 12px 12px 0;
  opacity: 0;
  transition: opacity 0.2s;
}
.tabs-wrap.has-overflow::after {
  opacity: 1;
}
.tabs {
  display: flex;
  gap: 4px;
  background: var(--card-bg);
  padding: 4px;
  border-radius: 12px;
  border: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 0 0 auto;
  border: none;
  background: transparent;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  color: var(--text-muted);
  white-space: nowrap;
  transition: all 0.15s;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.tab-btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
  pointer-events: none;
}
.tab-btn svg .filled {
  fill: currentColor;
  stroke: none;
}
@media (max-width: 480px) {
  .tab-btn {
    padding: 8px 10px;
    font-size: 11px;
    gap: 4px;
  }
  .tab-btn svg {
    width: 14px;
    height: 14px;
  }
}
@media (min-width: 640px) {
  .tab-btn {
    flex: 1;
    justify-content: center;
  }
}
.tab-btn.active { background: var(--text); color: var(--bg); }

.card {
  background: var(--card-bg); border-radius: 14px; padding: 16px;
  margin-bottom: 12px; border: 1px solid var(--border);
  box-shadow: 0 1px 2px rgba(0,0,0,0.02);
}

/* VACATION MODE */
.vacation-card {
  background: linear-gradient(135deg, #ccfbf1 0%, #5eead4 100%);
  border: 1px solid #14b8a6;
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 12px;
  text-align: center;
  color: #134e4a;
}
[data-theme="dark"] .vacation-card {
    background: linear-gradient(135deg, rgba(20,184,166,0.2), rgba(13,148,136,0.1));
    border-color: #0d9488;
    color: #5eead4;
  }
.vacation-icon { font-size: 56px; margin-bottom: 8px; }
.vacation-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.vacation-subtitle { font-size: 13px; opacity: 0.8; margin-bottom: 18px; }
.vacation-check {
  background: rgba(255,255,255,0.4);
  border-radius: 10px;
  padding: 14px;
  margin: 16px 0;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}
.vacation-check-box {
  width: 24px; height: 24px;
  border-radius: 6px;
  border: 2px solid #134e4a;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
}
.vacation-check-box.done {
  background: #134e4a;
  border-color: #134e4a;
}
.vacation-info {
  font-size: 12px;
  opacity: 0.85;
  margin-top: 16px;
  line-height: 1.6;
}

/* FRESH START BANNER */
.fresh-start-banner {
  background: linear-gradient(135deg, #dbeafe, #93c5fd);
  border: 2px solid #2563eb;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
  color: #1e3a8a;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: alertSlideIn 0.5s ease-out;
}
[data-theme="dark"] .fresh-start-banner {
    background: rgba(37, 99, 235, 0.15);
    border-color: #3b82f6;
    color: #93c5fd;
  }
.fresh-start-icon { font-size: 28px; }
.fresh-start-title { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
.fresh-start-text { font-size: 12px; opacity: 0.9; }
.fresh-start-action {
  margin-left: auto;
  padding: 6px 12px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

/* IDENTITY REMINDER */
.identity-reminder {
  background: linear-gradient(135deg, #fef3c7, #fde68a);
  border: 1px solid #d97706;
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 12px;
  color: #78350f;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
[data-theme="dark"] .identity-reminder {
    background: rgba(217, 119, 6, 0.15);
    border-color: #d97706;
    color: #fcd34d;
  }
.identity-reminder-icon { font-size: 22px; }
.identity-reminder-text { font-weight: 600; line-height: 1.4; }
.identity-reminder-name { font-style: italic; opacity: 0.85; }

/* CALENDAR HEATMAP */
.calendar-heatmap-wrap {
  display: flex;
  gap: 4px;
  align-items: flex-start;
  margin: 12px 0;
}
.heatmap-day-labels {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: 16px;
  flex-shrink: 0;
}
.heatmap-day-label {
  font-size: 9px;
  color: var(--text-muted);
  height: 14px;
  display: flex;
  align-items: center;
  font-weight: 600;
}
.heatmap-grid {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}
.heatmap-week-labels {
  display: flex;
  gap: 2px;
  margin-bottom: 2px;
  height: 14px;
}
.heatmap-week-label {
  flex: 1;
  font-size: 9px;
  color: var(--text-muted);
  text-align: center;
  font-weight: 600;
}
.heatmap-row {
  display: flex;
  gap: 2px;
}
.heatmap-cell {
  flex: 1;
  height: 14px;
  border-radius: 3px;
  background: var(--bg);
  min-width: 0;
}
@media (min-width: 640px) {
  .heatmap-cell { height: 18px; border-radius: 4px; }
  .heatmap-week-labels { height: 18px; }
  .heatmap-week-label { font-size: 10px; }
}
.heatmap-cell.vacation {
  background: #5eead4 !important;
}
.heatmap-legend {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-muted);
  justify-content: flex-end;
  margin-top: 8px;
}
.heatmap-legend-cell {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}

/* RADAR CHART */
.radar-chart-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 16px 0;
  min-height: 220px;
}
.radar-chart-svg {
  width: 100%;
  max-width: 280px;
  height: auto;
}
@media (min-width: 640px) {
  .radar-chart-svg { max-width: 340px; }
}

/* MOOD LINE CHART */
.mood-line-wrap {
  width: 100%;
  margin: 12px 0;
}
.mood-line-svg {
  width: 100%;
  height: auto;
  display: block;
  max-width: 700px;
  margin: 0 auto;
}

/* CHART theme-aware elements */
.chart-grid {
  stroke: var(--border-strong);
  opacity: 0.4;
}
.chart-label {
  fill: var(--text-muted);
}
.chart-point-stroke {
  stroke: var(--card-bg);
}

/* SCIENCE NOTE - subtle insert */
.science-note {
  font-size: 11px;
  color: var(--text-muted);
  font-style: italic;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
  line-height: 1.5;
  opacity: 0.85;
}
.science-note-icon {
  font-style: normal;
  margin-right: 4px;
}

/* THEME SELECTOR */
.theme-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.theme-option {
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 14px 8px;
  cursor: pointer;
  text-align: center;
  font-family: inherit;
  color: inherit;
  transition: all 0.2s;
}
.theme-option:hover {
  border-color: var(--border-strong);
}
.theme-option.active {
  border-color: var(--accent);
  background: var(--card-bg);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
[data-theme="dark"] .theme-option.active {
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
}
.theme-option-icon { font-size: 24px; margin-bottom: 4px; }
.theme-option-label { font-size: 13px; font-weight: 700; }
.theme-option-desc { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

/* HABIT MANAGER */
.habit-manager-section {
  margin-bottom: 20px;
}
.habit-manager-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.habit-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  background: var(--bg);
  border-radius: 8px;
  margin-bottom: 6px;
}
.habit-row.fixed { opacity: 0.7; }
.habit-row-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  border: 1.5px solid;
  flex-shrink: 0;
}
.habit-row-info { flex: 1; min-width: 0; }
.habit-row-name { font-size: 13px; font-weight: 600; }
.habit-row-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.habit-row-actions { display: flex; gap: 4px; }
.habit-row-btn {
  background: transparent;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  color: inherit;
  font-family: inherit;
  /* Mobile: ensure WCAG/Apple HIG minimum tap target */
  min-height: 36px;
  min-width: 36px;
}
@media (hover: none) and (pointer: coarse) {
  .habit-row-btn { min-height: 44px; min-width: 44px; padding: 8px 12px; }
}
.habit-row-btn:hover { background: var(--card-bg); }
.habit-row-btn.danger { color: var(--danger); }
.habit-fixed-badge {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--border);
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 0.05em;
}

/* HABIT EDIT FORM */
.habit-form {
  background: var(--bg);
  border: 1px dashed var(--border-strong);
  border-radius: 10px;
  padding: 14px;
  margin-top: 10px;
}
.habit-form-row { margin-bottom: 10px; }
.habit-form-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.habit-form-input, .habit-form-select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  background: var(--card-bg);
  color: inherit;
}
.habit-form-targets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.habit-icon-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px;
  background: var(--card-bg);
  border-radius: 6px;
  max-height: 160px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.habit-icon-option {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  font-size: 18px;
  touch-action: manipulation;
}
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
}
.habit-icon-option.selected {
  border-color: var(--accent);
  background: var(--card-bg);
}
.habit-color-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.habit-color-option {
  width: 34px; height: 34px;
  border-radius: 7px;
  cursor: pointer;
  border: 2px solid transparent;
  touch-action: manipulation;
}
.habit-color-option.selected {
  border-color: var(--text);
}
.habit-form-actions {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}

/* NORTH STAR */
.north-star-card {
  background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
  border: 1px solid #fcd34d;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
[data-theme="dark"] .north-star-card {
    background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(217,119,6,0.1));
    border-color: #92400e;
  }
.north-star-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.north-star-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #92400e;
  display: flex;
  align-items: center;
  gap: 6px;
}
[data-theme="dark"] .north-star-label { color: #fcd34d; }
.north-star-edit {
  background: rgba(146, 64, 14, 0.1);
  border: none;
  color: #92400e;
  width: 26px; height: 26px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
[data-theme="dark"] .north-star-edit { background: rgba(252,211,77,0.15); color: #fcd34d; }
.north-star-text {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
  color: #78350f;
}
[data-theme="dark"] .north-star-text { color: #fef3c7; }
.north-star-empty {
  font-size: 13px;
  font-style: italic;
  color: #92400e;
  opacity: 0.7;
}
[data-theme="dark"] .north-star-empty { color: #fcd34d; }

/* STRUCTURED REFLECTION */
.reflection-fields {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.reflection-field-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.reflection-field-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.reflection-field-icon {
  font-size: 13px;
}
.reflection-field-input {
  width: 100%;
  padding: 8px 10px;
  font-family: inherit;
  font-size: 13px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: inherit;
  resize: none;

/* ALERT BANNERS - severity-based */
.alert-banner {
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
  font-size: 13px;
  border: 2px solid;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  position: relative;
  animation: alertSlideIn 0.4s ease-out;
}
@keyframes alertSlideIn {
  from { transform: translateY(-10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.alert-banner.high {
  background: linear-gradient(135deg, #fef2f2, #fee2e2);
  border-color: #dc2626;
  color: #7f1d1d;
  box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15);
  animation: alertSlideIn 0.4s ease-out, alertPulse 2s ease-in-out infinite;
}
@keyframes alertPulse {
  0%, 100% { box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15); }
  50% { box-shadow: 0 4px 20px rgba(220, 38, 38, 0.35); }
}
.alert-banner.medium {
  background: linear-gradient(135deg, #fefce8, #fef3c7);
  border-color: #f59e0b;
  color: #78350f;
}
.alert-banner.info {
  background: linear-gradient(135deg, #eff6ff, #dbeafe);
  border-color: #2563eb;
  color: #1e3a8a;
}
[data-theme="dark"] .alert-banner.high { background: rgba(220,38,38,0.18); border-color: #ef4444; color: #fca5a5; }
[data-theme="dark"] .alert-banner.medium { background: rgba(245,158,11,0.15); border-color: #f59e0b; color: #fcd34d; }
[data-theme="dark"] .alert-banner.info { background: rgba(37,99,235,0.15); border-color: #3b82f6; color: #93c5fd; }
.alert-icon {
  font-size: 22px;
  line-height: 1;
  flex-shrink: 0;
}
.alert-content { flex: 1; min-width: 0; }
.alert-title {
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.alert-type-badge {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 700;
  background: rgba(0,0,0,0.1);
  white-space: nowrap;
}
[data-theme="dark"] .alert-type-badge { background: rgba(255,255,255,0.1); }
.alert-text {
  font-size: 12px;
  line-height: 1.5;
  margin-bottom: 4px;
}
.alert-action {
  font-size: 12px;
  font-weight: 600;
  margin-top: 6px;
  padding: 6px 10px;
  background: rgba(0,0,0,0.06);
  border-radius: 6px;
  display: inline-block;
}
[data-theme="dark"] .alert-action { background: rgba(255,255,255,0.08); }
.alert-dismiss {
  background: transparent;
  border: none;
  color: inherit;
  opacity: 0.5;
  cursor: pointer;
  padding: 4px;
  font-size: 16px;
  line-height: 1;
  flex-shrink: 0;
}
.alert-dismiss:hover { opacity: 1; }

.info-box, .warn-box, .success-box {
  padding: 12px; border-radius: 10px; font-size: 12px; line-height: 1.5;
  border: 1px solid;
}
.info-box { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
.warn-box { background: #fef3c7; border-color: #fde68a; color: #92400e; }
.success-box { background: #d1fae5; border-color: #a7f3d0; color: #065f46; }
[data-theme="dark"] .info-box { background: rgba(59,130,246,0.1); border-color: #1e40af; color: #93c5fd; }
[data-theme="dark"] .warn-box { background: rgba(245,158,11,0.1); border-color: #92400e; color: #fcd34d; }
[data-theme="dark"] .success-box { background: rgba(16,185,129,0.1); border-color: #047857; color: #6ee7b7; }

.roadmap-item {
  display: flex; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid var(--border); font-size: 12px;
}
.roadmap-item:last-child { border-bottom: none; }
.roadmap-q { font-family: 'SF Mono', Menlo, monospace; color: var(--text-muted); width: 64px; flex-shrink: 0; font-size: 11px; }
.roadmap-focus { color: var(--accent); font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; width: 90px; flex-shrink: 0; }

ol { padding-left: 22px; }
ol li { margin-bottom: 6px; line-height: 1.5; }
/* Prevent overflow on long text strings (URLs, paths, long German words) */
.card, .wisdom-card, .north-star-card, .alert, p, .reflection-field, .goal-text,
.habit-row-name, .habit-row-meta {
  overflow-wrap: break-word;
  word-wrap: break-word;
  hyphens: auto;
  -webkit-hyphens: auto;
}

/* INSIGHTS desktop multi-column layout */
.insights-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
}
@media (min-width: 900px) {
  .insights-grid {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .insights-grid > .full-width {
    grid-column: 1 / -1;
  }
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* CALENDAR WIDGET */
.gcal-widget {
  background: linear-gradient(135deg, var(--card-bg) 0%, var(--bg) 100%);
  border: 1px solid var(--border);
  border-left: 3px solid #4285f4;
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
}
.gcal-widget-current {
  border-left-color: #ea4335;
  animation: gcalPulse 2s ease-in-out infinite;
}
@keyframes gcalPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0); }
  50% { box-shadow: 0 0 0 4px rgba(234, 67, 53, 0.08); }
}
.gcal-widget-icon {
  font-size: 22px;
  flex-shrink: 0;
}
.gcal-widget-content {
  flex: 1;
  min-width: 0;
}
.gcal-widget-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 2px;
}
.gcal-widget-title {
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.3;
}
.gcal-widget-time {
  font-size: 12px;
  color: var(--accent);
  font-weight: 600;
  margin-top: 2px;
}
.gcal-widget-empty {
  background: var(--bg);
  border: 1px dashed var(--border-strong);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 12px;
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
}
.gcal-widget-empty a {
  color: var(--accent);
  font-weight: 600;
  cursor: pointer;
  text-decoration: underline;
}

/* GCal settings card in Sync tab */
.gcal-setup {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-top: 10px;
}
.gcal-setup-input {
  width: 100%;
  padding: 10px 12px;
  margin: 4px 0 8px;
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  font-size: 13px;
  font-family: 'SF Mono', Menlo, monospace;
  background: var(--card-bg);
  color: inherit;
}
.gcal-setup-step {
  margin: 8px 0;
  font-size: 12px;
  line-height: 1.5;
}
.gcal-setup-step code {
  background: var(--card-bg);
  border: 1px solid var(--border);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 11px;
  word-break: break-all;
}
.gcal-status-connected {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: rgba(22,163,74,0.15);
  color: #15803d;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
[data-theme="dark"] .gcal-status-connected {
  background: rgba(22,163,74,0.2);
  color: #86efac;
}

/* CALENDAR TAB - month view */
.cal-month-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.cal-month-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.cal-nav-btn {
  background: var(--bg);
  border: 1px solid var(--border-strong);
  color: var(--text);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
}
.cal-nav-btn:hover { background: var(--card-bg); }
.cal-today-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 7px 14px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  margin-left: 8px;
  font-family: inherit;
}

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 4px;
}
.cal-weekday {
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  padding: 6px 0;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-day {
  aspect-ratio: 1 / 1;
  background: var(--bg);
  border-radius: 8px;
  padding: 4px 5px;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  min-height: 56px;
  cursor: pointer;
  touch-action: manipulation;
  position: relative;
  overflow: hidden;
  transition: transform 0.1s;
  border: 1px solid transparent;
}
.cal-day:hover { background: var(--card-bg); border-color: var(--border); }
.cal-day.other-month { opacity: 0.35; }
.cal-day.weekend { background: var(--card-bg); }
.cal-day.today {
  background: var(--accent);
  color: #fff;
  font-weight: 700;
}
.cal-day.today .cal-day-num { color: #fff; }
.cal-day.has-events { border-color: var(--border-strong); }
.cal-day.selected {
  border-color: var(--accent);
  border-width: 2px;
}
.cal-day-num {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1;
}
.cal-day-events-dots {
  display: flex;
  gap: 2px;
  flex-wrap: wrap;
  margin-top: auto;
}
.cal-day-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}
.cal-day.today .cal-day-dot { background: #fff; }
.cal-day-count {
  font-size: 9px;
  font-weight: 700;
  margin-top: 2px;
  opacity: 0.7;
}

@media (max-width: 480px) {
  .cal-day {
    min-height: 48px;
    padding: 3px 3px;
  }
  .cal-day-num { font-size: 12px; }
  .cal-day-dot { width: 4px; height: 4px; }
}

/* Selected day details */
.cal-day-detail {
  margin-top: 14px;
  background: var(--bg);
  border-radius: 10px;
  padding: 14px;
}
.cal-day-detail-title {
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 10px;
  color: var(--text);
}

/* Today's events list (used in Week tab + Calendar tab) */
.cal-event-item {
  display: flex;
  gap: 10px;
  padding: 8px 10px;
  margin-bottom: 6px;
  background: var(--card-bg);
  border-radius: 8px;
  border-left: 3px solid var(--accent);
  align-items: flex-start;
}
.cal-event-time {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  white-space: nowrap;
  min-width: 50px;
}
.cal-event-body {
  flex: 1;
  min-width: 0;
}
.cal-event-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
  overflow-wrap: break-word;
}
.cal-event-meta {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
}
.cal-event-current {
  border-left-color: #ea4335;
  background: rgba(234, 67, 53, 0.05);
}
[data-theme="dark"] .cal-event-current {
  background: rgba(234, 67, 53, 0.12);
}
.cal-event-past {
  opacity: 0.5;
}

/* SPORT TAB */
.sport-stopwatch {
  background: linear-gradient(135deg, var(--card-bg), var(--bg));
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  padding: 20px 16px;
  margin-bottom: 14px;
  text-align: center;
}
.sport-stopwatch-display {
  font-family: 'SF Mono', Menlo, 'Courier New', monospace;
  font-size: 44px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.04em;
  margin-bottom: 12px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.sport-stopwatch.running .sport-stopwatch-display { color: #16a34a; }
.sport-stopwatch-buttons {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}
.sport-sw-btn {
  padding: 10px 18px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 13px;
  border: 1.5px solid;
  cursor: pointer;
  font-family: inherit;
  touch-action: manipulation;
  min-width: 90px;
}
.sport-sw-btn.start { background: #16a34a; border-color: #16a34a; color: #fff; }
.sport-sw-btn.pause { background: #ea580c; border-color: #ea580c; color: #fff; }
.sport-sw-btn.reset { background: transparent; border-color: var(--border-strong); color: var(--text-muted); }
.sport-sw-btn:hover { opacity: 0.88; }

.sport-program-selector {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.sport-prog-pill {
  padding: 8px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--border-strong);
  background: transparent;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  color: var(--text-muted);
  font-family: inherit;
  touch-action: manipulation;
}
.sport-prog-pill.active {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

.sport-day-selector {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.sport-day-pill {
  flex: 1;
  min-width: 90px;
  padding: 9px 8px;
  border-radius: 10px;
  border: 1.5px solid var(--border-strong);
  background: var(--bg);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  color: var(--text);
  font-family: inherit;
  touch-action: manipulation;
  text-align: center;
}
.sport-day-pill.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.sport-exercise-card {
  background: var(--bg);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
}
.sport-exercise-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
  gap: 8px;
}
.sport-exercise-name {
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
  flex: 1;
  min-width: 0;
}
.sport-exercise-target {
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
  font-weight: 500;
}
.sport-exercise-note {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
  font-style: italic;
}
.sport-sets-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.sport-set-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1.5px solid var(--border-strong);
  background: var(--card-bg);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  touch-action: manipulation;
  min-height: 32px;
}
.sport-set-chip.done {
  background: #16a34a;
  border-color: #16a34a;
  color: #fff;
}
.sport-set-chip input {
  width: 32px;
  border: none;
  background: transparent;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  color: inherit;
  text-align: center;
  padding: 0;
}
.sport-set-chip input:focus { outline: 1px solid var(--accent); border-radius: 3px; }
.sport-set-chip-num {
  font-size: 9px;
  opacity: 0.6;
  margin-right: 2px;
  font-weight: 700;
}
.sport-set-chip .x { opacity: 0.5; }

.sport-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.sport-actions .btn { flex: 1; min-width: 110px; }

.sport-session-banner {
  background: rgba(22,163,74,0.12);
  border: 1px solid rgba(22,163,74,0.3);
  color: #16a34a;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
[data-theme="dark"] .sport-session-banner { background: rgba(22,163,74,0.18); color: #4ade80; }

.sport-history-item {
  background: var(--bg);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 6px;
  font-size: 12px;
  border: 1px solid var(--border);
}
.sport-history-date {
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}
.sport-history-meta {
  color: var(--text-muted);
  font-size: 11px;
}

.sport-pr-item {
  display: flex;
  justify-content: space-between;
  padding: 6px 10px;
  font-size: 12px;
  border-bottom: 1px dashed var(--border);
}
.sport-pr-item:last-child { border-bottom: none; }
.sport-pr-name { color: var(--text); font-weight: 500; }
.sport-pr-value { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }

/* Edit mode: action buttons row on each exercise */
.sport-exercise-actions {
  display: flex;
  gap: 4px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.sport-ex-icon-btn {
  background: var(--card-bg);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  width: 30px;
  height: 30px;
  padding: 0;
  cursor: pointer;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  font-family: inherit;
  color: var(--text);
}
.sport-ex-icon-btn:hover { background: var(--bg); }
.sport-ex-icon-btn.danger {
  color: #dc2626;
  border-color: rgba(220,38,38,0.3);
}
.sport-ex-icon-btn.danger:hover {
  background: rgba(220,38,38,0.08);
}

/* Inline exercise edit form */
.sport-form-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
}
.sport-form-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.sport-form-input {
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1.5px solid var(--border-strong);
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  box-sizing: border-box;
}
.sport-form-input:focus {
  outline: none;
  border-color: var(--accent);
}
.sport-form-hint {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
  font-style: italic;
}
.sport-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}
@media (max-width: 480px) {
  .sport-form-grid {
    grid-template-columns: 1fr 1fr;
  }
}

/* Toast - non-blocking confirmation after sport actions */
.sport-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(0);
  background: #16a34a;
  color: #fff;
  padding: 12px 20px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  z-index: 9999;
  max-width: 90%;
  text-align: center;
  opacity: 1;
  transition: opacity 0.3s, transform 0.3s;
}
.sport-toast.hide {
  opacity: 0;
  transform: translateX(-50%) translateY(20px);
}

@media (max-width: 480px) {
  .sport-stopwatch-display { font-size: 36px; }
  .sport-set-chip { font-size: 10px; padding: 4px 6px; }
  .sport-set-chip input { width: 28px; font-size: 10px; }
}

/* FINANCE TAB */
.fin-chart-tabs {
  display: flex;
  gap: 4px;
  background: var(--card-bg);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 14px;
}
.fin-chart-tab {
  flex: 1;
  border: none;
  background: transparent;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-muted);
  font-family: inherit;
  touch-action: manipulation;
  transition: all 0.15s;
}
.fin-chart-tab.active {
  background: var(--text);
  color: var(--bg);
}

.fin-kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}
@media (max-width: 480px) {
  .fin-kpi-grid {
    grid-template-columns: 1fr;
  }
}
.fin-kpi {
  background: var(--bg);
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.fin-kpi-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.fin-kpi-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.fin-kpi-value.positive { color: #16a34a; }
.fin-kpi-value.negative { color: #dc2626; }
.fin-kpi-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 3px;
}
.fin-kpi-trend {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  margin-left: 6px;
}
.fin-kpi-trend.up { color: #16a34a; }
.fin-kpi-trend.down { color: #dc2626; }

.fin-month-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 8px;
}
.fin-month-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.fin-month-nav-btn {
  background: var(--bg);
  border: 1px solid var(--border-strong);

<script>
// =============================================
// HABITS
// =============================================
// =============================================
// HABITS (mutable via Habits Tab)
// =============================================
const DEFAULT_HABITS = [
  { id: 'sleep', label: 'Schlaf vor 23h', icon: '🌙', cat: 'body', color: '#4338ca', targetA: 6, targetB: 4, fixed: true },
  { id: 'strength', label: 'Krafttraining', icon: '💪', cat: 'body', color: '#be123c', targetA: 3, targetB: 1, fixed: true },
  { id: 'cardio', label: 'Cardio', icon: '🏃', cat: 'body', color: '#c2410c', targetA: 2, targetB: 1, fixed: true },
  { id: 'water', label: 'Wasser ≥2.5L', icon: '💧', cat: 'body', color: '#0369a1', targetA: 7, targetB: 6, fixed: true },
  { id: 'nutrition', label: 'Ernährung gut', icon: '🥗', cat: 'body', color: '#15803d', targetA: 6, targetB: 4, fixed: true },
  { id: 'phd', label: 'PhD-Arbeit', icon: '🎓', cat: 'output', color: '#a16207', targetA: 4, targetB: 1, fixed: true },
  { id: 'portfolio', label: 'Portfolio', icon: '🛠', cat: 'output', color: '#a855f7', targetA: 3, targetB: 1, fixed: true },
  { id: 'reading', label: 'Lesen 10min', icon: '📖', cat: 'output', color: '#1d4ed8', targetA: 5, targetB: 3, fixed: true },
  { id: 'language', label: 'Spanisch', icon: '🇪🇸', cat: 'output', color: '#b91c1c', targetA: 4, targetB: 2, fixed: false, swappable: true },
  { id: 'social', label: 'Sozial', icon: '💛', cat: 'social', color: '#db2777', targetA: 3, targetB: 2, fixed: true },
];

// HABITS is rebuilt from state.customHabits + state.languageSlot overrides
let HABITS = DEFAULT_HABITS.slice();

function countHabitData(habitId) {
  let count = 0;
  Object.values(state.weeks).forEach(wd => {
    if (!wd.days) return;
    Object.values(wd.days).forEach(day => {
      if (day && day[habitId]) count++;
    });
  });
  return count;
}

function rebuildHabits() {
  const result = [];
  const seenIds = new Set();
  DEFAULT_HABITS.forEach(h => {
    if (seenIds.has(h.id)) return;
    seenIds.add(h.id);
    if (h.id === 'language' && state.languageSlot) {
      result.push({
        ...h,
        label: state.languageSlot.label || h.label,
        icon: state.languageSlot.icon || h.icon,
        color: state.languageSlot.color || h.color,
        targetA: state.languageSlot.targetA != null ? state.languageSlot.targetA : h.targetA,
        targetB: state.languageSlot.targetB != null ? state.languageSlot.targetB : h.targetB,
      });
    } else {

    }
  });
  (state.customHabits || []).forEach(ch => {
    if (!ch.id || seenIds.has(ch.id)) return;  // skip duplicates

    seenIds.add(ch.id);
    result.push({
      id: ch.id,
      label: ch.label,
      icon: ch.icon || '⭐',
      cat: ch.cat,
      color: ch.color || HABIT_COLORS[0],

      targetB: typeof ch.targetB === 'number' ? ch.targetB : 1,

      custom: true,

  });
  HABITS = result;
}

function getISOWeek(date) {
  const target = new Date(date.valueOf());
  const dayNr = (date.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = target.valueOf();
  target.setMonth(0, 1);
  if (target.getDay() !== 4) {
    target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
  }
  return 1 + Math.ceil((firstThursday - target) / 604800000);
}

function startOfWeek(d) {
  const x = new Date(d);
  const day = x.getDay();
  const diff = (day < 1 ? -6 : 1) - day;
  x.setDate(x.getDate() + diff);
  x.setHours(0,0,0,0);
  return x;
}
function fmtDate(d) {
  // Use local timezone, not UTC (Bug #10 fix)
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function weekKey(d) { return fmtDate(startOfWeek(d)); }
function getQuarter(d) { return d.getFullYear() + '-Q' + (Math.floor(d.getMonth()/3)+1); }
function todayDayIdx() { return (TODAY.getDay()+6)%7; }
function isCurrentWeek() { return weekKey(state.currentWeek) === weekKey(TODAY); }
function getDay(wd, idx) { return (wd.days && wd.days[idx]) || {}; }
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uuid() {
  return 'g' + Date.now().toString(36) + Math.random().toString(36).substring(2, 7);

function dayOfYear() {
  // Compute via date components, not ms subtraction (DST-safe)
  const month = TODAY.getMonth(); // 0-11
  const day = TODAY.getDate();
  const year = TODAY.getFullYear();
  const daysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  // Adjust for leap year
  const isLeap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
  let total = day;
  for (let i = 0; i < month; i++) {
    total += daysInMonth[i] + (i === 1 && isLeap ? 1 : 0);
  }
  return total;
}

// Initialize the OAuth token client (called once we have a clientId)
function gcalInitTokenClient() {
  if (!gisInited || !state.gcal.clientId) return;

// On load: if we have credentials AND were previously connected, try silent sign-in
function tryAutoConnectGcal() {
  if (!gcalIsReady()) return;
  if (!state.gcal.clientId || !state.gcal.apiKey) return;
  
  // Set API key
  try {
    gapi.client.setApiKey(state.gcal.apiKey);
  } catch(e) {

    return;
  }

  if (state.gcal.connected) {
    // Try silent token refresh (no popup). If it fails, the user will see
    // "Nicht verbunden" widget — they can manually re-connect. This is
    // expected behavior on long sessions (token expires after ~1h).
    gcalRequestToken(true).catch(err => {
      // Silently log; don't alert. Token expired or first-time silent attempt failed.
      console.info('Silent token refresh failed (expected if first time or expired):', err && err.type);
    });
  }
}

// Request OAuth token. silent=true uses prompt='none' (no popup, fails if not auth'd)
function gcalRequestToken(silent) {
  return new Promise((resolve, reject) => {
    if (!gcalTokenClient) {
      reject(new Error('Token client not initialized'));
      return;
    }
    gcalTokenClient.callback = (resp) => {
      if (resp.error) {
        if (!silent) console.error('Token error:', resp);
        state.gcal.connected = false;
        saveLocal();
        reject(resp);
        return;
      }
      state.gcal.connected = true;
      saveLocal();
      // Fetch events immediately
      gcalFetchEvents().then(resolve).catch(reject);
    };
    try {
      gcalTokenClient.requestAccessToken({ prompt: silent ? 'none' : 'consent' });
    } catch(e) {
      reject(e);
    }
  });
}

// Disconnect: revoke token, clear state
function gcalDisconnect() {
  const token = gapi.client.getToken();
  if (token && token.access_token) {
    try {
      google.accounts.oauth2.revoke(token.access_token, () => {});
    } catch(e) {}
    gapi.client.setToken('');
  }
  state.gcal.connected = false;
  state.gcal.events = [];
  state.gcal.lastFetch = null;
  if (gcalRefreshTimer) {
    clearInterval(gcalRefreshTimer);
    gcalRefreshTimer = null;
  }
  saveLocal();
  render();
}

// Fetch upcoming events from ALL calendars (covers current month + next month)
async function gcalFetchEvents() {
  if (!gapiInited || !state.gcal.connected) return [];
  
  try {
    // 1. Get calendar list
    const calListResp = await gapi.client.calendar.calendarList.list({ maxResults: 50 });
    const calendars = (calListResp.result && calListResp.result.items) || [];
    
    // 2. Time window: 7 days back (so today is shown even if half over) + 60 days forward
    // Covers current view's month + next month for calendar tab
    const now = new Date();
    const timeMin = new Date(now.getTime() - 7 * 24 * 3600 * 1000);
    const timeMax = new Date(now.getTime() + 60 * 24 * 3600 * 1000);
    
    const eventPromises = calendars
      .filter(c => c.selected !== false)
      .map(cal => 
        gapi.client.calendar.events.list({
          calendarId: cal.id,
          timeMin: timeMin.toISOString(),
          timeMax: timeMax.toISOString(),
          singleEvents: true,
          orderBy: 'startTime',
          maxResults: 250,
          showDeleted: false,
        }).then(resp => {
          const items = (resp.result && resp.result.items) || [];
          return items
            .filter(ev => ev && ev.start && (ev.start.dateTime || ev.start.date))
            .map(ev => ({
              id: cal.id + ':' + ev.id,
              title: ev.summary || '(ohne Titel)',
              start: ev.start.dateTime || ev.start.date,
              end: (ev.end && (ev.end.dateTime || ev.end.date)) || ev.start.dateTime || ev.start.date,
              allDay: !ev.start.dateTime,
              calendarName: cal.summary || '',
              calendarColor: cal.backgroundColor || '#7280f7',
              location: ev.location || '',
              description: ev.description || '',
            }));
        }).catch(e => {
          console.warn('Failed to fetch events from', cal.summary, e);
          return [];
        })
      );
    
    const allArrays = await Promise.all(eventPromises);
    const allEvents = allArrays.flat();
    allEvents.sort((a, b) => new Date(a.start) - new Date(b.start));
    
    state.gcal.events = allEvents;
    state.gcal.lastFetch = new Date().toISOString();
    saveLocal();
    
    return allEvents;
  } catch(e) {
    console.error('gcalFetchEvents failed:', e);
    // If 401, token expired — try silent refresh, then retry fetch once
    if (e.status === 401 || (e.result && e.result.error && e.result.error.code === 401)) {
      // Increment retry counter to prevent infinite loop
      gcalFetchRetries = (gcalFetchRetries || 0) + 1;
      if (gcalFetchRetries > 3) {
        // Permanent failure — clear connection and ask user to reconnect
        state.gcal.connected = false;
        gcalFetchRetries = 0;
        saveLocal();
        return [];
      }
      try {
        await gcalRequestToken(true);
      } catch(refreshErr) {
        // Silent refresh failed — token client may need user re-consent
        console.info('Silent refresh failed; user needs to reconnect');
        gcalFetchRetries = 0;
      }
    } else {
      // Non-auth error: reset counter, keep cached events
      gcalFetchRetries = 0;
    }
    return [];
  }
}
let gcalFetchRetries = 0;

// Schedule periodic refresh every 5 min
function gcalStartAutoRefresh() {
  if (gcalRefreshTimer) clearInterval(gcalRefreshTimer);
  gcalRefreshTimer = setInterval(() => {
    if (state.gcal.connected) gcalFetchEvents().then(() => render());
  }, 5 * 60 * 1000);
}

// Find the next upcoming event (not currently in progress, not past)
function gcalGetNextEvent() {
  if (!state.gcal.events || state.gcal.events.length === 0) return null;
  const now = new Date();
  const todayStr = fmtDate(now);
  return state.gcal.events.find(ev => {
    if (ev.allDay) {
      // All-day event: starts at midnight of ev.start date
      // It's "next" only if it's not today (today's allDay events are "current")
      // and start date is in the future
      const evDate = ev.start; // 'YYYY-MM-DD'
      return evDate > todayStr; // string compare works for ISO dates
    } else {
      const start = new Date(ev.start);
      return start > now;
    }
  }) || null;
}

// Find the event currently happening
function gcalGetCurrentEvent() {
  if (!state.gcal.events || state.gcal.events.length === 0) return null;
  const now = new Date();
  const todayStr = fmtDate(now);
  return state.gcal.events.find(ev => {
    if (ev.allDay) {
      // All-day event is "current" if today falls within [start, end)
      // (Google's end-date is exclusive)
      return ev.start <= todayStr && ev.end > todayStr;
    } else {
      const start = new Date(ev.start);
      const end = new Date(ev.end);
      return start <= now && now < end;
    }
  }) || null;
}

// Get all events on a specific date (YYYY-MM-DD)
function gcalGetEventsForDate(dateStr) {
  if (!state.gcal.events || state.gcal.events.length === 0) return [];
  const dayStart = new Date(dateStr + 'T00:00:00');
  const dayEnd = new Date(dateStr + 'T23:59:59');
  return state.gcal.events.filter(ev => {
    // All-day events have start.date (YYYY-MM-DD), not start.dateTime
    if (ev.allDay) {
      // All-day event: ev.start is date string, may span multiple days
      const evStart = new Date(ev.start + 'T00:00:00');
      const evEnd = new Date(ev.end + 'T00:00:00'); // end is exclusive
      return evStart <= dayEnd && evEnd > dayStart;
    } else {
      const evStart = new Date(ev.start);
      const evEnd = new Date(ev.end);
      return evStart <= dayEnd && evEnd > dayStart;
    }
  });
}

// Get events for today
function gcalGetTodayEvents() {
  return gcalGetEventsForDate(fmtDate(TODAY));
}

// Build month grid (6 rows × 7 days) for a given year/month
// Returns: array of {date: 'YYYY-MM-DD', isCurrentMonth: bool, isToday: bool, events: [...]}
function buildMonthGrid(year, month) {
  // month is 0-11
  const firstOfMonth = new Date(year, month, 1);
  // Find Monday of the week containing firstOfMonth
  const dayOfWeek = (firstOfMonth.getDay() + 6) % 7; // 0=Mon, 6=Sun
  const gridStart = new Date(year, month, 1 - dayOfWeek);
  
  const todayStr = fmtDate(TODAY);
  const grid = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getTime() + i * 24 * 3600 * 1000);
    const dateStr = fmtDate(d);
    grid.push({
      date: dateStr,
      day: d.getDate(),
      month: d.getMonth(),
      isCurrentMonth: d.getMonth() === month,
      isToday: dateStr === todayStr,
      isWeekend: d.getDay() === 0 || d.getDay() === 6,
      events: gcalGetEventsForDate(dateStr),
    });
  }
  return grid;
}

function formatTimeUntil(targetDate) {
  const now = new Date();
  const diffMs = new Date(targetDate) - now;
  if (diffMs < 0) return 'jetzt';
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 1) return 'gleich';
  if (diffMin < 60) return 'in ' + diffMin + ' Min';
  const diffH = Math.floor(diffMin / 60);
  const restMin = diffMin % 60;
  if (diffH < 24) {
    return 'in ' + diffH + 'h' + (restMin > 0 ? ' ' + restMin + 'm' : '');
  }
  return 'in ' + Math.floor(diffH / 24) + ' Tagen';
}

function formatEventTime(isoStr, allDay) {
  if (allDay) return 'Ganztägig';
  const d = new Date(isoStr);
  return d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
}

// =============================================
// VOCAB - Languages, SM-2 algorithm
// =============================================
const LANGUAGES = {
  'ch': { label: 'Schweizerdeutsch', flag: '🇨🇭', short: 'CH' },
  'en': { label: 'Englisch', flag: '🇬🇧', short: 'EN' },
  'es': { label: 'Spanisch', flag: '🇪🇸', short: 'ES' },
  'no': { label: 'Norwegisch', flag: '🇳🇴', short: 'NO' },
};

function vocabUuid() {
  // Use crypto.randomUUID if available (modern browsers)
  if (typeof crypto !== 'undefined' && crypto.randomUUID) {
    return 'v' + crypto.randomUUID().replace(/-/g, '').substring(0, 16);
  }
  // Fallback: extended random string for lower collision risk
  return 'v' + Date.now().toString(36) + Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 6);
}

function getVocabCards() {
  return state.vocab && state.vocab.cards ? state.vocab.cards : {};
}

function todayDateStr() {
  return fmtDate(TODAY);
}

// Convert date-string to days since epoch for due-date comparison
// Round to nearest integer to avoid DST fractional-day issues
function dateToEpochDay(dateStr) {
  if (!dateStr || typeof dateStr !== 'string') return 0;
  const parts = dateStr.split('-');
  if (parts.length !== 3) return 0;
  const y = parseInt(parts[0], 10);
  const m = parseInt(parts[1], 10);
  const d = parseInt(parts[2], 10);
  if (!isFinite(y) || !isFinite(m) || !isFinite(d)) return 0;
  return Math.round(new Date(y, m-1, d).getTime() / 86400000);
}

function addDaysToDate(dateStr, n) {
  if (!dateStr || typeof dateStr !== 'string') return fmtDate(new Date());
  const parts = dateStr.split('-');
  if (parts.length !== 3) return fmtDate(new Date());
  const y = parseInt(parts[0], 10);
  const m = parseInt(parts[1], 10);
  const d = parseInt(parts[2], 10);
  if (!isFinite(y) || !isFinite(m) || !isFinite(d)) return fmtDate(new Date());
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return fmtDate(dt);
}

// SM-2 ALGORITHM (Piotr Wozniak, 1987) + Anki-style learning steps
// quality: 0-5
//   0 = complete blackout
//   1 = incorrect, but answer remembered after seeing
//   2 = incorrect, but answer felt easy in hindsight
//   3 = correct, with serious difficulty
//   4 = correct, after hesitation
//   5 = perfect
//
// Behavior matches Anki philosophy:
// - "Easy" on a new card jumps straight to 4 days (skip learning steps)
// - "Good" on a new card: 1d → 6d → SM-2 intervals
// - "Hard" stays in learning longer
// - "Again" resets to learning step 1
const SM2_BOUNDS = {
  EF_MIN: 1.3,
  EF_MAX: 3.5,
  INTERVAL_MIN: 1,
  INTERVAL_MAX: 36500,
};

function sm2(card, quality) {
  let ef = (typeof card.ef === 'number' && isFinite(card.ef)) ? card.ef : 2.5;
  let interval = (typeof card.interval === 'number' && isFinite(card.interval) && card.interval > 0) ? card.interval : 0;
  let reps = (typeof card.reps === 'number' && isFinite(card.reps) && card.reps >= 0) ? Math.floor(card.reps) : 0;
  
  if (typeof quality !== 'number' || !isFinite(quality)) quality = 0;
  quality = Math.max(0, Math.min(5, Math.round(quality)));
  
  if (quality < 3) {
    // Failed: reset to learning
    reps = 0;
    interval = 1;
    // EF unchanged on failure
    return finalizeCard(ef, interval, reps);
  }
  
  // LEARNING STEPS for new cards (reps === 0 means card hasn't graduated yet)
  if (reps === 0) {
    if (quality === 5) {
      // Easy on new card: graduate immediately with 4 days
      interval = 4;
      reps = 2; // skip the second-review stage too
      ef = Math.round((ef + 0.15) * 1000) / 1000; // boost EF for easy
    } else if (quality === 4) {
      // Good on new card: 1 day, advance to next learning step
      interval = 1;
      reps = 1;
    } else {
      // Hard on new card: stay in learning, 1 day, EF drops
      interval = 1;
      reps = 1;
      ef = Math.round((ef - 0.15) * 1000) / 1000;
    }
  } else if (reps === 1) {
    // Second review — card is learning but not yet mature
    if (quality === 5) {
      // Easy: graduate with bigger interval
      interval = 7;
      reps = 2;
      ef = Math.round((ef + 0.15) * 1000) / 1000;
    } else if (quality === 4) {
      // Good: 6 days, classical SM-2
      interval = 6;
      reps = 2;
    } else {
      // Hard: 3 days, stay closer to learning
      interval = 3;
      reps = 2;
      ef = Math.round((ef - 0.15) * 1000) / 1000;
    }
  } else {
    // reps >= 2: classical SM-2 with EF multiplication
    if (quality === 5) {
      // Easy bonus: multiply by EF * 1.3
      interval = Math.ceil(interval * ef * 1.3);
      ef = Math.round((ef + 0.15) * 1000) / 1000;
    } else if (quality === 4) {
      // Good: classical SM-2
      interval = Math.ceil(interval * ef);
      // EF stays at the value, +0.1 per Wozniak (but capped)
      ef = Math.round((ef + 0.1) * 1000) / 1000;
    } else {
      // Hard: smaller increase, EF drops
      interval = Math.ceil(interval * 1.2);
      ef = Math.round((ef - 0.15) * 1000) / 1000;
    }
    reps += 1;
  }
  
  return finalizeCard(ef, interval, reps);
}

function finalizeCard(ef, interval, reps) {
  if (ef < SM2_BOUNDS.EF_MIN) ef = SM2_BOUNDS.EF_MIN;
  if (ef > SM2_BOUNDS.EF_MAX) ef = SM2_BOUNDS.EF_MAX;
  interval = Math.max(SM2_BOUNDS.INTERVAL_MIN, Math.min(SM2_BOUNDS.INTERVAL_MAX, Math.ceil(interval)));
  return { ef, interval, reps };
}

function reviewCard(cardId, quality) {
  const card = state.vocab.cards[cardId];
  if (!card) return;
  
  const result = sm2(card, quality);
  
  // Apply to card
  card.ef = result.ef;
  card.interval = result.interval;
  card.reps = result.reps;
  card.lastReview = todayDateStr();
  card.due = addDaysToDate(todayDateStr(), result.interval);
  
  // Track history
  if (!card.history) card.history = [];
  card.history.push({ date: todayDateStr(), q: quality, interval: result.interval });
  // Keep last 50 reviews to limit storage
  if (card.history.length > 50) card.history = card.history.slice(-50);
}

function getDueCards(today, applyLimit) {
  today = today || todayDateStr();
  if (applyLimit === undefined) applyLimit = true;
  const todayEpoch = dateToEpochDay(today);
  const cards = state.vocab.cards || {};
  const dueReview = [];
  const newCards = [];
  // Use Object.keys + index access; faster than Object.values for large objects
  const keys = Object.keys(cards);
  // Local cache for dateToEpochDay (saves ~50% time on duplicate due dates)
  const epochCache = {};
  for (let i = 0; i < keys.length; i++) {
    const c = cards[keys[i]];
    if (!c.due || c.reps === 0) {
      newCards.push(c);
    } else {
      let e = epochCache[c.due];
      if (e === undefined) e = epochCache[c.due] = dateToEpochDay(c.due);
      if (e <= todayEpoch) dueReview.push(c);
    }
  }
  // Sort review cards: most overdue first
  dueReview.sort((a, b) => (epochCache[a.due] || 0) - (epochCache[b.due] || 0));
  // Sort new cards: oldest first (encourages learning order)
  newCards.sort((a, b) => (a.created || '').localeCompare(b.created || ''));
  
  // SIBLING BURYING: if a card was already reviewed today, hide its sibling
  // (the other direction of the same word pair). Prevents seeing both
  // "Grüezi → Hallo" AND "Hallo → Grüezi" in the same session.
  const reviewedTodayBases = new Set();
  for (let i = 0; i < keys.length; i++) {
    const c = cards[keys[i]];
    if (c.lastReview === today) {
      const baseId = String(c.id || keys[i]).replace(/_[fb]$/, '');
      reviewedTodayBases.add(baseId);
    }
  }
  const filterSiblings = c => {
    const baseId = String(c.id || '').replace(/_[fb]$/, '');
    return !reviewedTodayBases.has(baseId);
  };
  const filteredReview = dueReview.filter(filterSiblings);
  const filteredNew = newCards.filter(filterSiblings);
  
  if (!applyLimit) {
    return [...filteredReview, ...filteredNew];
  }
  
  const limit = (state.vocab.settings && state.vocab.settings.dailyLimit) || 20;
  const newCardsLimited = filteredNew.slice(0, Math.max(0, limit));
  // Also cap review backlog. If 500+ overdue, user is overwhelmed.
  // Show only the 100 most-overdue per session — they can come back tomorrow.
  const reviewLimit = (state.vocab.settings && state.vocab.settings.reviewLimit) || 100;
  const reviewLimited = filteredReview.slice(0, Math.max(0, reviewLimit));
  return [...reviewLimited, ...newCardsLimited];
}

function getDueCardsCount() {
  const today = todayDateStr();
  const todayEpoch = dateToEpochDay(today);
  // Account for sibling burying in counts
  const reviewedTodayBases = new Set();
  Object.values(state.vocab.cards || {}).forEach(c => {
    if (c.lastReview === today) {
      const baseId = c.id.replace(/_[fb]$/, '');
      reviewedTodayBases.add(baseId);
    }
  });
  let due = 0, newCount = 0;
  Object.values(state.vocab.cards || {}).forEach(c => {
    const baseId = c.id.replace(/_[fb]$/, '');
    if (reviewedTodayBases.has(baseId)) return;  // skip sibling
    if (!c.due || c.reps === 0) newCount++;
    else if (dateToEpochDay(c.due) <= todayEpoch) due++;
  });
  return { due, newCount, total: due + newCount };
}

function getCardsByLanguage() {
  const cards = Object.values(state.vocab.cards || {});
  const byLang = { ch: [], en: [], es: [], no: [] };
  cards.forEach(c => {
    if (byLang[c.lang]) byLang[c.lang].push(c);
  });
  return byLang;
}

function getCardStatus(card) {
  if (!card.reps || card.reps === 0) return 'new';
  if (card.reps < 3) return 'learning';
  if (card.reps < 7) return 'review';
  return 'mature';
}

function addVocabPair(lang, source, target, force) {
  if (!state.vocab) state.vocab = { cards: {}, settings: {} };
  if (!state.vocab.cards) state.vocab.cards = {};
  
  // Defensive validation
  source = String(source || '').trim().slice(0, 500);
  target = String(target || '').trim().slice(0, 500);
  if (!source || !target) return { added: false, reason: 'empty' };
  if (!LANGUAGES[lang]) return { added: false, reason: 'invalid_lang' };
  
  // Duplicate detection (unless force=true)
  if (!force) {
    const sourceLower = source.toLowerCase();
    // Use cached index if available (for bulk imports), else linear scan
    let existing = null;
    if (state.vocab._dupIndex && state.vocab._dupIndex[lang + ':' + sourceLower]) {
      existing = state.vocab._dupIndex[lang + ':' + sourceLower];
    } else {
      existing = Object.values(state.vocab.cards).find(c => 
        c.dir === 'forward' && c.lang === lang && c.source && c.source.toLowerCase() === sourceLower
      );
    }
    if (existing) {
      return { added: false, reason: 'duplicate', existing };
    }
  }
  
  const now = todayDateStr();
  const baseId = vocabUuid();
  
  const fCard = {
    id: baseId + '_f',
    source, target, lang,
    dir: 'forward',
    ef: 2.5, interval: 0, reps: 0,
    due: null, lastReview: null,
    created: now,
    history: [],
  };
  state.vocab.cards[baseId + '_f'] = fCard;
  // Update index if active
  if (state.vocab._dupIndex) {
    state.vocab._dupIndex[lang + ':' + source.toLowerCase()] = fCard;
  }
  state.vocab.cards[baseId + '_b'] = {
    id: baseId + '_b',
    source, target, lang,
    dir: 'backward',
    ef: 2.5, interval: 0, reps: 0,
    due: null, lastReview: null,
    created: now,
    history: [],

}

function deleteVocabPair(cardId) {
  // Delete both forward and backward
  const baseId = cardId.replace(/_[fb]$/, '');
  const fCard = state.vocab.cards[baseId + '_f'];
  // Clean from index if active
  if (state.vocab._dupIndex && fCard && fCard.source && fCard.lang) {
    delete state.vocab._dupIndex[fCard.lang + ':' + fCard.source.toLowerCase()];
  }
  delete state.vocab.cards[baseId + '_f'];
  delete state.vocab.cards[baseId + '_b'];
}

// Build duplicate-detection index in O(n) once.
// Call before bulk import, call vocabClearDupIndex() after.
function vocabBuildDupIndex() {
  state.vocab._dupIndex = {};
  Object.values(state.vocab.cards || {}).forEach(c => {
    if (c.dir === 'forward' && c.source && c.lang) {
      state.vocab._dupIndex[c.lang + ':' + c.source.toLowerCase()] = c;
    }
  });
}

function vocabClearDupIndex() {
  if (state.vocab) delete state.vocab._dupIndex;
}

// Power-user bulk import. Pass an array of [source, target, lang] triples.
// Returns { added: number, duplicates: number, errors: number, rollback: function|null }.
// Exposed on window.vocabBulkAdd for use via DevTools.
function vocabBulkAdd(pairs) {
  if (!Array.isArray(pairs)) return { added: 0, duplicates: 0, errors: 1, rollback: null };
  
  // Snapshot existing card IDs so rollback can remove only newly-added cards
  const snapshotIds = new Set(Object.keys(state.vocab.cards || {}));
  
  vocabBuildDupIndex();
  let added = 0, duplicates = 0, errors = 0;
  for (let i = 0; i < pairs.length; i++) {
    const p = pairs[i];
    if (!Array.isArray(p) || p.length < 3) { errors++; continue; }
    const result = addVocabPair(p[2], p[0], p[1], false);
    if (result.added) added++;
    else if (result.reason === 'duplicate') duplicates++;
    else errors++;
  }
  vocabClearDupIndex();
  saveLocal();
  scheduleSync();
  
  // Provide rollback handle so user can undo a bad import
  const rollback = () => {
    let removed = 0;
    Object.keys(state.vocab.cards || {}).forEach(id => {
      if (!snapshotIds.has(id)) {
        delete state.vocab.cards[id];
        removed++;
      }
    });
    saveLocal();
    scheduleSync();
    return removed;
  };
  
  return { added, duplicates, errors, rollback };
}
if (typeof window !== 'undefined') {
  window.vocabBulkAdd = vocabBulkAdd;
}

// Validate and sanitize a vocab state object (from sync/import).
// Returns clean { cards, settings } object, dropping invalid entries.
// Validate sport data structure — defends against corrupted Gist imports
function validateSport(rawSport) {
  const result = {
    programs: {},
    activeProgram: 'ppl_beginner',
    activeDay: 'push',
    sessions: {},
    currentSession: null,
    stopwatch: { running: false, startMs: 0, elapsedMs: 0 },
  };
  if (!rawSport || typeof rawSport !== 'object') return result;
  
  // Validate programs
  if (rawSport.programs && typeof rawSport.programs === 'object') {
    Object.keys(rawSport.programs).forEach(progId => {
      const p = rawSport.programs[progId];
      if (!p || typeof p !== 'object' || !p.id || !p.name) return;
      const validProg = {
        id: String(p.id).slice(0, 50),
        name: String(p.name).slice(0, 100),
        author: String(p.author || '').slice(0, 100),
        source: String(p.source || '').slice(0, 200),
        description: String(p.description || '').slice(0, 500),
        days: {},
      };
      if (p.days && typeof p.days === 'object') {
        Object.keys(p.days).forEach(dayId => {
          const d = p.days[dayId];
          if (!d || typeof d !== 'object' || !d.id || !d.name) return;
          const validDay = {
            id: String(d.id).slice(0, 50),
            name: String(d.name).slice(0, 100),
            exercises: [],
          };
          if (Array.isArray(d.exercises)) {
            d.exercises.forEach(ex => {
              if (!ex || typeof ex !== 'object' || !ex.name) return;
              const sets = parseInt(ex.sets);
              validDay.exercises.push({
                name: String(ex.name).slice(0, 100),
                sets: (isNaN(sets) || sets < 1 || sets > 30) ? 3 : sets,
                reps: String(ex.reps || '').slice(0, 20),
                rest: String(ex.rest || '').slice(0, 30),
                note: String(ex.note || '').slice(0, 200),
              });
            });
          }
          if (validDay.exercises.length > 0 || Object.keys(d).length > 2) {
            // Keep empty days only if explicitly defined (for user-edited programs)
            validProg.days[validDay.id] = validDay;
          }
        });
      }
      if (Object.keys(validProg.days).length > 0) {
        result.programs[validProg.id] = validProg;
      }
    });
  }
  
  // Active program / day
  if (rawSport.activeProgram && result.programs[rawSport.activeProgram]) {
    result.activeProgram = rawSport.activeProgram;
  } else if (Object.keys(result.programs).length > 0) {
    result.activeProgram = Object.keys(result.programs)[0];
  }
  const activeProg = result.programs[result.activeProgram];
  if (activeProg) {
    if (rawSport.activeDay && activeProg.days[rawSport.activeDay]) {
      result.activeDay = rawSport.activeDay;
    } else {
      result.activeDay = Object.keys(activeProg.days)[0] || 'push';
    }
  }
  
  // Validate sessions
  if (rawSport.sessions && typeof rawSport.sessions === 'object') {
    Object.keys(rawSport.sessions).forEach(sid => {
      const s = rawSport.sessions[sid];
      if (!s || typeof s !== 'object' || !s.id) return;
      const validSess = {
        id: String(s.id).slice(0, 100),
        date: String(s.date || '').slice(0, 20),
        program: String(s.program || '').slice(0, 50),
        programName: String(s.programName || '').slice(0, 100),
        day: String(s.day || '').slice(0, 50),
        dayName: String(s.dayName || '').slice(0, 100),
        startedAt: String(s.startedAt || '').slice(0, 50),
        endedAt: s.endedAt ? String(s.endedAt).slice(0, 50) : null,
        durationSec: (typeof s.durationSec === 'number' && isFinite(s.durationSec) && s.durationSec >= 0) ? Math.floor(s.durationSec) : 0,
        notes: String(s.notes || '').slice(0, 2000),
        exercises: [],
      };
      if (Array.isArray(s.exercises)) {
        s.exercises.forEach(ex => {
          if (!ex || typeof ex !== 'object') return;
          const validEx = {
            name: String(ex.name || '').slice(0, 100),
            targetSets: (typeof ex.targetSets === 'number') ? ex.targetSets : 3,
            targetReps: String(ex.targetReps || '').slice(0, 20),
            rest: String(ex.rest || '').slice(0, 30),
            note: String(ex.note || '').slice(0, 200),
            sets: [],
          };
          if (Array.isArray(ex.sets)) {
            ex.sets.forEach(set => {
              if (!set || typeof set !== 'object') return;
              validEx.sets.push({
                reps: String(set.reps || '').slice(0, 10),
                weight: String(set.weight || '').slice(0, 10),
                done: !!set.done,
              });
            });
          }
          validSess.exercises.push(validEx);
        });
      }
      result.sessions[validSess.id] = validSess;
    });
  }
  
  // Current session
  if (rawSport.currentSession && typeof rawSport.currentSession === 'object') {
    // Validate as a session (reuse same logic conceptually)
    const cs = rawSport.currentSession;
    if (cs.id && Array.isArray(cs.exercises)) {
      result.currentSession = {
        id: String(cs.id).slice(0, 100),
        date: String(cs.date || '').slice(0, 20),
        program: String(cs.program || '').slice(0, 50),
        programName: String(cs.programName || '').slice(0, 100),
        day: String(cs.day || '').slice(0, 50),
        dayName: String(cs.dayName || '').slice(0, 100),
        startedAt: String(cs.startedAt || '').slice(0, 50),
        endedAt: null,
        durationSec: 0,
        notes: String(cs.notes || '').slice(0, 2000),
        exercises: cs.exercises.filter(ex => ex && typeof ex === 'object').map(ex => ({
          name: String(ex.name || '').slice(0, 100),
          targetSets: (typeof ex.targetSets === 'number') ? ex.targetSets : 3,
          targetReps: String(ex.targetReps || '').slice(0, 20),
          rest: String(ex.rest || '').slice(0, 30),
          note: String(ex.note || '').slice(0, 200),
          sets: (Array.isArray(ex.sets) ? ex.sets : []).filter(s => s && typeof s === 'object').map(set => ({
            reps: String(set.reps || '').slice(0, 10),
            weight: String(set.weight || '').slice(0, 10),
            done: !!set.done,
          })),
        })),
      };
    }
  }
  
  // Stopwatch
  if (rawSport.stopwatch && typeof rawSport.stopwatch === 'object') {
    const sw = rawSport.stopwatch;
    result.stopwatch = {
      running: !!sw.running,
      startMs: (typeof sw.startMs === 'number' && isFinite(sw.startMs)) ? sw.startMs : 0,
      elapsedMs: (typeof sw.elapsedMs === 'number' && isFinite(sw.elapsedMs) && sw.elapsedMs >= 0) ? sw.elapsedMs : 0,
    };
  }
  
  return result;
}

function validateVocab(rawVocab) {
  const result = {
    cards: {},
    settings: { dailyLimit: 20, reviewLimit: 100, activeLanguages: ['en', 'es', 'ch', 'no'] },
  };
  if (!rawVocab || typeof rawVocab !== 'object') return result;
  
  // Merge settings safely
  if (rawVocab.settings && typeof rawVocab.settings === 'object') {
    const s = rawVocab.settings;
    if (typeof s.dailyLimit === 'number' && s.dailyLimit > 0 && s.dailyLimit < 1000) {
      result.settings.dailyLimit = Math.floor(s.dailyLimit);
    }
    if (typeof s.reviewLimit === 'number' && s.reviewLimit > 0 && s.reviewLimit < 10000) {
      result.settings.reviewLimit = Math.floor(s.reviewLimit);
    }
    if (Array.isArray(s.activeLanguages)) {
      result.settings.activeLanguages = s.activeLanguages.filter(l => LANGUAGES[l]);
    }
    if (s.lastLang && LANGUAGES[s.lastLang]) {
      result.settings.lastLang = s.lastLang;
    }
  }
  
  // Validate each card
  const rawCards = (rawVocab.cards && typeof rawVocab.cards === 'object') ? rawVocab.cards : {};
  Object.keys(rawCards).forEach(cardId => {
    const c = rawCards[cardId];
    if (!c || typeof c !== 'object') return;
    if (!c.source || !c.target) return;
    if (!LANGUAGES[c.lang]) return;
    if (c.dir !== 'forward' && c.dir !== 'backward') return;
    result.cards[cardId] = {
      id: c.id || cardId,
      source: String(c.source).slice(0, 500),
      target: String(c.target).slice(0, 500),
      lang: c.lang,
      dir: c.dir,
      ef: (typeof c.ef === 'number' && isFinite(c.ef)) ? c.ef : 2.5,
      interval: (typeof c.interval === 'number' && isFinite(c.interval) && c.interval >= 0) ? c.interval : 0,
      reps: (typeof c.reps === 'number' && isFinite(c.reps) && c.reps >= 0) ? Math.floor(c.reps) : 0,
      due: c.due || null,
      lastReview: c.lastReview || null,
      created: c.created || todayDateStr(),
      history: Array.isArray(c.history) ? c.history.slice(-50) : [],
    };
  });
  return result;
}

// =============================================
// THEME SYSTEM
// =============================================
function applyTheme() {
  let effectiveTheme = state.theme;
  if (state.theme === 'auto') {
    effectiveTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', effectiveTheme);
  // Update ALL meta theme-color tags for iOS status bar consistency
  const color = effectiveTheme === 'dark' ? '#0a0f1c' : '#fafaf9';
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    m.setAttribute('content', color);
  });
}

// Watch system theme changes when in auto mode
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (state.theme === 'auto') applyTheme();
  });
}
