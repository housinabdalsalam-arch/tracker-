<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f1c" media="(prefers-color-scheme: dark)">
<meta http-equiv="Cache-Control" content="no-cache">

<!-- Icon: North Star Compass -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<title>Lebens-Tracker</title>
<style>
:root {
  /* LIGHT THEME - "Studierzimmer" - warm, fokussiert, professionell */
  --bg: #fafaf9;
  --card-bg: #ffffff;
  --text: #1c1917;
  --text-muted: #78716c;
  --border: #e7e5e4;
  --border-strong: #d6d3d1;
  
  /* Akzentfarben - psychologisch optimiert */
  --accent: #2563eb;        /* Tiefes Blau: Konzentration, Vertrauen */
  --accent-strong: #1e3a8a; /* Marineblau: Tiefe, Seriosität */
  --success: #059669;       /* Smaragdgrün: Wachstum */
  --success-light: #10b981;
  --warning: #d97706;       /* Bernstein: Aufmerksamkeit ohne Stress */
  --warning-light: #f59e0b;
  --danger: #9f1239;        /* Burgund: Klare Warnung, nicht aggressiv */
  --danger-light: #dc2626;
  --recovery: #14b8a6;      /* Teal: Erholung, Frische */
  --recovery-light: #5eead4;
  --gold: #b45309;          /* Bernstein-Gold für North Star */
  --gold-light: #fcd34d;
}

[data-theme="dark"] {
  /* DARK THEME - "Konzentration" - tief, ruhig, energiesparend */
  --bg: #0a0f1c;
  --card-bg: #141b2d;
  --text: #f5f5f4;
  --text-muted: #a8a29e;
  --border: #292524;
  --border-strong: #44403c;
  
  /* Akzentfarben - heller für dunklen Hintergrund */
  --accent: #3b82f6;
  --accent-strong: #60a5fa;
  --success: #10b981;
  --success-light: #34d399;
  --warning: #f59e0b;
  --warning-light: #fbbf24;
  --danger: #ef4444;
  --danger-light: #f87171;
  --recovery: #2dd4bf;
  --recovery-light: #5eead4;
  --gold: #fbbf24;
  --gold-light: #fde68a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;  /* Modern: dynamic viewport, avoids iOS bar issues */
  padding-bottom: env(safe-area-inset-bottom);
  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  line-height: 1.5;
}
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px;
}
/* Responsive padding for small screens */
@media (max-width: 380px) {
  .container { padding: 12px; }
}
/* Slightly wider on larger screens for better use of space */
@media (min-width: 1200px) {
  .container { max-width: 1180px; padding: 24px; }
}

.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.sync-pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 4px 10px; border-radius: 999px;
  background: var(--card-bg); color: var(--text-muted);
  border: 1px solid var(--border);
}
.sync-pill.ok { color: var(--success); }
.sync-pill.warn { color: var(--warning); }
.sync-pill.error { color: var(--danger); }
.sync-pill .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.sync-pill.ok .dot { background: var(--success); }
.sync-pill.warn .dot { background: var(--warning); }
.sync-pill.error .dot { background: var(--danger); }
.sync-pill.idle .dot { background: var(--text-muted); }

.tabs {
  display: flex; gap: 4px; background: var(--card-bg);
  padding: 4px; border-radius: 12px; margin-bottom: 16px;
  border: 1px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tab-btn {
  flex: 1; border: none; background: transparent; padding: 12px 8px;
  font-size: 13px; font-weight: 500; border-radius: 8px;
  cursor: pointer; color: var(--text-muted); white-space: nowrap;
  min-width: 64px; transition: all 0.15s;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  font-family: inherit;
}
@media (max-width: 480px) {
  .tab-btn {
    padding: 10px 4px;
    font-size: 11px;
    min-width: 56px;
  }
}
.tab-btn.active { background: var(--text); color: var(--bg); }

.card {
  background: var(--card-bg); border-radius: 14px; padding: 16px;
  margin-bottom: 12px; border: 1px solid var(--border);
  box-shadow: 0 1px 2px rgba(0,0,0,0.02);
}

/* VACATION MODE */
.vacation-card {
  background: linear-gradient(135deg, #ccfbf1 0%, #5eead4 100%);
  border: 1px solid #14b8a6;
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 12px;
  text-align: center;
  color: #134e4a;
}
[data-theme="dark"] .vacation-card {
    background: linear-gradient(135deg, rgba(20,184,166,0.2), rgba(13,148,136,0.1));
    border-color: #0d9488;
    color: #5eead4;
  }
.vacation-icon { font-size: 56px; margin-bottom: 8px; }
.vacation-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.vacation-subtitle { font-size: 13px; opacity: 0.8; margin-bottom: 18px; }
.vacation-check {
  background: rgba(255,255,255,0.4);
  border-radius: 10px;
  padding: 14px;
  margin: 16px 0;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}
.vacation-check-box {
  width: 24px; height: 24px;
  border-radius: 6px;
  border: 2px solid #134e4a;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
}
.vacation-check-box.done {
  background: #134e4a;
  border-color: #134e4a;
}
.vacation-info {
  font-size: 12px;
  opacity: 0.85;
  margin-top: 16px;
  line-height: 1.6;
}

/* FRESH START BANNER */
.fresh-start-banner {
  background: linear-gradient(135deg, #dbeafe, #93c5fd);
  border: 2px solid #2563eb;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
  color: #1e3a8a;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: alertSlideIn 0.5s ease-out;
}
[data-theme="dark"] .fresh-start-banner {
    background: rgba(37, 99, 235, 0.15);
    border-color: #3b82f6;
    color: #93c5fd;
  }
.fresh-start-icon { font-size: 28px; }
.fresh-start-title { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
.fresh-start-text { font-size: 12px; opacity: 0.9; }
.fresh-start-action {
  margin-left: auto;
  padding: 6px 12px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

/* IDENTITY REMINDER */
.identity-reminder {
  background: linear-gradient(135deg, #fef3c7, #fde68a);
  border: 1px solid #d97706;
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 12px;
  color: #78350f;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
[data-theme="dark"] .identity-reminder {
    background: rgba(217, 119, 6, 0.15);
    border-color: #d97706;
    color: #fcd34d;
  }
.identity-reminder-icon { font-size: 22px; }
.identity-reminder-text { font-weight: 600; line-height: 1.4; }
.identity-reminder-name { font-style: italic; opacity: 0.85; }

/* CALENDAR HEATMAP */
.calendar-heatmap-wrap {
  display: flex;
  gap: 4px;
  align-items: flex-start;
  margin: 12px 0;
}
.heatmap-day-labels {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: 16px;
  flex-shrink: 0;
}
.heatmap-day-label {
  font-size: 9px;
  color: var(--text-muted);
  height: 14px;
  display: flex;
  align-items: center;
  font-weight: 600;
}
.heatmap-grid {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}
.heatmap-week-labels {
  display: flex;
  gap: 2px;
  margin-bottom: 2px;
  height: 14px;
}
.heatmap-week-label {
  flex: 1;
  font-size: 9px;
  color: var(--text-muted);
  text-align: center;
  font-weight: 600;
}
.heatmap-row {
  display: flex;
  gap: 2px;
}
.heatmap-cell {
  flex: 1;
  height: 14px;
  border-radius: 3px;
  background: var(--bg);
  min-width: 0;
}
@media (min-width: 640px) {
  .heatmap-cell { height: 18px; border-radius: 4px; }
  .heatmap-week-labels { height: 18px; }
  .heatmap-week-label { font-size: 10px; }
}
.heatmap-cell.vacation {
  background: #5eead4 !important;
}
.heatmap-legend {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-muted);
  justify-content: flex-end;
  margin-top: 8px;
}
.heatmap-legend-cell {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}

/* RADAR CHART */
.radar-chart-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 16px 0;
  min-height: 220px;
}
.radar-chart-svg {
  width: 100%;
  max-width: 280px;
  height: auto;
}
@media (min-width: 640px) {
  .radar-chart-svg { max-width: 340px; }
}

/* MOOD LINE CHART */
.mood-line-wrap {
  width: 100%;
  margin: 12px 0;
}
.mood-line-svg {
  width: 100%;
  height: auto;
  display: block;
  max-width: 700px;
  margin: 0 auto;
}

/* CHART theme-aware elements */
.chart-grid {
  stroke: var(--border-strong);
  opacity: 0.4;
}
.chart-label {
  fill: var(--text-muted);
}
.chart-point-stroke {
  stroke: var(--card-bg);
}

/* SCIENCE NOTE - subtle insert */
.science-note {
  font-size: 11px;
  color: var(--text-muted);
  font-style: italic;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
  line-height: 1.5;
  opacity: 0.85;
}
.science-note-icon {
  font-style: normal;
  margin-right: 4px;
}

/* THEME SELECTOR */
.theme-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.theme-option {
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 14px 8px;
  cursor: pointer;
  text-align: center;
  font-family: inherit;
  color: inherit;
  transition: all 0.2s;
}
.theme-option:hover {
  border-color: var(--border-strong);
}
.theme-option.active {
  border-color: var(--accent);
  background: var(--card-bg);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
[data-theme="dark"] .theme-option.active {
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
}
.theme-option-icon { font-size: 24px; margin-bottom: 4px; }
.theme-option-label { font-size: 13px; font-weight: 700; }
.theme-option-desc { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

/* HABIT MANAGER */
.habit-manager-section {
  margin-bottom: 20px;
}
.habit-manager-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.habit-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  background: var(--bg);
  border-radius: 8px;
  margin-bottom: 6px;
}
.habit-row.fixed { opacity: 0.7; }
.habit-row-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  border: 1.5px solid;
  flex-shrink: 0;
}
.habit-row-info { flex: 1; min-width: 0; }
.habit-row-name { font-size: 13px; font-weight: 600; }
.habit-row-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.habit-row-actions { display: flex; gap: 4px; }
.habit-row-btn {
  background: transparent;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  color: inherit;
  font-family: inherit;
}
.habit-row-btn:hover { background: var(--card-bg); }
.habit-row-btn.danger { color: var(--danger); }
.habit-fixed-badge {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--border);
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 0.05em;
}

/* HABIT EDIT FORM */
.habit-form {
  background: var(--bg);
  border: 1px dashed var(--border-strong);
  border-radius: 10px;
  padding: 14px;
  margin-top: 10px;
}
.habit-form-row { margin-bottom: 10px; }
.habit-form-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.habit-form-input, .habit-form-select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  background: var(--card-bg);
  color: inherit;
}
.habit-form-targets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.habit-icon-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px;
  background: var(--card-bg);
  border-radius: 6px;
  max-height: 160px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.habit-icon-option {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  font-size: 18px;
  touch-action: manipulation;
}
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
}
.habit-icon-option.selected {
  border-color: var(--accent);
  background: var(--card-bg);
}
.habit-color-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.habit-color-option {
  width: 34px; height: 34px;
  border-radius: 7px;
  cursor: pointer;
  border: 2px solid transparent;
  touch-action: manipulation;
}
.habit-color-option.selected {
  border-color: var(--text);
}
.habit-form-actions {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}

/* NORTH STAR */
.north-star-card {
  background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
  border: 1px solid #fcd34d;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
[data-theme="dark"] .north-star-card {
    background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(217,119,6,0.1));
    border-color: #92400e;
  }
.north-star-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.north-star-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #92400e;
  display: flex;
  align-items: center;
  gap: 6px;
}
[data-theme="dark"] .north-star-label { color: #fcd34d; }
.north-star-edit {
  background: rgba(146, 64, 14, 0.1);
  border: none;
  color: #92400e;
  width: 26px; height: 26px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
[data-theme="dark"] .north-star-edit { background: rgba(252,211,77,0.15); color: #fcd34d; }
.north-star-text {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
  color: #78350f;
}
[data-theme="dark"] .north-star-text { color: #fef3c7; }
.north-star-empty {
  font-size: 13px;
  font-style: italic;
  color: #92400e;
  opacity: 0.7;
}
[data-theme="dark"] .north-star-empty { color: #fcd34d; }

/* STRUCTURED REFLECTION */
.reflection-fields {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.reflection-field-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.reflection-field-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.reflection-field-icon {
  font-size: 13px;
}
.reflection-field-input {
  width: 100%;
  padding: 8px 10px;
  font-family: inherit;
  font-size: 13px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: inherit;
  resize: none;
  min-height: 50px;
  line-height: 1.5;
}
.reflection-field-input:focus { outline: none; border-color: var(--accent); }
.wisdom-card {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  color: #f1f5f9;
  border: none;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 12px;
  position: relative;
}
@media (min-width: 640px) {
  .wisdom-card { padding: 20px 24px; }
}
.wisdom-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.wisdom-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #94a3b8;
}
.wisdom-refresh {
  background: rgba(255,255,255,0.08);
  border: none;
  color: #cbd5e1;
  width: 36px; height: 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  -webkit-touch-callout: none;
}
.wisdom-refresh:active { transform: scale(0.92); }
.wisdom-section {
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.wisdom-section:last-child { border-bottom: none; padding-bottom: 0; }
.wisdom-section:first-of-type { padding-top: 0; }
.wisdom-source {
  font-size: 10px;
  font-weight: 600;
  color: #cbd5e1;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.wisdom-source-icon { font-size: 13px; }
.wisdom-text-stoic {
  font-size: 14px;
  line-height: 1.55;
  color: #f1f5f9;
  font-style: italic;
}
.wisdom-author {
  font-size: 11px;
  color: #94a3b8;
  margin-top: 4px;
  font-style: normal;
}
.wisdom-text-quran {
  direction: rtl;
  text-align: right;
  font-family: 'Geeza Pro', 'Noto Naskh Arabic', 'Amiri', 'Traditional Arabic', serif;
  font-size: 22px;
  line-height: 2.2;
  color: #f1f5f9;
  margin-top: 4px;
  unicode-bidi: plaintext;
}
@media (min-width: 640px) {
  .wisdom-text-quran { font-size: 24px; line-height: 2.4; }
}
.wisdom-ref {
  font-size: 11px;
  color: #94a3b8;
  margin-top: 4px;
}

/* WEEK NAV */
.week-nav { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.nav-left { display: flex; align-items: center; gap: 4px; }
.icon-btn {
  background: transparent; border: none; padding: 8px; cursor: pointer;
  border-radius: 8px; color: inherit; font-size: 18px;
  min-width: 44px; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  font-family: inherit;
}
.icon-btn:hover { background: var(--bg); }
.week-label { min-width: 140px; text-align: center; }
.week-date { font-size: 13px; font-weight: 600; }
.week-meta { font-size: 11px; color: var(--text-muted); }
.today-btn {
  border: none; background: transparent; color: var(--accent);
  font-size: 12px; cursor: pointer; padding: 8px 12px; font-weight: 600;
  border-radius: 6px;
  touch-action: manipulation;
  font-family: inherit;
  min-height: 36px;
}

.week-type-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 8px; font-size: 13px;
  font-weight: 600; border: none; cursor: pointer;
}
.week-type-toggle.A { background: #d1fae5; color: #065f46; }
.week-type-toggle.B { background: #fef3c7; color: #92400e; }
.week-type-toggle.U { background: #ccfbf1; color: #134e4a; }
[data-theme="dark"] .week-type-toggle.A { background: rgba(16,185,129,0.15); color: #6ee7b7; }
[data-theme="dark"] .week-type-toggle.B { background: rgba(245,158,11,0.15); color: #fcd34d; }
[data-theme="dark"] .week-type-toggle.U { background: rgba(20,184,166,0.15); color: #5eead4; }

.score-box { text-align: right; }
.score-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.score-value { font-size: 22px; font-weight: 700; line-height: 1; }

.category-header {
  display: flex; align-items: center; gap: 8px;
  margin: 12px 0 8px;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-muted);
}

.habit-grid-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.habit-grid { width: 100%; min-width: 500px; border-collapse: separate; border-spacing: 0; }
@media (min-width: 540px) {
  .habit-grid { min-width: 540px; }
}
.habit-grid th {
  font-size: 10px; font-weight: 600; color: var(--text-muted);
  padding: 4px 2px; text-transform: uppercase; letter-spacing: 0.05em;
  text-align: center;
}
.habit-grid th.today-th { color: var(--accent); font-weight: 700; }
.habit-grid th.today-th .day-num {
  background: var(--accent); color: #fff; border-radius: 50%;
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  margin-top: 2px; font-size: 11px;
}
.habit-grid th .day-num { font-size: 10px; display: inline-block; margin-top: 2px; font-weight: 700; }
.habit-grid td { padding: 4px 2px; vertical-align: middle; }

.habit-name-cell { padding: 6px 6px 6px 0 !important; min-width: 120px; }
@media (min-width: 540px) {
  .habit-name-cell { min-width: 150px; padding-left: 0 !important; padding-right: 8px !important; }
}
.habit-info { display: flex; align-items: center; gap: 8px; }
.habit-icon {
  width: 26px; height: 26px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
  background: var(--bg);
  border: 1.5px solid var(--border-strong);
}
.habit-text { min-width: 0; }
.habit-name { font-size: 13px; font-weight: 600; }
.habit-streak {
  font-size: 10px; color: #ea580c;
  display: flex; align-items: center; gap: 2px;
}

.habit-btn-cell { text-align: center; padding: 3px 1px; }

.week-sum {
  font-size: 13px; font-weight: 700; text-align: center;
  color: var(--text-muted); padding-left: 6px !important;
}

.daily-row { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
@media (min-width: 640px) { .daily-row { grid-template-columns: 1fr 1fr; } }

.daily-card-title {
  font-size: 13px; font-weight: 700; margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}

.mood-day-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.mood-day-row:last-child { border-bottom: none; }
.mood-day-label {
  font-size: 12px; font-weight: 600; min-width: 36px;
  color: var(--text-muted);
}
.mood-day-label.today { color: var(--accent); font-weight: 700; }
.mood-scale { display: flex; gap: 4px; flex: 1; justify-content: space-between; }
.mood-btn {
  flex: 1; height: 40px;
  border: 1.5px solid var(--border-strong);
  background: var(--card-bg);
  border-radius: 7px; cursor: pointer; font-size: 18px;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  display: flex; align-items: center; justify-content: center;
  padding: 0; color: var(--text);
}
.mood-btn:disabled { opacity: 0.3; cursor: not-allowed; }

textarea {
  width: 100%; padding: 10px;
  font-family: inherit; font-size: 13px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  resize: none; color: inherit; line-height: 1.5;
}
textarea:focus { outline: none; border-color: var(--accent); }

.daily-notes-container { display: flex; flex-direction: column; gap: 8px; }
.day-note-row { display: flex; align-items: flex-start; gap: 8px; }
.day-note-label {
  width: 36px; font-size: 11px; font-weight: 700;
  color: var(--text-muted); padding-top: 8px;
  flex-shrink: 0; text-transform: uppercase;
}
.day-note-label.today { color: var(--accent); }
.day-note-input {
  flex: 1; padding: 6px 10px;
  font-family: inherit; font-size: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: inherit; resize: none; min-height: 32px;
}
.day-note-input:focus { outline: none; border-color: var(--accent); }

.progress-row { margin-bottom: 10px; }
.progress-head { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
.progress-track { height: 6px; background: var(--bg); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 999px; transition: width 0.3s; }

/* INSIGHTS TAB */
.insight-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
@media (min-width: 640px) {
  .insight-grid { grid-template-columns: 1fr 1fr; }
}

.trajectory-score-card {
  text-align: center;
  padding: 20px 16px;
}
.trajectory-score-big {
  font-size: 56px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.04em;
}
.trajectory-score-label {
  font-size: 14px;
  font-weight: 600;
  margin-top: 6px;
  letter-spacing: 0.02em;
}
.trajectory-score-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 8px;
}
.trajectory-breakdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 16px;
  font-size: 11px;
}
.trajectory-breakdown-item {
  text-align: center;
  padding: 6px;
  background: var(--bg);
  border-radius: 8px;
}
.trajectory-breakdown-val {
  font-weight: 700;
  font-size: 16px;
  display: block;
  line-height: 1.2;
}
.trajectory-breakdown-lbl {
  font-size: 9px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 2px;
  display: block;
}

.metric-big-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.metric-big-val { font-size: 28px; font-weight: 800; }
.metric-big-icon { font-size: 24px; }

.pillar-bar-wrap { margin-bottom: 8px; }
.pillar-bar-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  margin-bottom: 4px;
}
.pillar-bar-track {
  height: 10px;
  background: var(--bg);
  border-radius: 999px;
  overflow: hidden;
}
.pillar-bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.4s;
}

.lever-habit {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.lever-habit:last-child { border-bottom: none; }
.lever-rank {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  background: var(--bg);
  color: var(--text-muted);
}
.lever-rank.gold { background: #fbbf24; color: #78350f; }
.lever-rank.silver { background: #cbd5e1; color: #1e293b; }
.lever-rank.bronze { background: #fb923c; color: #7c2d12; }
.lever-content { flex: 1; }
.lever-name { font-size: 13px; font-weight: 600; }
.lever-lift { font-size: 11px; color: var(--text-muted); }

.correlation-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
}

.weekday-bars-wrap {
  display: flex;
  gap: 4px;
  align-items: flex-end;
  height: 90px;
  margin: 10px 0;
}
.weekday-bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.weekday-bar {
  width: 100%;
  background: var(--accent);
  border-radius: 4px 4px 0 0;
  min-height: 3px;
}
.weekday-bar.best { background: #10b981; }
.weekday-bar.worst { background: #ef4444; }
.weekday-label-bottom {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 600;
}
.weekday-pct {
  font-size: 9px;
  color: var(--text-muted);
  min-height: 12px;
}

.risk-card { padding: 16px; }
.risk-level-display {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.risk-indicator {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}
.risk-indicator.low { background: #d1fae5; color: #065f46; }
.risk-indicator.medium { background: #fef3c7; color: #92400e; }
.risk-indicator.high { background: #fee2e2; color: #991b1b; }
[data-theme="dark"] .risk-indicator.low { background: rgba(16,185,129,0.15); }
[data-theme="dark"] .risk-indicator.medium { background: rgba(245,158,11,0.15); }
[data-theme="dark"] .risk-indicator.high { background: rgba(239,68,68,0.15); }
.risk-text { font-size: 14px; font-weight: 600; }
.risk-factor {
  font-size: 12px;
  padding: 6px 10px;
  background: var(--bg);
  border-radius: 6px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* TRENDS */
.trend-bars { display: flex; align-items: flex-end; height: 140px; gap: 3px; margin: 12px 0; }
.trend-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.trend-bar-pct { font-size: 9px; color: var(--text-muted); font-weight: 600; min-height: 12px; }
.trend-bar { width: 100%; min-height: 3px; border-radius: 3px 3px 0 0; }
.trend-bar.high { background: var(--success); }
.trend-bar.mid { background: var(--warning); }
.trend-bar.low { background: #f87171; }
.trend-bar.none { background: var(--border); }
.trend-bar-type { font-size: 9px; }
.trend-bar-type.A { color: var(--success); }
.trend-bar-type.B { color: var(--warning); }
.legend { display: flex; gap: 12px; font-size: 11px; flex-wrap: wrap; margin-top: 8px; }
.legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

/* GOALS */
.goal-item {
  border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; margin-bottom: 8px;
  display: flex; gap: 10px; align-items: flex-start;
}
.goal-item.done { background: #ecfdf5; border-color: #a7f3d0; }
[data-theme="dark"] .goal-item.done { background: rgba(16,185,129,0.1); border-color: #047857; }
.goal-content { flex: 1; min-width: 0; }
.goal-cat {
  font-size: 10px; color: var(--text-muted);
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em;
}
.goal-text { font-size: 13px; margin-top: 2px; cursor: pointer; word-break: break-word; }
.goal-text.empty { color: var(--text-muted); font-style: italic; }
.goal-text.done-text { text-decoration: line-through; opacity: 0.7; }
.goal-delete-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 8px;
  font-size: 16px;
  opacity: 0.5;
  min-width: 36px;
  min-height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  touch-action: manipulation;
}
.goal-delete-btn:hover { opacity: 1; color: var(--danger); }

.add-goal-form {
  background: var(--bg);
  border-radius: 10px;
  padding: 12px;
  margin-top: 12px;
  border: 1px dashed var(--border-strong);
}
.add-goal-row { margin-bottom: 8px; }
.add-goal-row:last-child { margin-bottom: 0; }
.add-goal-title-input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  background: var(--card-bg);
  color: inherit;
}
.add-goal-cat-select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  font-size: 12px;
  font-family: inherit;
  background: var(--card-bg);
  color: inherit;
}
.add-goal-btn-row {
  display: flex;
  gap: 6px;
}

.btn {
  padding: 8px 14px;
  border: 1px solid var(--border-strong);
  background: var(--card-bg);
  border-radius: 8px;
  font-size: 13px; font-weight: 600;
  cursor: pointer; margin-right: 6px; margin-bottom: 6px;
  color: inherit; font-family: inherit;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--text); color: var(--card-bg); border-color: var(--text); }
.btn.success { background: var(--success); color: #fff; border-color: var(--success); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 6px 10px; font-size: 12px; }
.btn.full { width: 100%; margin: 0; }

.suggested-goals { margin-top: 14px; }
.suggested-title {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}
.suggested-goal {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: var(--bg);
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.1s;
}
.suggested-goal:hover {
  background: var(--border);
}
.suggested-goal-plus {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--text);
  color: var(--card-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
  flex-shrink: 0;
}

/* SYNC */
.input-row { margin-bottom: 10px; }
.input-label {
  display: block; font-size: 11px; font-weight: 700;
  margin-bottom: 4px; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-muted);
}
.text-input {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: 8px; font-size: 13px;
  font-family: inherit; color: inherit; background: inherit;
}
.help-text { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-top: 4px; }
.help-text code { background: var(--bg); padding: 1px 5px; border-radius: 3px; font-size: 11px; font-family: 'SF Mono', Menlo, monospace; }
.status-line {
  display: flex; align-items: center; gap: 8px; font-size: 13px;
  padding: 10px; background: var(--bg); border-radius: 8px;
  margin-bottom: 10px; flex-wrap: wrap;
}

/* ALERT BANNERS - severity-based */
.alert-banner {
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
  font-size: 13px;
  border: 2px solid;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  position: relative;
  animation: alertSlideIn 0.4s ease-out;
}
@keyframes alertSlideIn {
  from { transform: translateY(-10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.alert-banner.high {
  background: linear-gradient(135deg, #fef2f2, #fee2e2);
  border-color: #dc2626;
  color: #7f1d1d;
  box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15);
  animation: alertSlideIn 0.4s ease-out, alertPulse 2s ease-in-out infinite;
}
@keyframes alertPulse {
  0%, 100% { box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15); }
  50% { box-shadow: 0 4px 20px rgba(220, 38, 38, 0.35); }
}
.alert-banner.medium {
  background: linear-gradient(135deg, #fefce8, #fef3c7);
  border-color: #f59e0b;
  color: #78350f;
}
.alert-banner.info {
  background: linear-gradient(135deg, #eff6ff, #dbeafe);
  border-color: #2563eb;
  color: #1e3a8a;
}
[data-theme="dark"] .alert-banner.high { background: rgba(220,38,38,0.18); border-color: #ef4444; color: #fca5a5; }
[data-theme="dark"] .alert-banner.medium { background: rgba(245,158,11,0.15); border-color: #f59e0b; color: #fcd34d; }
[data-theme="dark"] .alert-banner.info { background: rgba(37,99,235,0.15); border-color: #3b82f6; color: #93c5fd; }
.alert-icon {
  font-size: 22px;
  line-height: 1;
  flex-shrink: 0;
}
.alert-content { flex: 1; min-width: 0; }
.alert-title {
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.alert-type-badge {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 700;
  background: rgba(0,0,0,0.1);
  white-space: nowrap;
}
[data-theme="dark"] .alert-type-badge { background: rgba(255,255,255,0.1); }
.alert-text {
  font-size: 12px;
  line-height: 1.5;
  margin-bottom: 4px;
}
.alert-action {
  font-size: 12px;
  font-weight: 600;
  margin-top: 6px;
  padding: 6px 10px;
  background: rgba(0,0,0,0.06);
  border-radius: 6px;
  display: inline-block;
}
[data-theme="dark"] .alert-action { background: rgba(255,255,255,0.08); }
.alert-dismiss {
  background: transparent;
  border: none;
  color: inherit;
  opacity: 0.5;
  cursor: pointer;
  padding: 4px;
  font-size: 16px;
  line-height: 1;
  flex-shrink: 0;
}
.alert-dismiss:hover { opacity: 1; }

.info-box, .warn-box, .success-box {
  padding: 12px; border-radius: 10px; font-size: 12px; line-height: 1.5;
  border: 1px solid;
}
.info-box { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
.warn-box { background: #fef3c7; border-color: #fde68a; color: #92400e; }
.success-box { background: #d1fae5; border-color: #a7f3d0; color: #065f46; }
[data-theme="dark"] .info-box { background: rgba(59,130,246,0.1); border-color: #1e40af; color: #93c5fd; }
[data-theme="dark"] .warn-box { background: rgba(245,158,11,0.1); border-color: #92400e; color: #fcd34d; }
[data-theme="dark"] .success-box { background: rgba(16,185,129,0.1); border-color: #047857; color: #6ee7b7; }

.roadmap-item {
  display: flex; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid var(--border); font-size: 12px;
}
.roadmap-item:last-child { border-bottom: none; }
.roadmap-q { font-family: 'SF Mono', Menlo, monospace; color: var(--text-muted); width: 64px; flex-shrink: 0; font-size: 11px; }
.roadmap-focus { color: var(--accent); font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; width: 90px; flex-shrink: 0; }

ol { padding-left: 22px; }
ol li { margin-bottom: 6px; line-height: 1.5; }
/* Prevent overflow on long text strings (URLs, paths, long German words) */
.card, .wisdom-card, .north-star-card, .alert, p, .reflection-field, .goal-text,
.habit-row-name, .habit-row-meta {
  overflow-wrap: break-word;
  word-wrap: break-word;
  hyphens: auto;
  -webkit-hyphens: auto;

];

// HABITS is rebuilt from state.customHabits + state.languageSlot overrides
let HABITS = DEFAULT_HABITS.slice();

function countHabitData(habitId) {
  let count = 0;
  Object.values(state.weeks).forEach(wd => {
    if (!wd.days) return;
    Object.values(wd.days).forEach(day => {
      if (day && day[habitId]) count++;
    });
  });
  return count;
}

function rebuildHabits() {
  const result = [];
  const seenIds = new Set();
  DEFAULT_HABITS.forEach(h => {
    if (seenIds.has(h.id)) return;
    seenIds.add(h.id);
    if (h.id === 'language' && state.languageSlot) {
      result.push({
        ...h,
        label: state.languageSlot.label || h.label,
        icon: state.languageSlot.icon || h.icon,
        color: state.languageSlot.color || h.color,
        targetA: state.languageSlot.targetA != null ? state.languageSlot.targetA : h.targetA,
        targetB: state.languageSlot.targetB != null ? state.languageSlot.targetB : h.targetB,
      });
    } else {
      result.push(h);
    }
  });
  (state.customHabits || []).forEach(ch => {
    if (!ch.id || seenIds.has(ch.id)) return;  // skip duplicates
    if (!ch.label || !ch.cat) return;  // skip invalid
    if (!CATEGORIES[ch.cat]) return;  // skip invalid category
    seenIds.add(ch.id);
    result.push({
      id: ch.id,
      label: ch.label,
      icon: ch.icon || '⭐',
      cat: ch.cat,
      color: ch.color || HABIT_COLORS[0],
      targetA: typeof ch.targetA === 'number' ? ch.targetA : 3,
      targetB: typeof ch.targetB === 'number' ? ch.targetB : 1,
      createdAt: ch.createdAt,
      fixed: false,
      custom: true,
    });
  });
  HABITS = result;
}

  return weekType === 'B' ? habit.targetB : habit.targetA;

  body: { label: 'Körper & Geist', icon: '🧠' },

function refreshToday() {
  const newToday = new Date();
  newToday.setHours(0,0,0,0);
  if (newToday.getTime() !== TODAY.getTime()) {
    TODAY = newToday;
    // Re-render to show new day correctly, but DON'T navigate

    if (typeof render === 'function' && state) {

// =============================================
// UTILITIES
// =============================================
function getISOWeek(date) {
  const target = new Date(date.valueOf());
  const dayNr = (date.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = target.valueOf();
  target.setMonth(0, 1);
  if (target.getDay() !== 4) {
    target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
  }
  return 1 + Math.ceil((firstThursday - target) / 604800000);
}

function startOfWeek(d) {
  const x = new Date(d);
  const day = x.getDay();
  const diff = (day < 1 ? -6 : 1) - day;
  x.setDate(x.getDate() + diff);
  x.setHours(0,0,0,0);
  return x;
}
function fmtDate(d) {
  // Use local timezone, not UTC (Bug #10 fix)
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function weekKey(d) { return fmtDate(startOfWeek(d)); }
function getQuarter(d) { return d.getFullYear() + '-Q' + (Math.floor(d.getMonth()/3)+1); }
function todayDayIdx() { return (TODAY.getDay()+6)%7; }
function isCurrentWeek() { return weekKey(state.currentWeek) === weekKey(TODAY); }
function getDay(wd, idx) { return (wd.days && wd.days[idx]) || {}; }
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uuid() {
  return 'g' + Date.now().toString(36) + Math.random().toString(36).substring(2, 7);
}
function dayOfYear() {
  // Compute via date components, not ms subtraction (DST-safe)
  const month = TODAY.getMonth(); // 0-11
  const day = TODAY.getDate();
  const year = TODAY.getFullYear();
  const daysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  // Adjust for leap year
  const isLeap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
  let total = day;
  for (let i = 0; i < month; i++) {
    total += daysInMonth[i] + (i === 1 && isLeap ? 1 : 0);
  }
  return total;
}

const GCAL_SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
const GCAL_DISCOVERY = 'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';
let gapiInited = false;
let gisInited = false;
let gcalTokenClient = null;
let gcalRefreshTimer = null;

// Called when gapi (apis.google.com/js/api.js) loads
function gapiLoadedReal() {
  gapi.load('client', async () => {
    try {
      await gapi.client.init({});
      await gapi.client.load(GCAL_DISCOVERY);
      gapiInited = true;
      tryAutoConnectGcal();
    } catch(e) {

    }
  });
}
window.gapiLoadedReal = gapiLoadedReal;

// Called when GIS (accounts.google.com/gsi/client) loads
function gisLoadedReal() {
  gisInited = true;
  tryAutoConnectGcal();
}
window.gisLoadedReal = gisLoadedReal;
if (window._gisReady) gisLoadedReal();

function gcalIsReady() {
  return gapiInited && gisInited;
}

// Initialize the OAuth token client (called once we have a clientId)
function gcalInitTokenClient() {
  if (!gisInited || !state.gcal.clientId) return;
  try {
    gcalTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: state.gcal.clientId,
      scope: GCAL_SCOPE,
      callback: '', // set per-request
    });
  } catch(e) {
    console.error('GIS initTokenClient failed:', e);
  }
}

// On load: if we have credentials AND were previously connected, try silent sign-in
function tryAutoConnectGcal() {
  if (!gcalIsReady()) return;
  if (!state.gcal.clientId || !state.gcal.apiKey) return;
  
  // Set API key
  try {
    gapi.client.setApiKey(state.gcal.apiKey);
  } catch(e) {
    console.error('setApiKey failed:', e);
    return;
  }
  
  gcalInitTokenClient();
  
  if (state.gcal.connected) {
    // Try silent token refresh (no popup)
    gcalRequestToken(true);
  }
}

// Request OAuth token. silent=true uses prompt='none' (no popup, fails if not auth'd)
function gcalRequestToken(silent) {
  return new Promise((resolve, reject) => {
    if (!gcalTokenClient) {
      reject(new Error('Token client not initialized'));
      return;
    }
    gcalTokenClient.callback = (resp) => {
      if (resp.error) {
        if (!silent) console.error('Token error:', resp);
        state.gcal.connected = false;
        saveLocal();
        reject(resp);
        return;
      }
      state.gcal.connected = true;
      saveLocal();
      // Fetch events immediately
      gcalFetchEvents().then(resolve).catch(reject);
    };
    try {
      gcalTokenClient.requestAccessToken({ prompt: silent ? 'none' : 'consent' });
    } catch(e) {
      reject(e);
    }
  });
}

// Disconnect: revoke token, clear state
function gcalDisconnect() {
  const token = gapi.client.getToken();
  if (token && token.access_token) {
    try {
      google.accounts.oauth2.revoke(token.access_token, () => {});
    } catch(e) {}
    gapi.client.setToken('');
  }
  state.gcal.connected = false;
  state.gcal.events = [];
  state.gcal.lastFetch = null;
  if (gcalRefreshTimer) {
    clearInterval(gcalRefreshTimer);
    gcalRefreshTimer = null;
  }
  saveLocal();
  render();
}

// Fetch upcoming events from ALL calendars
async function gcalFetchEvents() {
  if (!gapiInited || !state.gcal.connected) return [];
  
  try {
    // 1. Get calendar list
    const calListResp = await gapi.client.calendar.calendarList.list({ maxResults: 50 });
    const calendars = (calListResp.result && calListResp.result.items) || [];
    
    // 2. For each calendar, fetch events in next 48h
    const now = new Date();
    const tomorrow = new Date(now.getTime() + 48 * 3600 * 1000);
    const timeMin = now.toISOString();
    const timeMax = tomorrow.toISOString();
    
    const eventPromises = calendars
      .filter(c => c.selected !== false) // only user-selected calendars
      .map(cal => 
        gapi.client.calendar.events.list({
          calendarId: cal.id,
          timeMin: timeMin,
          timeMax: timeMax,
          singleEvents: true,
          orderBy: 'startTime',
          maxResults: 20,
          showDeleted: false,
        }).then(resp => {
          const items = (resp.result && resp.result.items) || [];
          return items.map(ev => ({
            id: cal.id + ':' + ev.id,
            title: ev.summary || '(ohne Titel)',
            start: ev.start.dateTime || ev.start.date,
            end: ev.end.dateTime || ev.end.date,
            allDay: !ev.start.dateTime,
            calendarName: cal.summary || '',
            calendarColor: cal.backgroundColor || '#7280f7',
            location: ev.location || '',
          }));
        }).catch(e => {
          console.warn('Failed to fetch events from', cal.summary, e);
          return [];
        })
      );
    
    const allArrays = await Promise.all(eventPromises);
    const allEvents = allArrays.flat();
    
    // Sort by start time
    allEvents.sort((a, b) => new Date(a.start) - new Date(b.start));
    
    state.gcal.events = allEvents;
    state.gcal.lastFetch = new Date().toISOString();
    saveLocal();
    
    return allEvents;
  } catch(e) {
    console.error('gcalFetchEvents failed:', e);
    // If 401, token expired — try to refresh silently
    if (e.status === 401 || (e.result && e.result.error && e.result.error.code === 401)) {
      try { await gcalRequestToken(true); } catch(refreshErr) {}
    }
    return [];
  }
}

// Schedule periodic refresh every 5 min
function gcalStartAutoRefresh() {
  if (gcalRefreshTimer) clearInterval(gcalRefreshTimer);
  gcalRefreshTimer = setInterval(() => {
    if (state.gcal.connected) gcalFetchEvents().then(() => render());
  }, 5 * 60 * 1000);
}

// Find the next upcoming event (not currently in progress, not past)
function gcalGetNextEvent() {
  if (!state.gcal.events || state.gcal.events.length === 0) return null;
  const now = new Date();
  return state.gcal.events.find(ev => {
    const start = new Date(ev.start);
    return start > now;
  }) || null;
}

// Find the event currently happening
function gcalGetCurrentEvent() {
  if (!state.gcal.events || state.gcal.events.length === 0) return null;
  const now = new Date();
  return state.gcal.events.find(ev => {
    const start = new Date(ev.start);
    const end = new Date(ev.end);
    return start <= now && now < end;
  }) || null;
}

function formatTimeUntil(targetDate) {
  const now = new Date();
  const diffMs = new Date(targetDate) - now;
  if (diffMs < 0) return 'jetzt';
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 1) return 'gleich';
  if (diffMin < 60) return 'in ' + diffMin + ' Min';
  const diffH = Math.floor(diffMin / 60);
  const restMin = diffMin % 60;
  if (diffH < 24) {
    return 'in ' + diffH + 'h' + (restMin > 0 ? ' ' + restMin + 'm' : '');
  }
  return 'in ' + Math.floor(diffH / 24) + ' Tagen';
}

function formatEventTime(isoStr, allDay) {
  if (allDay) return 'Ganztägig';
  const d = new Date(isoStr);
  return d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
}

// VOCAB - Languages, SM-2 algorithm
// =============================================
const LANGUAGES = {
  'ch': { label: 'Schweizerdeutsch', flag: '🇨🇭', short: 'CH' },
  'en': { label: 'Englisch', flag: '🇬🇧', short: 'EN' },
  'es': { label: 'Spanisch', flag: '🇪🇸', short: 'ES' },
  'no': { label: 'Norwegisch', flag: '🇳🇴', short: 'NO' },
};

function vocabUuid() {
  // Use crypto.randomUUID if available (modern browsers)
  if (typeof crypto !== 'undefined' && crypto.randomUUID) {
    return 'v' + crypto.randomUUID().replace(/-/g, '').substring(0, 16);
  }
  // Fallback: extended random string for lower collision risk
  return 'v' + Date.now().toString(36) + Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 6);
}

function getVocabCards() {
  return state.vocab && state.vocab.cards ? state.vocab.cards : {};
}

function todayDateStr() {
  return fmtDate(TODAY);
}

// Convert date-string to days since epoch for due-date comparison
// Round to nearest integer to avoid DST fractional-day issues
function dateToEpochDay(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return Math.round(new Date(y, m-1, d).getTime() / 86400000);
}

function addDaysToDate(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return fmtDate(dt);
}

// SM-2 ALGORITHM (Piotr Wozniak, 1987)
// quality: 0-5
//   0 = complete blackout
//   1 = incorrect, but answer remembered after seeing
//   2 = incorrect, but answer felt easy in hindsight
//   3 = correct, with serious difficulty
//   4 = correct, after hesitation
//   5 = perfect
const SM2_BOUNDS = {
  EF_MIN: 1.3,
  EF_MAX: 3.5,        // cap to prevent interval explosion (Anki default behavior)
  INTERVAL_MIN: 1,
  INTERVAL_MAX: 36500, // 100 years — far above any realistic need
};

function sm2(card, quality) {
  // Defensive defaults — handle malformed/missing card fields
  let ef = (typeof card.ef === 'number' && isFinite(card.ef)) ? card.ef : 2.5;
  let interval = (typeof card.interval === 'number' && isFinite(card.interval) && card.interval > 0) ? card.interval : 0;
  let reps = (typeof card.reps === 'number' && isFinite(card.reps) && card.reps >= 0) ? Math.floor(card.reps) : 0;
  
  // Defensive: handle NaN, non-numeric, or out-of-range quality
  if (typeof quality !== 'number' || !isFinite(quality)) quality = 0;
  quality = Math.max(0, Math.min(5, Math.round(quality)));
  
  if (quality < 3) {
    // Failed: reset progress
    reps = 0;
    interval = 1;
    // EF stays unchanged on failure
  } else {
    if (reps === 0) interval = 1;
    else if (reps === 1) interval = 6;
    else interval = Math.ceil(interval * ef);
    reps += 1;
    // Update ease factor (round to 3 decimals to prevent float drift)
    ef = Math.round((ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02))) * 1000) / 1000;
    if (ef < SM2_BOUNDS.EF_MIN) ef = SM2_BOUNDS.EF_MIN;
    if (ef > SM2_BOUNDS.EF_MAX) ef = SM2_BOUNDS.EF_MAX;
  }
  
  // Final bounds on interval
  interval = Math.max(SM2_BOUNDS.INTERVAL_MIN, Math.min(SM2_BOUNDS.INTERVAL_MAX, Math.ceil(interval)));
  
  return { ef, interval, reps };
}

function reviewCard(cardId, quality) {
  const card = state.vocab.cards[cardId];
  if (!card) return;
  
  const result = sm2(card, quality);
  
  // Apply to card
  card.ef = result.ef;
  card.interval = result.interval;
  card.reps = result.reps;
  card.lastReview = todayDateStr();
  card.due = addDaysToDate(todayDateStr(), result.interval);
  
  // Track history
  if (!card.history) card.history = [];
  card.history.push({ date: todayDateStr(), q: quality, interval: result.interval });
  // Keep last 50 reviews to limit storage
  if (card.history.length > 50) card.history = card.history.slice(-50);
}

function getDueCards(today, applyLimit) {
  today = today || todayDateStr();
  if (applyLimit === undefined) applyLimit = true;
  const todayEpoch = dateToEpochDay(today);
  const cards = state.vocab.cards || {};
  const dueReview = [];
  const newCards = [];
  Object.values(cards).forEach(c => {
    if (!c.due || c.reps === 0) {
      newCards.push(c);
    } else if (dateToEpochDay(c.due) <= todayEpoch) {
      dueReview.push(c);
    }
  });
  // Sort review cards: most overdue first
  dueReview.sort((a, b) => dateToEpochDay(a.due) - dateToEpochDay(b.due));
  // Sort new cards: oldest first (encourages learning order)
  newCards.sort((a, b) => (a.created || '').localeCompare(b.created || ''));
  
  // SIBLING BURYING: if a card was already reviewed today, hide its sibling
  // (the other direction of the same word pair). Prevents seeing both
  // "Grüezi → Hallo" AND "Hallo → Grüezi" in the same session.
  const reviewedTodayBases = new Set();
  Object.values(cards).forEach(c => {
    if (c.lastReview === today) {
      const baseId = c.id.replace(/_[fb]$/, '');
      reviewedTodayBases.add(baseId);
    }
  });
  const filterSiblings = c => {
    const baseId = c.id.replace(/_[fb]$/, '');
    return !reviewedTodayBases.has(baseId);
  };
  const filteredReview = dueReview.filter(filterSiblings);
  const filteredNew = newCards.filter(filterSiblings);
  
  if (!applyLimit) {
    return [...filteredReview, ...filteredNew];
  }
  
  const limit = (state.vocab.settings && state.vocab.settings.dailyLimit) || 20;
  const newCardsLimited = filteredNew.slice(0, Math.max(0, limit));
  return [...filteredReview, ...newCardsLimited];
}

function getDueCardsCount() {
  const today = todayDateStr();
  const todayEpoch = dateToEpochDay(today);
  // Account for sibling burying in counts
  const reviewedTodayBases = new Set();
  Object.values(state.vocab.cards || {}).forEach(c => {
    if (c.lastReview === today) {
      const baseId = c.id.replace(/_[fb]$/, '');
      reviewedTodayBases.add(baseId);
    }
  });
  let due = 0, newCount = 0;
  Object.values(state.vocab.cards || {}).forEach(c => {
    const baseId = c.id.replace(/_[fb]$/, '');
    if (reviewedTodayBases.has(baseId)) return;  // skip sibling
    if (!c.due || c.reps === 0) newCount++;
    else if (dateToEpochDay(c.due) <= todayEpoch) due++;
  });
  return { due, newCount, total: due + newCount };
}

function getCardsByLanguage() {
  const cards = Object.values(state.vocab.cards || {});
  const byLang = { ch: [], en: [], es: [], no: [] };
  cards.forEach(c => {
    if (byLang[c.lang]) byLang[c.lang].push(c);
  });
  return byLang;
}

function getCardStatus(card) {
  if (!card.reps || card.reps === 0) return 'new';
  if (card.reps < 3) return 'learning';
  if (card.reps < 7) return 'review';
  return 'mature';
}

function addVocabPair(lang, source, target, force) {
  if (!state.vocab) state.vocab = { cards: {}, settings: {} };
  if (!state.vocab.cards) state.vocab.cards = {};
  
  // Defensive validation
  source = String(source || '').trim().slice(0, 500);
  target = String(target || '').trim().slice(0, 500);
  if (!source || !target) return { added: false, reason: 'empty' };
  if (!LANGUAGES[lang]) return { added: false, reason: 'invalid_lang' };
  
  // Duplicate detection (unless force=true)
  if (!force) {
    const sourceLower = source.toLowerCase();
    const existing = Object.values(state.vocab.cards).find(c => 
      c.dir === 'forward' && c.lang === lang && c.source.toLowerCase() === sourceLower
    );
    if (existing) {
      return { added: false, reason: 'duplicate', existing };
    }
  }
  
  const now = todayDateStr();
  const baseId = vocabUuid();
  
  state.vocab.cards[baseId + '_f'] = {
    id: baseId + '_f',
    source, target, lang,
    dir: 'forward',
    ef: 2.5, interval: 0, reps: 0,
    due: null, lastReview: null,
    created: now,
    history: [],
  };
  state.vocab.cards[baseId + '_b'] = {
    id: baseId + '_b',
    source, target, lang,
    dir: 'backward',
    ef: 2.5, interval: 0, reps: 0,
    due: null, lastReview: null,
    created: now,
    history: [],
  };
  
  return { added: true };
}

function deleteVocabPair(cardId) {
  // Delete both forward and backward
  const baseId = cardId.replace(/_[fb]$/, '');
  delete state.vocab.cards[baseId + '_f'];
  delete state.vocab.cards[baseId + '_b'];
}

// Validate and sanitize a vocab state object (from sync/import).
// Returns clean { cards, settings } object, dropping invalid entries.
function validateVocab(rawVocab) {
  const result = {
    cards: {},
    settings: { dailyLimit: 20, activeLanguages: ['en', 'es', 'ch', 'no'] },
  };
  if (!rawVocab || typeof rawVocab !== 'object') return result;
  
  // Merge settings safely
  if (rawVocab.settings && typeof rawVocab.settings === 'object') {
    const s = rawVocab.settings;
    if (typeof s.dailyLimit === 'number' && s.dailyLimit > 0 && s.dailyLimit < 1000) {
      result.settings.dailyLimit = Math.floor(s.dailyLimit);
    }
    if (Array.isArray(s.activeLanguages)) {
      result.settings.activeLanguages = s.activeLanguages.filter(l => LANGUAGES[l]);
    }
    if (s.lastLang && LANGUAGES[s.lastLang]) {
      result.settings.lastLang = s.lastLang;
    }
  }
  
  // Validate each card
  const rawCards = (rawVocab.cards && typeof rawVocab.cards === 'object') ? rawVocab.cards : {};
  Object.keys(rawCards).forEach(cardId => {
    const c = rawCards[cardId];
    if (!c || typeof c !== 'object') return;
    if (!c.source || !c.target) return;
    if (!LANGUAGES[c.lang]) return;
    if (c.dir !== 'forward' && c.dir !== 'backward') return;
    result.cards[cardId] = {
      id: c.id || cardId,
      source: String(c.source).slice(0, 500),
      target: String(c.target).slice(0, 500),
      lang: c.lang,
      dir: c.dir,
      ef: (typeof c.ef === 'number' && isFinite(c.ef)) ? c.ef : 2.5,
      interval: (typeof c.interval === 'number' && isFinite(c.interval) && c.interval >= 0) ? c.interval : 0,
      reps: (typeof c.reps === 'number' && isFinite(c.reps) && c.reps >= 0) ? Math.floor(c.reps) : 0,
      due: c.due || null,
      lastReview: c.lastReview || null,
      created: c.created || todayDateStr(),
      history: Array.isArray(c.history) ? c.history.slice(-50) : [],
    };
  });
  return result;
}

// THEME SYSTEM
// =============================================
function applyTheme() {
  let effectiveTheme = state.theme;
  if (state.theme === 'auto') {
    effectiveTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', effectiveTheme);
  // Update ALL meta theme-color tags for iOS status bar consistency
  const color = effectiveTheme === 'dark' ? '#0a0f1c' : '#fafaf9';
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    m.setAttribute('content', color);
  });
}

// Watch system theme changes when in auto mode

const LS_KEY = 'lifeTracker_v4';

function saveLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      weeks: state.weeks, goals: state.goals, github: state.github,
      northStar: state.northStar, theme: state.theme,
      customHabits: state.customHabits, languageSlot: state.languageSlot,
      vocab: state.vocab,
      gcal: { 
        clientId: state.gcal.clientId, 
        apiKey: state.gcal.apiKey,
        connected: state.gcal.connected,
        events: state.gcal.events,
        lastFetch: state.gcal.lastFetch,
      },
    }));
  } catch(e) {
    if (e.name === 'QuotaExceededError' || e.code === 22) {
      console.error('Storage voll. Nutze Sync oder Export.');
    } else {
      console.error('Save failed:', e);
    }
  }
}

// Debounced version for high-frequency input events
let saveLocalTimer = null;
function saveLocalDebounced() {
  clearTimeout(saveLocalTimer);
  saveLocalTimer = setTimeout(saveLocal, 500);
}

// Force-save pending changes when tab is about to close
if (typeof window !== 'undefined') {
  window.addEventListener('beforeunload', () => {
    if (saveLocalTimer) {
      clearTimeout(saveLocalTimer);
      saveLocal();
    }
  });
  // Also save when tab becomes hidden (iOS Safari closing)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && saveLocalTimer) {
      clearTimeout(saveLocalTimer);
      saveLocal();
    }
  });
}

function loadLocal() {
  try {
    let raw = localStorage.getItem(LS_KEY);
    if (!raw) raw = localStorage.getItem('lifeTracker_v3');
    if (!raw) raw = localStorage.getItem('lifeTracker_v2');
    if (raw) {
      const d = JSON.parse(raw);
      state.weeks = d.weeks || {};
      state.northStar = d.northStar || '';
      state.theme = d.theme || 'auto';
      state.customHabits = d.customHabits || [];
      state.languageSlot = d.languageSlot || null;
      // Load vocab with validation
      if (d.vocab) {
        state.vocab = validateVocab(d.vocab);
      }
      // Load gcal (credentials + cached events)
      if (d.gcal && typeof d.gcal === 'object') {
        state.gcal.clientId = String(d.gcal.clientId || '').slice(0, 200);
        state.gcal.apiKey = String(d.gcal.apiKey || '').slice(0, 200);
        state.gcal.connected = !!d.gcal.connected;
        state.gcal.events = Array.isArray(d.gcal.events) ? d.gcal.events : [];
        state.gcal.lastFetch = d.gcal.lastFetch || null;
      }
      
      // Migrate weekNote → reflection.output for backward compat
      Object.values(state.weeks).forEach(wd => {
        if (wd.weekNote && !wd.reflection) {
          wd.reflection = { output: wd.weekNote, energy: '', change: '' };
        }
        // Migrate habit ID: spanish → language
        if (wd.days) {
          Object.keys(wd.days).forEach(dayIdx => {
            const day = wd.days[dayIdx];
            if (day && day.spanish !== undefined) {
              day.language = day.spanish;
              delete day.spanish;
            }
          });
        }
      });
      
      // Migrate old goals format to new
      const rawGoals = d.goals || {};
      const newGoals = {};
      Object.keys(rawGoals).forEach(key => {
        const g = rawGoals[key];
        if (g.title) {
          newGoals[key] = g;
        } else if (g.text) {
          const parts = key.split('-');
          const quarter = parts.slice(0,2).join('-');
          const category = parts[2] || 'other';
          newGoals[key] = {
            quarter, category,
            title: g.text,
            done: g.done || false,
            createdAt: new Date().toISOString(),
          };
        }
      });
      state.goals = newGoals;
      state.github = Object.assign({}, state.github, d.github || {});
    }
  } catch(e) { console.error('Load failed', e); }
  rebuildHabits();
}

// GITHUB GIST SYNC
