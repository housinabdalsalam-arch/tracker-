<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <rect width="180" height="180" fill="url(#bg)"/>
  <g transform="translate(90 90)">
    <!-- subtle outer ring -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#fbbf24" stroke-width="0.4" opacity="0.25"/>
    <!-- 8 short compass tick marks -->
    <g stroke="#fbbf24" stroke-width="0.7" opacity="0.3">
      <line x1="0" y1="-60" x2="0" y2="-54"/>
      <line x1="0" y1="60" x2="0" y2="54"/>
      <line x1="-60" y1="0" x2="-54" y2="0"/>
      <line x1="60" y1="0" x2="54" y2="0"/>
      <line x1="-42" y1="-42" x2="-37.5" y2="-37.5"/>
      <line x1="42" y1="-42" x2="37.5" y2="-37.5"/>
      <line x1="-42" y1="42" x2="-37.5" y2="37.5"/>
      <line x1="42" y1="42" x2="37.5" y2="37.5"/>
    </g>
    <!-- 4 main beams (long, brighter) -->
    <polygon points="0,-50 4.5,-6 0,0 -4.5,-6" fill="#fbbf24" opacity="0.9"/>
    <polygon points="0,50 4.5,6 0,0 -4.5,6" fill="#fbbf24" opacity="0.7"/>
    <polygon points="-50,0 -6,4.5 0,0 -6,-4.5" fill="#fbbf24" opacity="0.7"/>
    <polygon points="50,0 6,4.5 0,0 6,-4.5" fill="#fbbf24" opacity="0.7"/>
    <!-- 4 diagonal beams (short) -->
    <polygon points="-33,-33 -4.5,-2.25 0,0 -2.25,-4.5" fill="#fbbf24" opacity="0.5"/>
    <polygon points="33,-33 4.5,-2.25 0,0 2.25,-4.5" fill="#fbbf24" opacity="0.5"/>
    <polygon points="-33,33 -4.5,2.25 0,0 -2.25,4.5" fill="#fbbf24" opacity="0.5"/>
    <polygon points="33,33 4.5,2.25 0,0 2.25,4.5" fill="#fbbf24" opacity="0.5"/>
    <!-- center luminous point -->
    <circle cx="0" cy="0" r="4.5" fill="#fef3c7"/>
    <circle cx="0" cy="0" r="1.5" fill="#fbbf24"/>
  </g>
</svg>
