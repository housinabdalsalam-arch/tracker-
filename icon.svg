<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" fill="url(#bg)"/>
  
  <!-- Soft glow halo -->
  <circle cx="90" cy="90" r="80" fill="url(#glow)"/>
  
  <g transform="translate(90 90)">
    <!-- Outer compass ring -->
    <circle cx="0" cy="0" r="78" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.3"/>
    
    <!-- 8 compass tick marks (longer, more visible) -->
    <g stroke="#fbbf24" stroke-width="1.2" opacity="0.5" stroke-linecap="round">
      <line x1="0" y1="-78" x2="0" y2="-66"/>
      <line x1="0" y1="78" x2="0" y2="66"/>
      <line x1="-78" y1="0" x2="-66" y2="0"/>
      <line x1="78" y1="0" x2="66" y2="0"/>
      <line x1="-55" y1="-55" x2="-47" y2="-47"/>
      <line x1="55" y1="-55" x2="47" y2="-47"/>
      <line x1="-55" y1="55" x2="-47" y2="47"/>
      <line x1="55" y1="55" x2="47" y2="47"/>
    </g>
    
    <!-- 4 long main beams (bigger, more prominent) -->
    <polygon points="0,-68 7,-9 0,0 -7,-9" fill="#fbbf24" opacity="1"/>
    <polygon points="0,68 7,9 0,0 -7,9" fill="#fbbf24" opacity="0.85"/>
    <polygon points="-68,0 -9,7 0,0 -9,-7" fill="#fbbf24" opacity="0.85"/>
    <polygon points="68,0 9,7 0,0 9,-7" fill="#fbbf24" opacity="0.85"/>
    
    <!-- 4 diagonal beams (medium) -->
    <polygon points="-48,-48 -6,-3 0,0 -3,-6" fill="#fbbf24" opacity="0.65"/>
    <polygon points="48,-48 6,-3 0,0 3,-6" fill="#fbbf24" opacity="0.65"/>
    <polygon points="-48,48 -6,3 0,0 -3,6" fill="#fbbf24" opacity="0.65"/>
    <polygon points="48,48 6,3 0,0 3,6" fill="#fbbf24" opacity="0.65"/>
    
    <!-- Center luminous point (larger, more visible) -->
    <circle cx="0" cy="0" r="7" fill="#fef3c7"/>
    <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
  </g>
</svg>
